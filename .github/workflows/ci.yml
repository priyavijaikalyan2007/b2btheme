name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to the major tag, bumped v4 -> v7 on 2026-10-22. Every run
      # was printing "Node.js 20 is deprecated … being forced to run on
      # Node.js 24" for all three: they still worked, on a grace GitHub
      # had already announced the end of. A warning that names its own
      # expiry is not a warning you get to keep ignoring.
      #
      # Node 24 matches what Cloudflare Workers Builds compiles the deployed
      # bundle with (v24.18.0, read from the live /build.json). Node 20 could
      # not run the suite at all: check [16] imports `globSync` from `node:fs`,
      # added in Node 22, so it threw a SyntaxError on every run (CI-1,
      # ADR-170). GitHub is also deprecating Node 20 on its runners.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The full build, not build:css + build:ts alone. test-local.sh checks
      # dist/components/*.css, the manifest, the docs and build.json, none of
      # which the two partial steps produce, and its header says to run it
      # after `npm run build`.
      - name: Build
        run: npm run build

      # A published A2UI catalog baseline may grow but never be deleted or
      # broken (#28). The generator and check [29] compare the build with
      # whatever baseline is committed, so they cannot catch "delete it and
      # write it again"; the base branch's copy is the anchor. The checkout
      # is shallow, so fetch the one commit compared with.
      - name: Published catalog baselines only grow
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            npm run check:baselines -- FETCH_HEAD
          else
            git fetch --no-tags --depth=1 origin "$BEFORE"
            npm run check:baselines -- "$BEFORE"
          fi

      # `npm audit --omit=dev` reports 0 for this repository and always
      # will: there are no runtime dependencies, because every library
      # it serves is vendored out of devDependencies into dist/lib. That
      # is how a CRITICAL in dompurify stayed invisible on 2026-10-23
      # while this origin served it. This step audits the set the
      # manifest says we SERVE, read from esbuild's metafile, and a push
      # to main deploys — so it belongs before the deploy, not after.
      - name: Audit the packages this origin serves
        run: npm run audit:vendor

      - name: Typecheck the runtime
        run: npm run typecheck:runtime

      - name: Typecheck the A2UI adapter
        run: npm run typecheck:a2ui

      - name: Typecheck the A2UI playground
        run: npm run typecheck:agentdemo

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      # The 32 structure checks ran locally only until 2026-10-13, so a
      # tracked count could rise in a branch this workflow called green
      # (AUDIT-1, ADR-168). Check [20] ratchets those counts and is the
      # reason this step exists.
      - name: Run structure checks
        run: npm run test:structure

      # The A2UI testing bar (readiness spec §6, ADR-223): render every
      # catalog component and drive the interactive ones in a real browser,
      # against the dist tree built above. It ran locally only until
      # 2026-10-28, so a component could join the catalog broken in a branch
      # this workflow called green. Public repositories run standard hosted
      # runners at no charge; the suite itself takes about 7 seconds, and the
      # browser install most of the rest. The other e2e specs stay local
      # until someone measures them on Linux.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run A2UI browser tests
        run: npm run test:e2e:a2ui

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
