# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # typia 15 runs only as a Go plugin under ttsc, which needs TypeScript 7.
      # scripts/agentui/schema.mjs drives typia's transformer in-process
      # through the TypeScript 5.9 compiler API, so a move is a migration,
      # not a bump (#101). Tracked in #146.
      - dependency-name: "typia"
        update-types: ["version-update:semver-major"]
      # Served at /lib/signalr-<version>.js, and a build serves only the
      # current version, so a major bump makes the pinned URL the apps load
      # return 404. Move it together with the apps (#145). Tracked in #147.
      - dependency-name: "@microsoft/signalr"
        update-types: ["version-update:semver-major"]
      # Served at /lib/font-awesome-<version>/, which the apps load on most
      # pages with its hash, and a build serves only the current version, so
      # a bump makes those URLs return 404 (#158). Tracked in #147.
      - dependency-name: "@fortawesome/fontawesome-free"
        update-types: ["version-update:semver-major"]
    groups:
      # The A2UI packages move together. a2ui-runtime bundles web_core and
      # lit, and one file cannot hold two versions of one package (#152).
      # @a2ui/markdown-it may lag behind: see _comment_overrides_a2ui in
      # package.json (#155).
      a2ui:
        patterns: ["@a2ui/*"]
