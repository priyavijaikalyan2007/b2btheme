    Combined approach: infer from callback + explicit override. Added showAddButton
    option to RelationshipManagerOptions. Effective logic:
    show = opts.showAddButton ?? (typeof opts.onCreateRelationship === 'function').
    Button always created in DOM (for toggle via setReadOnly), visibility controlled
    by syncAddBtnVisibility() called from buildHeader() and rebuild(). canCreate()
