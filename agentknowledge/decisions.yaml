- id: "ADR-104"
  title: "ExplorerPicker — self-contained resource-selection widget with inline tree renderer"
  date: "2026-04-05"
  status: "Accepted"
  context: "Five cross-app workflows require users to select Explorer resources. Rather than depending on the existing TreeView (5,160 lines, includes DnD/rename/context menus), ExplorerPicker inlines a purpose-built tree renderer scoped to selection-only concerns. Self-contained as single JS+CSS for CDN deployment in browser plugins and third-party integrations. Ontology-driven icon resolution with graceful degradation. Chrome integration via _chrome.scss mixins (hover-glow, focus-glow, edge-shadow). Virtual scrolling at 200+ visible nodes. State export/restore for session continuity. 82 tests."
  files:
