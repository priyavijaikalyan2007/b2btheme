- id: "ADR-154"
  title: "WorkspaceSwitcher becomes TenantSwitcher; both names ship for one release"
  date: "2026-10-08"
  status: "Accepted"
  context: |
    Requested by the consuming apps team as knobbyio/apps #255, filed in
    specs/workspace-switcher-rename.md.

    The platform used "workspace" and "tenant" for ONE concept, and the
    ambiguity produced real bugs on their side rather than merely reading
    badly: two tables stored the value twice under both names with nothing
    keeping the copies equal, one entity class existed twice with the
    correctly named one dead, a schema comment saying "workspace == tenant in
    current model" was true but was NOT a constraint so a fixture created
    rows where they disagreed, and a unique-index test named
    SameResourceInDifferentTenants never used two tenants.

    They renamed everything they own. This component was the last place the
    old word survived, because it is ours, and they were translating across
    the boundary in three lines with a comment explaining why.

    THE REQUEST WAS OVERTAKEN BY AN OUTAGE. They pointed their script tag at
    /components/tenantswitcher/ before we published it:

        Failed to load resource: 404
        [ShellTenants] loadUserTenants: CDN WorkspaceSwitcher not loaded

    Their call site was never at fault — correctly guarded, still calling
    window.createWorkspaceSwitcher. The 404 meant the global never existed.
    Their guard behaved exactly as ADR-148 asks: it reported a missing
    dependency instead of rendering a stand-in, which is why this surfaced as
    a named error against a 404 rather than an empty switcher nobody noticed.

    D1 Rename the FOLDER, because the folder name is the CDN path and the
       path is what was 404ing. Renaming only the API would not have fixed
       the outage.
    D2 Publish byte-identical artifacts at the OLD path for one release, as a
       build copy step rather than a shim. A shim would need the new bundle
       already loaded; a copy cannot drift.
    D3 Keep both globals, and have createWorkspaceSwitcher accept the OLD
       option names (workspaces, activeWorkspaceId), forward them, and warn.
       Keep the legacy methods forwarding too. The script tag and the option
       names can then move in separate changes, which is the point of
       overlapping a release.
    D4 Dated specs written before the rename keep saying WorkspaceSwitcher.
       They are historical record. The TenantSwitcher concept entry carries
       the former name so a search for it still resolves.
  consequences: |
    + The apps shell works again, verified against the live CDN: all four
      URLs 200 and both globals present in the shipped bundle.
    + A consumer who has not moved is unaffected, which is what the reporting
      team asked for and what their own outage demonstrated the need for.
    + Four tests assert the deprecated surface WORKS rather than merely
      exists — mounting through the old names, the warning, method
      forwarding, and new names winning when both are supplied.
      Mutation-tested by breaking the forwarding.
    - Two CDN paths serve the same component until the deprecation lapses,
      and the copy step must be removed with it. Recorded as DEBT-TS-1 so the
      removal is scheduled rather than forgotten.
    - The repo now has a component folder whose name differs from every spec
      written before today. Mitigated by the concept entry resolving the old
      name, not by rewriting the specs.
    - A lesson rather than a consequence: the request said "whenever it suits
      you", and we treated it as unhurried. The consumer moved first and took
      an outage. A rename that spans two repositories needs the PRODUCER to
      ship the new path first, and that sequencing should have been stated in
      the reply rather than assumed.
  files:
    - "components/tenantswitcher/tenantswitcher.ts"
    - "components/tenantswitcher/tenantswitcher.test.ts"
    - "specs/tenantswitcher.prd.md"
    - "specs/workspace-switcher-rename.md"
    - "package.json"

- id: "ADR-155"
  title: "Two more colour gates — elevation agreement, and series separability under CVD"
  date: "2026-10-08"
  status: "Accepted"
  context: |
    DEBT-VR-2 and DEBT-VR-9, the last two colour gaps the earlier gates named
    but could not cover.

    DEBT-VR-2 — the shadow scale is declared THREE times: Sass $shadow-*
    (30 call sites), CSS --theme-shadow-* (67), and Bootstrap's own
    $box-shadow (dropdowns, modals, popovers). The copies drifted twice in
    four ADRs. ADR-147 updated two and missed Bootstrap's, leaving the most
    visible overlays on the old single-blur smudge. ADR-151 then found
    Bootstrap's was never redefined in the DARK block either, so those
    overlays cast light-tinted shadows on a near-black ground. Both were
    caught by a human noticing.

    DEBT-VR-9 — check [13] asks whether a palette can carry TEXT. Chart
    series, status dots and connector lines carry none, so it skips them, and
    a different question applies: can two series be told apart? For roughly
    1 in 12 men the answer differs from the author's.

    D1 Elevation agreement is GEOMETRY and ALPHAS, not bytes. The layers
       legitimately spell the same colour differently —
       rgba($gray-900, 0.07) against rgba(var(--theme-shadow-rgb), 0.07) —
       and comparing text would fail on a difference that does not exist.
    D2 Dark is NOT compared to light. ADR-151 deliberately gave dark
       elevations a hairline light ring and doubled alphas. Dark is checked
       for PRESENCE instead: that every --bs-box-shadow* is redefined there
       at all, which is the exact thing that was missing.
    D3 Series separability is measured as CIE76 ΔE in Lab after simulating
       protanopia, deuteranopia and tritanopia (Viénot-Brettel-Mollon 1999).
       Lab because distance there approximates perceived difference; RGB
       distance does not.
    D4 MEASURED, NOTHING WAS BROKEN in the series palettes — all five clear
       ΔE 10 under every deficiency, tightest activityfeed at 11.2. The gate
       was still written, because the cheapest moment to add one is while the
       answer is already green.
  consequences: |
    + Both historical elevation drifts are now caught automatically; the
      mutation tests are literally those two failures reproduced.
    + The CVD gate was proven by mutation with #8a843c — ΔE 72.3 from #dc3545
      with normal vision and 0.3 under deuteranopia. That is the bug class
      exactly: invisible to the author, disabling for the reader.
    - THE CHECKER NEEDED THREE FIXES WHILE THE THEME WAS CORRECT THROUGHOUT,
      and each read as a real failure: a missing re.M made ^ match only the
      file start; a flat dict kept the DARK --theme-shadow-* because
      _dark-mode.scss declares them twice; and an alpha regex using [^)]*
      stopped at the ) inside var(. Reinforces AGENT_INSIGHTS 6.22 from the
      other direction — proving the failures were the instrument's took
      longer than writing the gate.
    - ΔE 10 is a rule of thumb for side-by-side swatches, not a standard. It
      says nothing about thin lines or small dots, where the same pair reads
      differently, and it does NOT discharge WCAG 1.4.1 — colour must still
      not be the only channel. The gate makes colour a usable SECOND channel.
    - Six duplicate -ORIG debt entries were removed in the same pass. They
      were left behind when earlier items were resolved and still read as
      open; a debt list nobody trusts is worse than no list.
  files:
    - "scripts/check-elevation.py"
    - "scripts/check-series-palettes.py"
    - "test-local.sh"
    - "src/scss/_variables.scss"

- id: "ADR-156"
  title: "A filled region is not an interaction state — --theme-fill-strong"
  date: "2026-10-08"
  status: "Accepted"
  context: |
    DEBT-VR-1. 26 regions across 23 components painted themselves with
    --theme-active-bg: a tab strip, a kbd chip, a skipped step marker, a
    progress track. None of them respond to a pointer. ADR-147 D3 made the
    state layers TRANSLUCENT so they could composite over any surface, and
    all 26 silently became translucent with them, inheriting whatever
    happened to sit behind. The result was close enough to the old
    appearance to pass review and wrong in principle: a filled neutral chip
    is not a thing the user is hovering.

    Recorded here late — the code shipped in 56032cc referencing ADR-156
    while the decision itself was never written down. The dangling reference
    is the symptom the elevation gate exists to catch, in prose instead of
    CSS.
  decision: |
    D1 ADD --theme-fill-strong, opaque, valued mid-range of what those sites
       previously composited to (light #e4e8ee, dark #222b3a). The visual
       change is near-invisible BY DESIGN; the token change is the point.
    D2 A FILL MUST LEAVE HEADROOM for a state layer above it. Fills were
       added to check [12]'s sweep, which immediately found four dark-mode
       failures — a hovered row ON a filled strip, worst 3.98. The fills are
       darker than first chosen for this reason, not for their own contrast.
    D3 DELETE --theme-fill-subtle rather than keep it for later. It was
       created as the pair and ended with zero consumers; its light value
       measured 1.022 against chrome, which is very nearly invisible. An
       unused token that has already failed a visibility check is worse than
       no token, because the next author will reach for it.
  consequences: |
    + 60 composited pairs now checked per theme, all passing.
    - MY OWN HEURISTIC MISCLASSIFIED 8 OF 34. It looked for :hover and
      .active, so it read -highlighted, -focused and -expanded suffixes as
      static fills — but a keyboard-highlighted row IS an interaction state.
      Those eight were reverted. A script-applied sweep needs a second pass
      with a DIFFERENT pattern, because the first pattern is also what
      decided the answer. See AGENT_INSIGHTS 6.33.
  files:
    - "src/scss/_dark-mode.scss"
    - "scripts/check-contrast.py"

- id: "ADR-157"
  title: "Three closures: an AST gate for fabricated reads, a footer that wrapped nothing, and transitive advisories"
  date: "2026-10-09"
  status: "Accepted"
  context: |
    The last substantive items from the ADR-148 and ADR-146 follow-ups.

    DEBT-FAB-2 — check [9] matches NAMES, so it sees only a stand-in that
    announces itself (createNullPicker, buildFallbackApi). ADR-148 named
    three shapes it cannot see, and the worst instance in that whole audit
    was one of them: DynamicFormSwitcher.fallbackDefault invented a typed
    value for a field that never mounted and fed it straight into
    getValues(). It was found by hand. A regex pass over catch blocks was
    prototyped and produced 25 hits of which roughly four were real, because
    a regex cannot tell whether a `return` is INSIDE the catch or merely
    after it.

    DEBT-WEB-3 — the 11 Playwright tests for MarketingHero and SiteFooter
    had NEVER EXECUTED. Chromium would not install on Node v26. Everything
    they assert is layout jsdom cannot compute, so the two components were
    verified only by eye.

    DEBT-SEC-3 — sass held at 1.95.1 because 1.104 changes the SHIPPED
    stylesheet (SVG data-URI colours serialise as percentage rgb()). The
    entry justified the deferral partly on "npm audit is already 0". That
    premise had quietly expired: audit showed 5 advisories, and sass is one
    of five packages pulling source-map-js.
  decision: |
    D1 ANSWER THE STRUCTURAL QUESTION STRUCTURALLY. check [16] walks the
       TypeScript AST (ts.createSourceFile, ts.forEachChild) and flags a
       `return` lexically inside a failure context — a catch clause, or the
       THEN branch of a guard testing absence — whose value is an object
       literal carrying a read method, or a fabricated primitive from a
       function whose own name admits it is a fallback.
    D2 `default` IS EXCLUDED FROM THE NAME PATTERN. With it, the gate
       flagged seven comparators and serializers: defaultCompare returning
       1/-1 for a null operand is a sort function doing its job. In practice
       `defaultX` names "the built-in implementation of X" while `fallbackX`
       names "a value used when the real one is unavailable". Only the second
       is this gate's concern, and fallbackDefault matches on `fallback`.
    D3 DECLARE overflow-wrap ONCE AT .sitefooter AND INHERIT. The
       per-element version was tried first — on the contact block and the
       links — and missed .sitefooter-orgdesc, the one block whose entire
       job is prose. `anywhere` rather than `break-word` because it also
       shrinks min-content, which is what lets the grid's minmax(0, 1fr) do
       its half of the work.
    D4 AN OVERFLOW ASSERTION MUST NAME THE ELEMENT. scrollWidth >
       clientWidth says only "something is too wide".
    D5 CLEAR THE ADVISORIES WITHOUT MOVING SASS. source-map-js 1.2.2
       patches the DoS and sass accepts ">=0.6.2 <2.0.0", so the advisory
       clears while sass stays at 1.95.1. DEBT-SEC-3 therefore remains a
       deliberate CSS-delta decision rather than a side effect of a security
       pass — which is exactly what its own entry asked for.
  consequences: |
    + check [16] was mutation-tested by REINSTATING fallbackDefault, the
      real historical bug, not by writing a convenient synthetic one. Also
      proven on an inline null-object in a guard (caught) and on the same
      shape THROWING instead (correctly passes).
    + THE NEVER-RUN SUITE FOUND A REAL BUG ON ITS FIRST EXECUTION.
      .sitefooter-orgdesc needed 539px of the 249px it had, from a German
      compound in the demo fixture — which the fixture carried on purpose,
      for an assertion that had never once run. 10 passed, 1 failed.
    + The hero had no 320px test and the footer did, so the footer's
      overflow was findable and the hero's was not. Both now have it: 12
      tests, up from 11.
    + npm audit back to 0, and the rebuilt dist is BYTE-IDENTICAL — the
      dependency changes altered nothing shipped.
    - THE FIRST VERSION OF THE GATE WAS 7-FOR-7 FALSE POSITIVES, all from
      one over-broad word in a name pattern. A gate this noisy on its first
      run would have been ignored thereafter, which is precisely why the
      earlier regex prototype was dropped rather than shipped.
    - THE OBVIOUS PROBE FOUND NOTHING. Looking for a boundingClientRect past
      the viewport edge reported ZERO overflowing elements while the page was
      574px wide, because an unbreakable word overflows its inline box
      without the border box growing. See AGENT_INSIGHTS 6.34.
    - TWO KNOWN BOUNDARIES of check [16], neither firing on the current 137
      sources: enclosingName only sees function and method declarations, so
      a class-property arrow (fallbackDefault = () => …) escapes the
      name-based branch; and failureContext does not stop at arrow
      boundaries, so a return inside a callback arrow nested in a guard is
      attributed to that guard. The object-literal branch is unaffected.
    - DEBT-SEC-3 IS STILL OPEN and still needs a human to eyeball the
      accordion and form-select icons in both themes. Nothing in this pass
      changed that; it only removed the security argument for rushing it.
  files:
    - "scripts/check-fabricated-reads.mjs"
    - "test-local.sh"
    - "components/sitefooter/sitefooter.scss"
    - "tests/website-components.spec.ts"
    - "package.json"

- id: "ADR-158"
  title: "Five debt closures by measurement: two gates that could not fail, two records that outlived their premise, and a bump taken and reverted"
  date: "2026-10-09"
  status: "Accepted"
  context: |
    A sweep of the remaining visual-refresh arc items. Four of the five were
    expected to be bookkeeping. Each one instead produced a finding that the
    entry describing it did not contain, and the pattern across all five is
    the same: THE ENTRIES RECORDED CONCLUSIONS, AND THE CONCLUSIONS HAD
    EXPIRED WHILE THE WORDS STAYED PUT.

    DEBT-TS-1 came due on this date. The removal was expected to be
    mechanical.

    DEBT-VR-5c named three gate extensions, one of which it called "most
    likely to be real".

    DEBT-WEB-1 had claimed since 2026-09-01 that no automated contrast gate
    existed. Three had been built since, by a different arc.

    DEBT-SEC-3 held sass at 1.95.x and asked for a deliberate upgrade with
    two icons eyeballed.

    DEBT-VR-3 and DEBT-VR-4 were the two "verify by eye" items left from the
    original refresh, neither ever quantified.
  decision: |
    D1. DEBT-TS-1 does NOT get removed, and the deadline gets renegotiated
        rather than enforced. The consumer is still on the deprecated API in
        live source. The item is also split in two: the API surface is
        load-bearing, the duplicate CDN path is already dead to the consumer.

    D2. Check [4] validates demo-to-demo links, not only the ones the index
        lists. All four `grep -oP` uses in test-local.sh become `-oE`.

    D3. The contrast gate learns the --theme-group-bg-* fills, CURATED to
        the one text token that is drawn on them, with the rect's
        fill-opacity modelled. It does NOT learn two stacked state layers,
        and it does NOT learn the large-text exemption. Both declined with
        the measurement attached.

    D4. DEBT-WEB-1 and DEBT-VR-5b-ORIG are closed as stale, and every site
        repeating their claims is corrected — including two ADR consequence
        lists, which get SUPERSEDED markers rather than edits.

    D5. The sass bump is taken, measured, and reverted. The deferral stands
        on stronger ground than it did: the bump makes the shipped CSS
        larger AND less optimised.

    D6. Ribbon controls keep 4px. DEBT-VR-3 closes with an empty unverified
        set.
  consequences: |
    + THREE STRUCTURE CHECKS COULD NOT FAIL ON THE DEVELOPMENT MACHINE.
      BSD grep has no -P. Four loops in checks [4], [5] and [6] drove their
      `for` lists from `grep -oP`: grep aborted, the list came out empty,
      the body never ran, the counter stayed at zero, PASS. Green on CI's
      GNU grep and green here, for opposite reasons. Two carried
      2>/dev/null, which is why the error printed twice a run and was never
      seen. FOUND BY MUTATION-TESTING A NEW CHECK — the error printed beside
      the expected failure. All three are now mutation-proven to fail.
    + The new sibling-link check immediately caught real rot: workspaceshell
      linked to workspaceswitcher.html, a page the TenantSwitcher rename had
      renamed away. A rename updates what the index lists; it does not
      update what one page says about another.
    + The contrast gate now covers the namespace group fills, and the
      fill-opacity turned out to be load-bearing: the rect paints at 0.3, so
      the token value is NOT the colour on screen, and in dark the token is
      itself rgba(...,.18) so the two multiply to 0.054. Modelling the token
      as painted reports 8.40 where the browser renders 9.74.
    + DEBT-VR-3's exposure, never quantified in a month of sitting open,
      turned out to be ZERO. Two commands measured it.
    - THE TWO-LAYER CASE DEBT-VR-5c PREDICTED IS NOT REACHABLE AS WRITTEN.
      background-color REPLACES; it does not stack. So the entry's own
      example, a hovered row inside a selected group, paints ONE colour.
      Real stacking needs two NESTED elements painting on one pointer event,
      since :hover matches ancestors too. 17 candidates in the compiled CSS,
      16 of them the same element matched twice at different specificity.
      The one genuine instance measures 10.92 light / 8.08 dark.
    - MODELLING IT STRICTLY WAS TRIED AND REJECTED: 24 dark pairs fail,
      worst 3.61, on combinations nothing renders. The AGENT_INSIGHTS 6.19
      trade, for the third time in this arc.
    - THE LARGE-TEXT EXEMPTION IS DECLINED PERMANENTLY, not deferred. It can
      only RELAX a gate, and no token here is heading-only, so it would open
      a false-pass channel with no true positive behind it. The trigger to
      revisit is stated as a condition, not a date.
    - THE SASS BUMP BREAKS postcss-svgo. 1.105.1 emits %3csvg lowercase
      where 1.95.1 emitted %3Csvg; svgo cannot parse it. Three
      SvgoParserErrors, zero before, so three data URIs ship UNMINIFIED —
      all three the dark accordion chevron, the exact icon DEBT-SEC-3 said
      to eyeball. The entry's "resolving to the same colour" is also
      slightly too strong: (11,50,86) against (11,50,85).
    - DEBT-SEC-3 REMAINS OPEN. The deferral is reaffirmed, not discharged.
    - DEBT-TS-1 REMAINS OPEN AND NOW NEEDS A CONVERSATION, not a commit. The
      apps team has to migrate off createWorkspaceSwitcher before any of it
      can go, and that is the user's call to make, not this repository's.
    - NEW: DEBT-VR-10, 73 component-level translucent backgrounds that no
      theme token names and no check can see. Found while closing VR-5c and
      deliberately NOT absorbed into it.
    - A DEBT ENTRY THAT STATES A CONDITION RATHER THAN A TASK GOES STALE
      SILENTLY. DEBT-WEB-1 said "there is no automated contrast gate"; when
      three were built, nothing contradicted it, so it read as current for
      four more weeks — in six places, because generated docs multiply it.
  files:
    - "test-local.sh"
    - "scripts/check-contrast.py"
    - "demo/components/workspaceshell.html"
    - "CODEBASE_FIXES.md"
    - "components/marketinghero/README.md"
    - "components/sitefooter/README.md"
    - "specs/marketinghero-sitefooter.prd.md"
    - "specs/visual-refresh-2026.prd.md"
    - "package.json"

- id: "ADR-159"
  title: "The second debt sweep: an alpha threshold nobody had named, three refactors, and two parkings resting on false premises"
  date: "2026-10-09"
  status: "Accepted"
  context: |
    Fourteen items remained open. Four were untouchable by design — two
    recorded user decisions (ADR-146 D5, ADR-150 D3), one reaffirmed by the
    user a day earlier, and one a bug in the apps team's own repository. Two
    more (DEBT-DUI-1, DEBT-DUI-4) are sized beyond a sweep. The rest were
    worked one at a time.

    DEBT-VR-10 was the substantial one: 73 component-level translucent
    backgrounds that no theme token names, opened the previous day and
    explicitly NOT audited then.

    The TenantSwitcher deadline had expired the day before with the consumer
    still on the old API, and the user confirmed the apps team is occupied
    elsewhere.
  decision: |
    D1. The TenantSwitcher removal deadline is WITHDRAWN, not extended, and
        replaced by a checkable condition: the aliases go one release after
        the consumer stops calling them. The console warning stops implying
        imminent removal.

    D2. The nine failing translucent backgrounds move to --theme-selected-bg
        and --theme-text-primary. --theme-warning-rgb is added to both themes
        rather than freezing a warning hue as a literal.

    D3. No gate is built for DEBT-VR-10. The shape is recorded instead: a
        sass-literal tint above alpha 0.3 is the catchable signal.

    D4. DEBT-PAR-2's mitigation becomes structure check [17]; DEBT-PAR-3's
        CORS header becomes CDN check [7].

    D5. The three conditional parkings are re-measured, not worked.
  consequences: |
    + ALPHA, NOT HUE, IS WHAT DECIDES. Nine AA failures, worst 1.10, and
      every one was a PALE TINT AT HIGH ALPHA — rgba($blue-100, .5) or
      rgba($yellow-100, .7). Such a tint dominates the composite, so the
      painted colour stays light whatever is beneath it, and dark mode leaves
      near-white under near-white text. All nineteen other theme-blind
      literals pass, measured individually, because they sit at alpha <= 0.3
      and let the surface through — they track the theme by accident.
      rgba($danger, .06) is safe forever; rgba($blue-100, .5) never was.
    + ONE OF THE NINE FAILED IN LIGHT TOO, at 3.78, which matters because the
      audit was motivated entirely by dark mode and would not have looked.
    + visualtableeditor was already correct, with a dark override measuring
      9.33, and became the precedent the other eight follow.
    + attachDrag 36 -> 27, validatePatchShape 35 -> 11, reduceOps 51 -> 16.
      reduceOps became a genuine fold: every arm returns a fresh object where
      the original mutated the copied record in place.
    + Check [17] derives AuthCard's ten owned class names from its own
      stylesheet, so an eleventh is covered the day it is added.
    - THE FIRST VISUAL PROBE MEASURED THE WRONG THING. Clicking a row to
      select it leaves the pointer on the row, and :hover outranks the
      selected rule — the probe reported --theme-hover-bg and would have
      "proved" a colour the change never touched. Parking the mouse fixed it.
    - CHECK [17]'s FIRST VERSION CRIED WOLF, flagging `.active` from
      `.auth-step.active`. A class AuthCard composes with is Bootstrap's and
      belongs in the bundle; only classes that START a selector are its own.
    - DEBT-DUI-5 IS WORSE THAN RECORDED, AND BOTH HALVES OF ITS
      JUSTIFICATION ARE FALSE. It was parked on "regions are one-per-
      component in practice" — 21 components style more than one. And it
      claims the index is "stable for a given component version": it is not,
      because isScrollable requires an element to CURRENTLY overflow, so a
      styled region whose content fits is absent from the list and every
      later index shifts. Same version, same session.
    - AMENDED 2026-10-10. The count of 21 is low, and it was wrong about its
      unit as well as its axes. It counted `overflow` and `overflow-y`
      DECLARATIONS, while isScrollable returns true when EITHER `overflowX` or
      `overflowY` is auto or scroll, and tests one ELEMENT. Re-measured per
      selector across both axes: 25 components declare more than one scrolling
      region and 68 declare at least one. ribbonbuilder still leads at five,
      then applauncher, conversation, docviewer, formdialog, markdowneditor,
      ribbon and tabbedpanel at four. The measurement's predicate and its unit
      both have to come from the code being measured.
    - DEBT-DUI-4's exemption count was right and its conformance figures
      stale: 84 of 91 at display, not 91 of 98. Seven components had been
      raised and the entry was taking no credit for them.
    - DEBT-PAR-1's trigger has not fired, but the repository was the only
      plausible source of the confusion it waits for — two docs listed the
      internal twin URL in a table beside the canonical one with no steer.
    - A MITIGATION WRITTEN ONLY AS A SENTENCE IS NOT A MITIGATION. PAR-2's
      defence had been prose in a debt entry, one @import away from ending
      silently, with the symptom landing in a consumer's application.
  files:
