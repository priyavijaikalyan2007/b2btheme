    - "agentknowledge/history.jsonl"

- id: "ADR-169"
  title: "The structure suite runs in CI, so the count ratchet holds off one machine"
  date: "2026-10-13"
  status: "accepted"
  context: |
    ADR-168 added check `[20]`, which holds eleven tracked counts at measured
    baselines and fails when one rises. It also recorded that the whole
    structure suite ran locally only, and named wiring it into CI as the
    obvious next step.

    That gap made the central claim of ADR-168 weaker than it read. "The
    figures ratchet down and never drift up in silence" was true where
    `./test-local.sh` was run and nowhere else. A count could rise in a branch
    that `.github/workflows/ci.yml` called green, which is the same shape as
    the defect ADR-158 found: a check that cannot fail is not a check, and a
    check nothing runs is a special case of that.

    The workflow ran `npm ci`, `build:css`, `build:ts` and
    `test:unit:coverage`. Two partial build steps are not enough for the
    suite: it reads `dist/components/*.css` from `build:components:css`,
    `dist/js/bootstrap.bundle.min.js` from `copy:js`, the manifest, the
    generated docs and `build.json`. The suite's own header has said "run
    after `npm run build`" since it was written.

    Three CI hazards were checked rather than assumed. `vendor-closure.mjs`
    makes no network call, so the vendor step works offline. Every git command
    in `build-info.sh` is `rev-parse HEAD`, `log -1` or a `describe` that
    falls back to an empty string, and all are wrapped to return empty on
    failure, so `actions/checkout` at its default depth of one is sufficient.
    The full build takes 115 seconds locally.
  decision: |
    D1. RUN THE FULL BUILD IN CI, replacing the two partial steps. The suite
        depends on artifacts they do not produce, and the full build is also
        what Cloudflare runs, so CI exercises the same command as production.
    D2. ADD THE RUNTIME TYPECHECK. `npm run typecheck:runtime` was already in
        the project's own `test` script and was the only part of it CI never
        ran.
    D3. ADD `npm run test:structure` AS ITS OWN STEP, after the unit tests, so
        a structure failure is distinguishable from a unit failure in the log.
    D4. KEEP `test:unit:coverage` RATHER THAN COLLAPSING INTO `npm run test`.
        The project's `test` script runs `test:unit` without coverage, and the
        coverage artifact upload depends on it.
    D5. PROVE THE STEP CAN FAIL BEFORE TRUSTING IT. Lowering the
        `windowAnyCasts` baseline from 294 to 200 was run through
        `npm run test:structure`: the check reports the count against the
        baseline and the command exits 1.
    D6. DO NOT CHANGE THE NODE PIN IN THIS CHANGE. CI pins 20, Cloudflare
        builds on v24.18.0 and the development machine runs v26.11.1. Aligning
        them is a one-line edit whose consequences cannot be measured from
        here, so it is tracked as CI-1 rather than bundled in.
  consequences: |
    + THE RATCHET IS NOW ENFORCED RATHER THAN AVAILABLE. All 32 structure
      checks run on every push and pull request to `main`, so a tracked count
      cannot rise without failing the workflow. Verified by mutation, not by
      reading the YAML.
    + CI NOW RUNS THE SAME BUILD COMMAND AS PRODUCTION, so a build failure
      shows up in Actions instead of only in a Cloudflare build log that the
      read-only Workers tools cannot reach.
    + THE ENTIRE `npm run test` SCRIPT IS NOW COVERED. Before this, CI ran one
      of its three parts.
    - CI IS ABOUT TWO MINUTES SLOWER. The full build is 115 seconds locally
      against roughly 40 for the two partial steps. That is the price of the
      suite having artifacts to check.
    - THE NODE VERSION GAP IS UNRESOLVED AND NOW RECORDED. CI validates on a
      major that neither development nor production uses, so green CI still
      does not predict a Cloudflare build. Tracked as CI-1.
    - A FIRST FAILING RUN IS POSSIBLE AND WAS NOT REPRODUCIBLE HERE. The exact
      sequence passes locally on Node 26, and CI runs Node 20. If it fails,
      the failure is information about CI-1 rather than about the suite.
  files:
    - ".github/workflows/ci.yml"
    - "CODEBASE_FIXES.md"
    - "AGENTS.md"
    - "TESTING.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: "ADR-170"
  title: "CI pins the Node major that ships, because 20 could not run the suite at all"
  date: "2026-10-13"
  status: "accepted"
  context: |
    ADR-169 wired the 32 structure checks into CI. CI-1 was opened at the same
    time to record that `.github/workflows/ci.yml` pinned Node 20 while
    Cloudflare Workers Builds compiles the deployed bundle on v24.18.0 and the
    development machine runs v26.11.1. The entry said aligning the pin was a
    one-line change whose consequences could not be measured from here, and
    that it needed a run rather than a guess.

    The run found it immediately. The first CI execution of the suite failed at
    check `[16]`, because `scripts/check-fabricated-reads.mjs` imports
    `globSync` from `node:fs`, added in Node v22.0.0 and marked stable in
    v22.17.0:

      SyntaxError: The requested module 'node:fs' does not provide an export
      named 'globSync'

    That check could never have passed in CI. It has been green locally since
    it was written only because this machine runs Node 26, and it had never
    run anywhere else. This is exactly the failure mode CI-1 described: a
    thing that works on the version nobody validates and breaks on the version
    CI pins stays invisible until something runs it.

    The verification in ADR-169 did not catch it either, and the reason is
    worth recording. The exact CI sequence was run locally and passed, which
    established that the commands were right and nothing about which runtime
    they needed. A local rehearsal of a pipeline shares the local runtime, so
    it cannot test the pipeline's environment.
  decision: |
    D1. PIN THE MAJOR THAT SHIPS, NOT THE SCRIPT'S FLOOR. Node 24 matches
        Cloudflare's v24.18.0, so a green CI run exercises the same major as
        the deployed bundle. Pinning 22, the floor `globSync` requires, would
        have fixed the error while leaving CI validating a version nobody
        runs.
    D2. DECLARE THE FLOOR IN `package.json` AS THE LOWEST VERSION ACTUALLY
        TESTED, which is 24. `globSync` is the only API in the repository
        newer than that, in two calls in one file. A first draft declared
        `>= 22` and that was the same error this ADR is about: 22 is where
        the Node documentation says `globSync` was added, nothing in this
        repository has ever run on 22 or 23, and the API was experimental
        until 22.17.0, so `>= 22` promised support for a range that had never
        been exercised and would emit a runtime warning on part of it. CI and
        Cloudflare both run 24, so 24 is the floor there is evidence for.
    D3. DO NOT REWRITE THE SCRIPT TO SUIT AN OLD RUNTIME. Replacing `globSync`
        would have kept CI on a deprecated major and hidden the real problem,
        which was the pin.
    D4. CLOSE CI-1 ON THE EVIDENCE. The entry asked for a run. The run
        happened, it was conclusive, and the fix is pushed and green.
  consequences: |
    + CI IS GREEN WITH THE SUITE ENFORCED. All twelve steps of run 38345921165
      pass on `af35267`, including `Run structure checks`. The count ratchet
      from ADR-168 is now enforced on every push and pull request to `main`.
    + CHECK `[16]` RUNS OUTSIDE THIS MACHINE FOR THE FIRST TIME. Before this
      it had only ever executed on a developer's Node 26.
    + CI AND PRODUCTION NOW SHARE A MAJOR, so a build failure caused by the
      runtime shows up in Actions rather than only in a Cloudflare build log
      the read-only Workers tools cannot reach.
    + GITHUB'S OWN DEPRECATION AGREES. The failing run annotated that Node 20
      is deprecated and that `actions/checkout@v4`, `setup-node@v4` and
      `upload-artifact@v4` are already being forced onto Node 24.
    = THAT ANNOTATION IS NOT A DEFECT AND WILL NOT GO AWAY. It is about the
      runtime the ACTIONS themselves execute on, which the runner forces to
      24 whatever `node-version` says, and `node-version` governs only the
      `run:` steps. It appeared on the passing run too. Do not read it as
      something this pin failed to fix.
    - ONE MAJOR STILL SEPARATES CI FROM DEVELOPMENT, 24 against 26. That is
      the safe direction, because CI exists to predict production, not the
      developer's laptop. It does mean a Node 26 feature can still pass
      locally and fail in CI, which is now the correct order of discovery.
    - A LOCAL REHEARSAL OF A PIPELINE CANNOT TEST THE PIPELINE'S ENVIRONMENT.
      Running the exact CI command sequence locally verified the commands and
      proved nothing about the runtime. The only test of a CI environment is
      a CI run.
  files:
    - ".github/workflows/ci.yml"
    - "package.json"
    - "CODEBASE_FIXES.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-171
  title: FRONTEND_LOGGING.md governs the mechanism, and the engine bundle gets one logging factory
  date: 2026-10-13
  status: accepted
  context: |
    Two documents governed logging and they contradicted each other head on.
    LOGGING.md:13 said "Do not create a shared logger module". FRONTEND_LOGGING.md
    shipped `LogUtility` as a component and required every other component to
    resolve it through `window.createLogUtility`. AGENTS.md pointed agents at
    LOGGING.md, which is how LOG-1 survived six months citing a superseded
    standard (ADR-168). 117 component files followed FRONTEND_LOGGING.md, 24
    carried the shim without the utility check, and 2 called `console` directly.

    Three findings reshaped the work once measurement started.

    `components/diagramengine/diagramengine.ts` is GENERATED, concatenated from
    `src/` by scripts/bundle-diagramengine.sh. The generator was itself emitting
    a shim with no utility check, so 1 of the 24 files was an artifact and the
    fix belonged in the generator.

    The engine carries 21 log prefixes, 20 in its modules plus its own. Applying
    the mandated preamble to each added 291 lines to the largest file in the
    repository, and check `[20]` failed on `diagramengineLines` for exactly that
    reason. The ratchet from ADR-168 caught a change made by the author of the
    ratchet, on the count that change was not about.

    The prescribed snippet carried two `(window as any)` casts. Using it 26 more
    times would have added 52 occurrences to WIN-1 and failed the same check. The
    snippet also ran 133 to 150 characters wide against a documented
    120-character limit, in all 117 files that already used it.
  decision: |
    D1. FRONTEND_LOGGING.md IS THE AUTHORITY FOR `components/`. Both documents
        now say so in their own first section. LOGGING.md keeps the principles,
        what to log, what not to log, and the severity semantics. Its section 1
        prohibition is rescoped to third-party frameworks and to importing a
        logger across component boundaries, which is what it was protecting.
        Its section 7 checklist defers to FRONTEND_LOGGING.md section 9.
        AGENTS.md points at FRONTEND_LOGGING.md, including in the TDD loop.

    D2. THE WINDOW GLOBALS COMPONENTS PUBLISH ARE DECLARED, NOT CAST.
        `components/globals.d.ts` types `window.createLogUtility`, so the
        canonical snippet reads `window.createLogUtility` with no cast. The
        snippet is restated in Allman form inside 120 characters. Declaration
        files are excluded from the audit's source set, since they hold no
        executable code.

    D3. ONE FACTORY FOR THE ENGINE BUNDLE, SANCTIONED EXPLICITLY.
        `components/diagramengine/src/logging.ts` holds `makeLogger(prefix)` and
        each module destructures the levels it uses. This removed 80 helper
        declarations and 294 lines from the modules, cost 78 for the factory,
        left all 118 call sites standing and lowered STD-1 from 30,693 to
        30,479. FRONTEND_LOGGING.md section 1.1 permits the variant ONLY inside
        a bundle concatenated from many modules carrying more than one prefix,
        and states the boundary: `makeLogger` is local to one generated file,
        not a module imported across component boundaries.

    D4. THE CLASSIFIER LEARNS THE FACTORY FORM AND STRING LITERALS.
        `classifyLoggingPattern` accepts `makeLogger(` as conforming and skips
        console tokens inside string literals, with three new test cases. Four
        baselines are lowered: consoleLogCalls, shimWithoutUtility and
        directConsole to 0, diagramengineLines to 30,479.
  consequences: |
    + ALL 143 LOGGING COMPONENTS CONFORM. Verified by check `[20]` with three
      counts held at zero, and by an identity mutation: reverting one engine
      module makes the check exit 1 on two counts.
    + THE ENGINE IS SMALLER THAN BEFORE THE MIGRATION, not larger. STD-1 fell
      214 lines below the baseline it was measured at.
    + 4,958 UNIT TESTS PASS, which is the real test of the factory. The helpers
      changed from hoisted `function` declarations to `const` destructuring, so
      a call during module evaluation would have thrown a TDZ error. The
      concatenated bundle has no module-scope invocations and the engine's six
      test files evaluate it.
    = THE `_lu` LOOKUP RESOLVES ONCE, AT LOAD. A page must load `logutility.js`
      before any component bundle for routing to happen. This was already true
      of all 117 files and is now written down. 6 of the 138 demo pages load
      it, and 5 enable the debug flags, so the console fallback is the common
      path rather than the exception.
    = THEMEINIT WILL ALMOST NEVER ROUTE. It runs in `<head>` before every other
      script by design. The guarded `typeof` check costs nothing and keeps the
      pattern uniform, so it conforms rather than becoming a tracked exception.
    - 110 FILES STILL USE THE OLD ONE-LINE CAST FORM. They compile and classify
      as conforming. Converting them is the mechanical path to closing WIN-1,
      220 of its 294 occurrences, and is deliberately not done here. (Written
      as 117 files on 2026-10-13. Measured the next day: 110 files on 112
      lines. ADR-172 carries the correction and the conversion.)
    - REFACTORING THE CODE A CHECK READS CAN BLIND THE CHECK. After the factory
      landed, 17 modules holding 57 log calls classified as "no-logging" and
      the ratchet passed in silence. A count can be right by accident. When a
      change alters the shape of what a check measures, re-derive the
      classification by hand before trusting the number.
  files:
    - "FRONTEND_LOGGING.md"
    - "LOGGING.md"
    - "AGENTS.md"
    - "components/globals.d.ts"
    - "components/diagramengine/src/logging.ts"
    - "scripts/bundle-diagramengine.sh"
    - "scripts/audit-counts.mjs"
    - "scripts/audit-counts.test.ts"
    - "TESTING.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-172
  title: The LogUtility lookup moves to the declared global, and a type-only change proves itself by its output
  date: 2026-10-14
  status: accepted
  context: |
    ADR-171 D2 established that a window global is declared in
    `components/globals.d.ts` and reached without a cast, and it applied that to
    the 7 files it migrated. It left 110 files on the older one-line form:
    `const _lu = (typeof (window as any).createLogUtility === "function") ? ...`.
    Those 110 files carried 220 of WIN-1's 294 cast occurrences, two per line,
    on 112 lines.

    The line was also 148 characters wide against the 120-character limit in
    AGENTS.md. Removing the two casts saves 18 characters and leaves it at 130,
    so a cast-only substitution would have closed one standards gap and left
    the other open. FRONTEND_LOGGING.md section 1 already prescribes a
    three-line shape for exactly this reason.

    Re-deriving the remainder changed what WIN-1 is. The entry described it as
    unsafe reads of other components' globals and named `MathfieldElement`
    among them. `MathfieldElement` appears only in a test file, which the
    counted file set excludes. Of the 74 occurrences that survive phase A, 66
    are a component publishing its own API to `window`, 7 are cross-component
    reads and every one of those 7 already guards with `typeof`, and 1 is a
    comment.
  decision: |
    D1. ALL 110 FILES MOVE TO THE DECLARED GLOBAL, REFLOWED TO THREE LINES. The
        substitution and the reflow happen together, because the cast and the
        line width are two standards violations on one line and fixing one
        without the other leaves the line non-conforming.

    D2. THE SHIM BODIES ARE LEFT ALONE. They are about 100 characters, inside
        the limit, and the classifier in scripts/audit-counts.mjs accepts both
        the one-line and the three-line body. Reflowing them would triple the
        diff and change the shape of what check `[20]` reads, which is the
        exact move that blinded the check in ADR-171.

    D3. A TYPE-ONLY CHANGE IS VERIFIED BY DIFFING THE COMPILED OUTPUT, not only
        by the test suite. Build before, build after, diff. The claim is that
        the runtime does not move, and the emitted bundles are that claim
        stated in bytes.

    D4. WIN-1 STAYS OPEN. Phase B is the 74 remaining occurrences, and they are
        a different kind of work: roughly 20 declarations added to
        `components/globals.d.ts`, one per published global.
  consequences: |
    + WIN-1 FALLS FROM 294 OCCURRENCES ON 186 LINES IN 113 FILES TO 74 ON 74
      LINES IN 27 FILES. Baselines lowered to 74 and 27, and an identity
      mutation confirms check `[20]` fails at the new level on both counts.
    + ALL 126 COMPILED BUNDLES ARE BYTE-FOR-BYTE IDENTICAL before and after.
      Nothing but types and whitespace changed, and that is proved rather than
      inferred from 4,958 passing tests.
    + 108 LINES COME INSIDE THE 120-CHARACTER LIMIT. They were 148.
    = THE DOUBLE-CAST FORM IS FORMALLY SUPERSEDED. CODEBASE_FIXES.md still
      named it as the required pattern. AGENTS.md now records that it forces a
      second cast on the value and buys nothing over `any`.
    - SPECS AND TWO COMPONENT READMES STILL SHOW THE DOUBLE CAST. They document
      publication and read sites that phase B will change, so they are
      corrected when phase B reaches them rather than now.
    - A RATCHET GATES THE TOTAL AND NOT ITS COMPOSITION. WIN-1's count was
      correct and re-derivable while the paragraph explaining what made it up
      was wrong in two places. Insight 6.60.
  files:
    - "AGENTS.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "TESTING.md"
    - "CHANGELOG.md"
    - "scripts/audit-counts.mjs"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-173
  title: Every component global is declared, and the count that watches them gates all four spellings
  date: 2026-10-14
  status: accepted
  context: |
    ADR-172 closed WIN-1 phase A and scoped phase B as 74 occurrences in 27
    files, 66 of them a component publishing its own API to `window`. Reading
    the survivors to plan that work turned up something larger than the work.

    WIN-1's pattern is the literal string `window as any`. The library reaches
    `window` through a type assertion in FOUR spellings, and the one WIN-1
    counts is the smaller population. Measured on 2026-10-14 across the 285
    tracked sources: 74 `any`, 248 `unknown as Record<string, ...>`, 3 an
    inline object type or an assertion wrapped so the type is not on the line.
    325 in all. The count was never wrong. It answered a narrower question than
    its name suggests, so an untyped window access in any other spelling could
    be added for free, and the unwatched population was 3.3 times the watched
    one.

    The same narrowness had already cost something. Phase A migrated every file
    matching `(window as any).createLogUtility` and reported the LogUtility
    lookup as moved to the declared global. Six components reached that global
    through the other spellings and were invisible to the grep, and
    `components/logutility/logutility.ts` published `createLogUtility` itself
    through a double cast, so the producer of the typed contract was not using
    it.

    One more thing had to be settled before any publication site could move.
    `extractGlobals` in `scripts/generate-docs.js` recognizes a registration by
    its parentheses when it is a cast, and by dot access when it is bare.
    Removing the cast from `(window as any)["Toolbar"] = Toolbar` leaves a line
    neither rule matches. Measured by reverting the fix and regenerating: 14
    components report `Globals: none` and 38 published names disappear from
    `docs/AGENT_QUICK_REF.md`. Check `[19]` passes throughout, because it
    verifies that published names EXIST and cannot see a name that stopped
    being published.
  decision: |
    D1. `windowCasts` GATES EVERY SPELLING. A new count in
        scripts/audit-counts.mjs counts every `window as ` assertion whatever
        it asserts to, baselined at 325 before the work and 237 after. The
        breakdown by asserted type prints on every run and is not gated, so a
        spelling that moves is visible without being a failure.

    D2. `windowAnyCasts` KEEPS ITS DEFINITION AND WIN-1 CLOSES AT 0. The item
        is closed as its own pattern defines it and WIN-2 opens at the measured
        237. Redefining a count under its old name produces a different count
        with the same name, which is insight 6.58.

    D3. ALL 66 PUBLICATION SITES ARE DECLARED CENTRALLY in
        components/globals.d.ts, which grows from 2 declarations to 70. The
        access syntax is preserved, bracket stays bracket and dot stays dot,
        so TypeScript emits the same call and the emit stays comparable.

    D4. THE INTERNAL SLOTS ARE DECLARED BUT NOT PUBLISHED. `__sidebarManager`,
        `__tabbedPanelManager` and `__navRailManager` are singletons their own
        `getInstance()` writes to window. A declaration describes what is there
        at run time, so they are declared. The quick reference listing them as
        callable API is a different claim, and extractGlobals now skips a
        leading double underscore.

    D5. THE DOCS EXTRACTOR LEARNS THE CAST-FREE BRACKET FORM before the files
        it reads change, with two tests, rather than after the names go
        missing.
  consequences: |
    + WIN-1 IS CLOSED AT 0 OCCURRENCES IN 0 FILES, from 294 on 186 lines in
      113 files. An identity mutation reintroducing one cast fails three
      counts.
    + THE LOGUTILITY LOOKUP HAS ONE FORM LIBRARY-WIDE for the first time. 110
      files from phase A, 7 from ADR-171, 6 consumers and the producer here.
    + 125 OF 126 BUNDLES ARE BYTE-FOR-BYTE IDENTICAL. The one that differs is
      dynamicformswitcher, which held `const w = window` as a local alias, and
      the hunk is that alias removed. Read rather than assumed.
    + THREE INTERNAL SLOTS STOP BEING ADVERTISED AS PUBLIC API.
    = THE TYPE IMPORTS IN globals.d.ts ARE ERASED. A `.d.ts` emits nothing, so
      naming 23 components there creates no runtime edge and does not weaken
      the rule that components never import one another.
    - WIN-2 STANDS AT 237 AND TWO QUESTIONS ARE OPEN. Whether roughly 200
      further globals belong in one central file or in a `declare global`
      block beside each component's own assignment is a choice this ADR does
      not make, because it amends D3 and the AGENTS.md instruction. And a
      lookup by a computed key, as in `codeeditor.ts:140` and the debug flag
      read in `logutility.ts:63`, cannot be expressed by a declaration at all,
      so some of the 237 will need a different answer rather than a
      declaration.
    - A RATCHET IS ONLY AS WIDE AS ITS PATTERN. WIN-1 was gated, re-derivable
      and correct for three days while the larger population went unwatched.
      Insight 6.61.
  files:
    - "components/globals.d.ts"
    - "scripts/audit-counts.mjs"
    - "scripts/audit-counts.test.ts"
    - "scripts/generate-docs.js"
    - "scripts/generate-docs.test.ts"
