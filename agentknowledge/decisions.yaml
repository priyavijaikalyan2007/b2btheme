- id: "ADR-162"
  title: "A scrolling region declares its own name; an anchor records the name and keeps the index as a fallback"
  date: 2026-10-11
  status: "Accepted"
  context: |
    DEBT-DUI-5. A canvas anchor named the scrolling region a mark was measured
    against by its INDEX in DOM order, and the index moves. isScrollable()
    requires an element to be overflowing at the time of the test, so a styled
    region whose content happens to fit is absent from the list and every later
    index shifts up — same component, same version, same session. A mark
    recorded against region 2 silently re-anchors to a different region the
    moment an earlier sibling's content shrinks below its box.

    Approach B of specs/2026-10-10-durable-anchors.prd.md. The user asked for
    it after approach A shipped (ADR-161), which fixed DEBT-DUI-1 and left this
    entry untouched.

    Measured first, because the design's "touches all 21 components" was wrong
    in both directions. 68 components declare at least one scrolling region.
    114 selector blocks collapse to 111 distinct region elements. 104 of those
    are created by the component itself and can be named. Seven cannot, and
    each earned its exclusion by inspection rather than by a regex miss: five
    are a bare `pre` inside rendered CONTENT, which the content creates and
    nothing stable can name; authcard:auth-main is page-level scaffolding the
    consuming application provides, named in the frozen Keycloak parity
    contract; symbolpicker-categories is DEAD CSS, styling a tab strip that a
    `<select>` replaced.
  decision: |
    D1. A component marks each scrolling region it creates with
    `data-dui-region="<component>:<region>"`. The name is the region's class
    with the component's own prefix removed, so it is derived rather than
    invented and two people naming the same region agree.

    D2. The node anchor gains `region?: string`. `within?: number` STAYS,
    deprecated, and keeps resolving by index, because it is a persisted integer
    in documents this package cannot see. When both are present the name wins;
    the resolution order is name, then index, then the body, in one place.

    D3. Capture records BOTH when the clicked region has a name. The name is
    what resolves; the index is the fallback for the day a component renames or
    drops a region, which would otherwise leave the anchor with nothing.

    D4. `CapabilityManifest` gains `regions?: readonly string[]`, validated to
    be namespaced to the declaring component. A host writing an anchor needs to
    know which names exist, and a stylesheet is not an interface.

    D5. `isRegionName` is narrower than `isIdentifier`: `^[a-z0-9-]+:[a-z0-9-]+$`.
    The value is interpolated into `[data-dui-region="..."]`, so a quote or a
    bracket in it would change which element that selector matches. The canvas
    re-checks it before use, independently of the runtime's validator.

    D6. Structure check [18] asserts that every region a component creates
    declares a name, that a migrated component's manifest lists exactly those
    names, and that each exclusion carries a reason of at least 40 characters.
    An exclusion that matches no region any more also fails, so the list cannot
    rot into fiction.
  consequences: |
    + An anchor into a named region survives what the index cannot. The e2e
      suite collapses an earlier region's content and asserts the mark stays
      put; the same scenario with UNNAMED regions is also a test, and it
      asserts the mark MOVES. Without that second test the first one proves
      nothing, and it would have passed against an unused code path.
    + Additive: a component that has not declared its regions behaves exactly
      as before, fragility included. An integer-only anchor is unchanged.
    - SEVEN REGIONS REMAIN INDEX-ADDRESSED and that is the residue of
      DEBT-DUI-5 rather than a finished job. A `pre` inside rendered content
      cannot be named without numbering it, and a number is the thing being
      replaced. Recorded in the check itself, where the next reader will be.
    - THE CHECK IS STATIC AND CANNOT BIND AN ATTRIBUTE TO AN ELEMENT. It reads
      regions from the SCSS and names from the TypeScript in the same file; a
      component that sets the attribute on the WRONG element passes. jsdom has
      no layout and does not load component stylesheets, so no mounted-DOM
      check can see a scrolling region at all. The browser suite is where that
      binding is tested, for two regions.
    - THE CANVAS GUARD IS REACHABLE ONLY UNDER VERSION SKEW, and the test says
      so rather than implying more. lifecycle.sync() validates every document
      before mounting, so apply() and load() both refuse a malformed name when
      runtime and component ship together. They are separate CDN artifacts, so
      a consumer can pin an older runtime whose validator predates `region`;
      the test injects a non-validating lifecycle to stand in for that.
    - SIXTEEN NAMES STUTTERED AND WERE RENAMED BEFORE SHIPPING. Deriving a
      name by stripping the DIRECTORY prefix produced
      `prompttemplatemanager:promptmanager-list` and
      `markdowneditor:mde-display`, because a component's class prefix is not
      always its directory name. These names ship in
      capability-manifest.json and are PERSISTED in a host document the
      moment an anchor records one, so the only cheap moment to fix them was
      before the first one existed. CLASS_PREFIX_ALIASES in the check maps
      the eight components that abbreviate themselves, and the names became
      `prompttemplatemanager:list` and `markdowneditor:display`.
      The table is curated, not inferred: `filter-panel` and `tree-pane` also
      differ from the directory name and are proper region words. CodeEditor's
      `cm-` is deliberately left in place, because `codeeditor:cm-scroller`
      says the element belongs to CodeMirror, which is worth saying.
    - markdowneditor:mde-display names the WRAPPER, because `mde-display` is a
      mode class toggled on the wrapper rather than a separate element. The
      wrapper is what scrolls when the mode is set, so the attribute is on the
      element that actually scrolls.
    - codeeditor:cm-scroller is set after the CodeMirror view exists, because
      CodeMirror creates that element. The element is third-party; the
      integration is ours, which is what makes it nameable at all.
  files:
    - "runtime/src/types.ts"
    - "runtime/src/predicates.ts"
    - "runtime/src/document.ts"
    - "runtime/src/registry.ts"
    - "runtime/src/document.test.ts"
    - "runtime/src/registry.test.ts"
    - "runtime/runtime.ts"
    - "components/dynamiccanvas/dynamiccanvas.ts"
    - "components/dynamiccanvas/dynamiccanvas-anchors.test.ts"
    - "components/dynamiccanvas/README.md"
    - "scripts/check-region-names.mjs"
    - "test-local.sh"
    - "tests/dynamic-ui.spec.ts"
    - "docs/DYNAMIC_UI_GUIDE.md"
    - "specs/2026-10-10-durable-anchors.prd.md"
    - "AGENTS.md"
    - "CODEBASE_FIXES.md"
    - "CHANGELOG.md"
    - "AGENT_INSIGHTS.md"

- id: "ADR-163"
  title: "AuthCard is permanently excluded from the canvas, because a pre-session surface has no model response to react to"
  date: 2026-10-11
  status: "Accepted"
  context: |
    ADR-160 D4 left AuthCard in EXEMPT and said the decision was the user's.
    The re-measurement had established what the blocker is NOT: the factory
    signature `(containerOrId: string | HTMLElement, options)` is container-
    first, the union accepts the host id the gate passes, and the frozen
    ADR-138 Keycloak parity contract never needed touching. So AuthCard sat in
    a list whose entries all mean "migration pending" while nothing was
    pending. It had been there since the list was seeded on 2026-08-03.

    The question was put to the user on 2026-10-11 with a recommendation of
    "no" on the grounds that a login surface should not be publishable as
    something a model can place on a canvas. The user agreed with the outcome
    and gave a different and better reason, recorded in D1.
  decision: |
    D1. AuthCard moves from EXEMPT to NOT_MOUNTABLE. The reason is SEQUENCE,
        not shape. Dynamic UI composes a canvas in reaction to a model
        response, so a citizen of that canvas is something a model can ask
        for. AuthCard renders Keycloak's login step, which runs BEFORE any
        session exists. There is no model and no response to react to at that
        point, so there is no moment at which a canvas could mount it. Its
        absence from the fleet is the correct outcome rather than a backlog
        item. This closes ADR-160 D4.

    D2. The safety argument is NOT the recorded rationale, although it points
        the same way. "A model should not be able to place a login form" is a
        claim about what the canvas must refuse. D1 is a claim about when the
        canvas exists at all, which is stronger: it holds even for a host that
        would happily mount a login form, and it does not need a policy to
        enforce it.

    D3. The exclusion criteria gain a fifth category, written into AGENTS.md,
        TESTING.md and docs/SURFACE_CONTRACT.md. The first four describe a
        component's SHAPE: a service, an element builder, a boot script, a
        modal or viewport-docked overlay. The fifth describes its PLACE IN
        TIME: a surface that renders before a model response can exist. Every
        existing entry in NOT_MOUNTABLE is one of the four shapes, which is
        why AuthCard did not look like it belonged there.

    D4. `authcard:auth-main` stays excluded in scripts/check-region-names.mjs
        on its own separate grounds (page-level scaffolding the consuming
        application provides, mirrored verbatim by a FreeMarker template under
        ADR-138). The two exclusions are unrelated and neither implies the
        other.
  consequences: |
    + THE EXEMPT LIST NOW MEANS WHAT IT SAYS. Four entries remain and each is
      real work with a recorded attempt: graphminimap (needs a live
      GraphCanvas and a 2D context jsdom does not implement), diagramengine
      (phase 10), dynamicformswitcher (what its manifest should declare is
      consumer-visible design), markdowneditor (exports a class and no
      factory, so migrating it means adding one to the public surface).
    + Gate counts: 97 of 101 in-scope migrated, 4 EXEMPT, 24 NOT_MOUNTABLE.
      The in-scope figure drops by one because an excluded directory is not
      in scope. 203 fleet-gate assertions pass.
    + The disjointness assertion is what proved both halves of the move
      landed. A component may be excluded or exempt and never both, so
      deleting the EXEMPT entry without adding the exclusion, or the reverse,
      fails the gate rather than passing quietly.
    - NOTHING IN AUTHCARD CHANGED, AND NOTHING SHOULD. No manifest, no
      conformance glue, no source edit. The deliverable is a written reason in
      the place where the next reader will look for one.
    - AN EXCLUSION WITH NO VOCABULARY READS AS A BACKLOG ITEM. AuthCard spent
      two months in a pending-migration list because the criteria had no words
      for "correctly absent". The categories are a reading aid, and a missing
      category is a silent misfiling. Recorded as insight 6.51.
  files:
    - "runtime/fleet-conformance.test.ts"
    - "AGENTS.md"
    - "TESTING.md"
    - "docs/SURFACE_CONTRACT.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/concepts.yaml"
    - "agentknowledge/history.jsonl"

- id: "ADR-164"
  title: "A PlantUML reply is loaded as an image, so a server's markup can never run in the page"
  date: 2026-10-11
  status: "Accepted"
  context: |
    SEC-3 in CODEBASE_FIXES.md had been open since the audit on 19 March 2026.
    MarkdownRenderer renders a PlantUML diagram by sending the diagram source
    to a server and receiving SVG. SVG is markup rather than pixels.
    `applyPlantUmlSvg` assigned that markup to `block.innerHTML`.

    The default server is https://www.plantuml.com/plantuml/svg/, a public
    third-party service, and PlantUML rendering is on unless a consumer passes
    `plantuml: false`. A consumer can also point `plantumlServer` anywhere. So
    the trust boundary is the server, and nothing at the call site tested it.

    The same file sanitises its other input. The markdown path wraps
    marked's output in `sanitize()`. The PlantUML reply never reached it.

    The entry's description of the mechanism was half wrong. `innerHTML` does
    not execute a `<script>` element. It does attach event-handler attributes,
    so `<image href="/missing" onerror="...">` ran immediately, with the host
    application's origin and therefore its cookies, storage and APIs. This
    package sets no Content-Security-Policy, so nothing outside the component
    blocked an inline handler.

    The user chose the image approach from three options after reading the
    tradeoffs. The options were sanitising the reply, rebuilding it against an
    allowlist, and loading it as an image.
  decision: |
    D1. `applyPlantUmlDiagram` replaces `applyPlantUmlSvg`. It puts the reply
        into a data URL and sets that as the `src` of an `img` element. A
        browser runs no script in an SVG that it loads as an image, so the
        whole class of defect is gone rather than a list of named vectors.
        The function was renamed because it no longer applies SVG.

    D2. Sanitising was rejected as the primary fix. `sanitize()` works from a
        list of forbidden things. It removes `on*` attributes and
        `javascript:` values, which covers the vector above, but it does not
        cover `<use>`, `<animate>`, `<set>`, `<foreignObject>` or `<style>`.
        A list of forbidden things is the wrong shape for SVG.

    D3. Base64, not percent-encoding. An SVG carries many characters that
        percent-encoding expands to three bytes each, including the `<`, `"`
        and `#` in `fill="#000"`, so the URL grows by about a third. Base64 is
        also the form browsers have always accepted for an SVG image.
        `btoa` throws above code point 255, so the string becomes UTF-8 bytes
        first. A test renders a reply holding Japanese text and accented
        Latin text, and the mutation that removes the encoder fails it.

    D4. The fetch stays. Pointing the `img` straight at the server URL would
        avoid the request entirely, but it would lose the `resp.ok` check that
        produces the error block, and it would put the compressed diagram
        source into the DOM. Fetching and inlining keeps both.

    D5. Accessibility is handled rather than accepted as lost. An image
        exposes only its `alt` text, so rendering a diagram as an image takes
        the diagram text out of the accessibility tree. `alt` is "PlantUML
        diagram", and `aria-describedby` points at a visually hidden `pre`
        holding the source. The `data-source` attribute on the placeholder is
        not sufficient, because the accessibility tree does not read it.

    D6. SEC-1 is closed as NEVER A DEFECT, not as fixed. The flagged line,
        richtextinput.ts:1407, was inside the component's own sanitiser, and
        the statement was `return temp.innerHTML` on a detached element.
        Reading `innerHTML` is a getter and executes nothing. `git log -S
        sanitizeHtml` returns one commit, `0f2d32a`, which is the commit that
        added the component. Reading `f3c1666`, the last commit before 20
        March 2026, shows line 1407 was the `sanitizeNodes` declaration at the
        time of the audit.

    D7. SEC-2 stays open with its location corrected from 1841 to 1825. One
        close-out covers one defect. The defect reproduces in `stripHtmlTags`,
        and the severity is lower than the entry implies, because a detached
        node runs no script although a browser can still fire `onerror` on a
        failed image load.
  consequences: |
    - THREE BEHAVIOURS CHANGE FOR CONSUMERS, and the README states all three.
      Text inside a PlantUML diagram is no longer selectable and a page search
      cannot find it. A link inside a PlantUML diagram no longer works. CSS
      that targets the `svg` element inside `.md-diagram` no longer reaches a
      PlantUML diagram, and `.md-diagram-image` is the replacement hook. The
      stylesheet now fits `svg, img` rather than `svg` alone.
    + MERMAID AND GRAPHVIZ NEEDED NO CHANGE, and the reason is worth keeping.
      Mermaid receives its source through `textContent`. Graphviz calls
      `viz.renderSVGElement`, which returns a DOM element that the file
      appends. Neither inserts a markup string and neither takes markup from a
      remote server. PlantUML was the only path with a remote producer.
    - THE TEST BLOCK NAMED AFTER THIS DEFECT NEVER TESTED IT. A section header
      read "SEC-3: PLANTUML SVG SANITIZATION" and the three tests under it
      checked `sanitize()` against SVG-shaped MARKDOWN. The recorded reason
      for the gap named CompressionStream and fetch, and both exist in the
      test environment. The actual gap is `Blob.prototype.stream`, which jsdom
      does not implement and Node does. The new tests stub the global `Blob`
      with Node's, so they drive the real asynchronous path. Insight 6.52.
    + TWO ASSERTIONS NEEDED A REAL ENGINE and live in
      tests/markdown-diagrams.spec.ts. jsdom loads no image, so
      `naturalWidth` is always 0 and a data URL the browser refused would
      still look correct. jsdom also runs no handler from an image load, so
      "the handler did not fire" passes whether or not the markup was parsed.
      The browser spec asserts the diagram decodes and has a visible box, and
      a second test characterises the defect in the same engine: the same
      reply assigned to innerHTML sets the global to 1, which is the onerror
      attribute firing, not the 2 from the script element. That is the
      evidence for the mechanism claim in the context above.
    + SIX MUTATIONS CONFIRM THE TESTS CAN FAIL, five in the source and one in
      the built bundle: parsing the reply as markup again fails the
      hostile-reply test and only that test, calling `btoa` without the UTF-8
      step fails the Unicode test, renaming the hidden class fails the
      description test, emptying the alt text fails the first test, switching
      to percent-encoding fails three, and the bundle mutation fails the
      browser test. The alt-text mutation was run last and separately,
      because an assertion that shares a test with a stronger one can ride on
      it and look load-bearing when it is not.
  files:
    - "components/markdownrenderer/markdownrenderer.ts"
    - "components/markdownrenderer/markdownrenderer.test.ts"
    - "tests/markdown-diagrams.spec.ts"
    - "components/markdownrenderer/markdownrenderer.scss"
    - "components/markdownrenderer/README.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/concepts.yaml"
    - "agentknowledge/history.jsonl"


- id: "ADR-165"
  title: "Plain text is extracted in an inert template, not in a detached div"
  date: 2026-10-12
  status: "Accepted"
  context: |
    SEC-2 in CODEBASE_FIXES.md had been open since the audit on 19 March 2026
    and was the last open CRITICAL — Security entry. SpineMap's
    `stripHtmlTags` created a detached `<div>`, assigned the argument to its
    `innerHTML`, and returned its `textContent`.

    The entry's prescription could not be followed as written. It said
    "replace with `textContent` for safe text extraction", and the function
    already returned `textContent`. The defect was the assignment on the line
    above, which is where parsing happens.

    The pattern looked safe because `innerHTML` runs no `<script>` element.
    That is true, and it is true whether or not the host is in the document:
    ADR-164 measured it on an attached host, where the global came back as 1
    from an `onerror` attribute rather than 2 from a script element. So
    detachment was never the thing protecting this call. It added nothing,
    and it stops nothing else either. Setting `innerHTML` attaches
    event-handler attributes, and a browser starts the image load and fires
    `onerror` for an element that is not in the document. Measured in
    Chromium: the old implementation run on
    `<img src="/does-not-exist-sec2.png" onerror="…">Desc` extracts "Desc",
    makes one request, and sets the global.

    The input is consumer data. `stripHtmlTags` is reached from exactly two
    places, the `renderView` of the richtextinput and markdowneditor field
    adapters, so the argument is a stored field value shown as a short
    plain-text line in the read-only popover. For a rich-text field that
    value is markup by definition. Node labels never reach the function, as
    they go to the SVG through `textContent`, and every other `innerHTML` in
    the file is `= ""`, which clears.
  decision: |
    D1. Parse in an inert document rather than filter the input. A
        `<template>` parses into its content fragment, whose owner document
        has no browsing context, so no request is made and no handler runs.
        This is ADR-164 D1 one layer down: remove the whole category by
        never parsing in the live document, rather than enumerate the markup
        that must be removed. A denylist has to grow with the platform.
        Inertness does not.

    D2. A template rather than DOMParser, for output parity. `DOMParser`
        builds a whole document, so head-context markup is sorted into
        `<head>` and `body.textContent` drops it: `<title>x</title>y` yields
        "y" there and "xy" through a template, which is what the old code
        gave. A template also allocates no document per call, and this runs
        once per field per popover.

    D3. The dead `innerText` fallback is removed. The old return was
        `tmp.textContent || tmp.innerText || ""`, and the middle term could
        never contribute. The HTML specification defines `innerText` to
        return the same value as `textContent` when the element is not being
        rendered, and a detached element is not being rendered. A
        `DocumentFragment` has no `innerText` at all, so the new code returns
        `textContent` alone.

    D4. The six misnamed tests are kept under an accurate name rather than
        deleted. What they check is real and worth checking: a node label
        reaches the SVG through `textContent`. Only the name was wrong.

    D5. One behaviour is left alone on purpose. `textContent` includes the
        text of a `<script>` or `<style>` element, so the body of one appears
        in the extracted value. The old code did this too. Output parity was
        the point of the change, so this is written down in the README and
        pinned by a test rather than quietly fixed in the same commit.

    D6. The component header now carries a 🔒 SECURITY marker. It had none,
        although the component takes consumer markup on three paths. The
        marker states what is trusted and what is not, so the next reader
        does not have to re-derive it from the call sites.
  consequences: |
    + THE OUTPUT IS UNCHANGED, AND THAT WAS MEASURED rather than assumed.
      Twenty-one inputs were run through both implementations side by side:
      hostile payloads, HTML entities, numeric character references,
      comments, `<br>`, textarea, table and head-context markup, and plain
      text. All twenty-one matched. The list is the test table in
      spinemap.test.ts, so the evidence stays runnable rather than sitting
      in this record.
    - THE TEST BLOCK NAMED AFTER THIS DEFECT NEVER REACHED THE FUNCTION. A
      section header read "SEC-2: stripHtmlTags — XSS PREVENTION" and all six
      tests under it set a node label or description and then searched the
      SVG canvas for injected elements. That is a true property of a
      different code path. Measured before the fix: reducing `stripHtmlTags`
      to `return html` left all 50 tests in the file passing. This is the
      second security entry in two days whose test block tested a
      neighbouring property under a matching name. Insight 6.53.
    - ONE OF THE SIX ASSERTED NOTHING. `nestedXssPayload_StrippedFromDescription`
      checked only that the node was not null, under a comment claiming
      descriptions pass through `stripHtmlTags`, which they do not. It now
      asserts the description is stored verbatim and that no element from the
      payload exists.
    - A DEAD HELPER WENT WITH IT. `getNodeGroups` queried
      `[role='button'][data-node-id]` while the component writes `data-id`,
      so it could only return an empty list. It had no callers.
    + THE INERTNESS ASSERTION NEEDS A REAL ENGINE and lives in
      tests/spinemap-inert-parse.spec.ts. jsdom starts no image load and runs
      no event handler, so restoring the detached `<div>` in the source
      leaves all 75 unit tests passing. That measurement is what makes the
      browser spec load-bearing rather than duplicative.
    + THE BROWSER SPEC COUNTS REQUESTS AND CARRIES A POSITIVE CONTROL,
      because a test for something that does not happen can pass for the
      wrong reason. Request counting needs no timing assumption: the old path
      makes one request for the payload's image, the new path makes none. The
      control is a second payload parsed through `div.innerHTML` in the same
      page with the same wait, so a wait that is too short fails the control
      instead of passing the assertion silently.
    + TWO MUTATIONS, RUN FOUR TIMES, AND THE COUNT IS THE RUNS NOT THE EDITS.
      The identity, `return html`, against the old code: all 50 tests pass,
      which is the probe above. The identity against the new code: 23 of the
      25 new unit tests fail, and the two survivors are honest — one feeds
      `plain text`, which is its own output, and one feeds the empty string,
      where the field is skipped before the adapter runs. The detached
      `<div>` restored in the source: nothing fails, which is why the browser
      spec exists. The same edit in the built bundle: the browser fix test
      fails on the handler assertion, after the positive control has already
      passed, and the characterisation test keeps passing. An earlier draft
      of this record, and the commit message of 05a0afc, said "seven
      mutations, six in the source and one in the built bundle". That was
      ADR-164's five-plus-one shape carried over to a change that does not
      have it. The sentence listed three runs and then claimed seven.
    + CRITICAL — SECURITY IS NOW EMPTY. All three entries from the March 2026
      audit are closed: SEC-3 was a defect with a fix, SEC-2 was a defect
      whose prescription was wrong but whose mechanism was real, and SEC-1
      was never a defect. Two of the three had a test block named after them
      that tested something else.
  files:
    - "components/spinemap/spinemap.ts"
    - "components/spinemap/spinemap.test.ts"
    - "tests/spinemap-inert-parse.spec.ts"
    - "components/spinemap/README.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "TESTING.md"
    - "agentknowledge/concepts.yaml"
    - "agentknowledge/history.jsonl"

- id: "ADR-166"
  title: "A generated document reads code, never prose"
  date: 2026-10-12
  status: "Accepted"
  context: |
    DEBT-DOC-1 was recorded on 11 October 2026, during the SEC-3 close-out,
    when a sentence written that day — "removes the whole class of script
    injection" — was published as an export named `class of`.

    `scripts/generate-docs.js` built each component's "Exports" line by
    running `/(?:class|function)\s+\w+/g` over the component's README PROSE.
    Any sentence containing either word became an API name. `\s` matches a
    newline, so a line ending in "class" also joined the first word of the
    next line, which is where `class category` came from.

    Measured against the built `d.ts`, which is the oracle check [19] uses
    and the only one independent of both the old code and the new: of the 54
    names published across 32 components, ONE was correct — `function
    createVisualTableEditor`. Thirty-seven name nothing the component's
    published types declare at all. The other 17 match a declared name, 15
    with the same keyword and 2 with a different one, and 14 of those are
    prose words colliding with a real declaration: `class on` seven times,
    `class names` and `class for` twice each, plus `class override`, `class
    or` and `function returning`. Every one of the 32 components published at
    least one wrong name, and 31 published nothing but wrong names.
    `docs/AGENT_QUICK_REF.md` listed `class on` 17 times and `function greet`
    twice, and greet is not a function this repository has.

    TWO EARLIER COUNTS ARE SUPERSEDED, and both are recorded because both
    were stated before the better oracle existed. The first, 38 of 54, was
    quoted to the user; it asked only whether the source declared the name at
    all rather than whether the name was public. The second, 53 of 54, was
    the right answer reached the wrong way, because it used the new
    extractors, and an extractor cannot grade itself.

    `extractFactory` had the same defect in the same file. It read the README
    for `create*` or `show*` followed by a bracket, and 26 of the 179 names
    it published across 21 components were not functions. That is measured
    against the component's SOURCE and not the bundle, because a boolean
    option named `showError` appears in the bundle as a property name: the
    bundle oracle reports only the 14 names, across 11 components, that do
    not exist in the component in any form.
  decision: |
    D1. Read the component's TypeScript, not its README. Prose is written for
        a human and will always contain the words a code regex looks for. The
        source is the only artifact that cannot disagree with itself.

    D2. Publish two lines, because this is an IIFE library and the two
        audiences differ. `Globals:` lists the `window` registrations, which
        is what a CDN consumer can actually call — an `export` keyword is
        invisible at run time in a bundle. `Exports:` lists the declarations
        a TypeScript consumer can import from the `.d.ts`.

    D3. Print `none` rather than omitting the line. Omission is what hid this
        defect for months: a component that published nothing looked the same
        as a component nobody had looked at. An empty `Exports:` is also a
        finding in its own right, because it means the file carries no
        `export` keyword at all (STD-1, STD-2).

    D4. Fix `extractFactory` in the same change rather than filing it. It is
        the same defect, in the same file, found by the same measurement.
        Leaving the twin would be the failure that insight 6.53 is about. It
        now filters the globals list for `create*` and `show*`, so a boolean
        option named `showError` can no longer be published as a function.

    D5. Anchor the export regex to the start of a line, with the `m` flag. The
        old pattern's `\s+` could span a newline, and an unanchored pattern
        reads a word inside a comment or a string literal as a declaration.

    D6. Structure check `[19]` must not reuse the generator's extractors. A
        check that shares an oracle with the thing it checks passes by
        construction. It reads the built `d.ts`, which tsc writes from the
        real export keywords, and the shipped bundle, which is what a
        consumer loads.
  consequences: |
    + THE PUBLISHED SURFACE IS NOW REAL: 1076 names across 125 components,
      each one verified against a built artifact. SpineMap's entry went from
      two listings of `class on` to one global and thirteen exported names.
    + A FOURTH REGISTRATION SYNTAX WAS FOUND BY MEASURING, not by reading.
      The first version of `extractGlobals` reported eleven components as
      having no public surface at all. Eight were the layout components,
      which hold the cast in a local first — `const w = window as …` then
      `w["createAnchorLayout"] = …`. Two more were the same shape. The
      eleventh, `themeinit`, really does register nothing, because it is a
      boot script, so `Globals: none` is the correct output there. "Zero is
      suspicious" is worth asserting on any extraction: a component with no
      public surface is either a boot script or a missed syntax.
    - THERE WERE NO TESTS FOR THIS FILE AT ALL, which is why a defect that
      published a wrong API name to the CDN survived for months.
      `scripts/generate-docs.test.ts` adds 16, and `scripts/**/*.test.ts`
      joins the vitest include. The extractors are reachable because the
      script now runs `main()` only under `require.main === module`.
    + CHECK [19] IS MUTATION-PROVEN THE HONEST WAY. Reverting the Exports
      line to the prose regex and regenerating fails 37 of the 54 names it
      emits. The other 17 are the prose-collision cases, and the check's
      header records that it cannot see them: its job is to stop the
      generator drifting back, and 37 failures fail the suite.
    + THE SEC-3 WORKAROUND CAN BE UNDONE, though it is left alone. The
      sentence in markdownrenderer's README was reworded on 11 October to
      avoid the words "class of". That rewording is no longer load-bearing.
      It is not reverted, because the current wording is no worse and a
      revert would be a change with no reader-visible benefit.
  files:
    - "scripts/generate-docs.js"
    - "scripts/generate-docs.test.ts"
    - "scripts/check-published-api.mjs"
    - "test-local.sh"
    - "vitest.config.ts"
    - "AGENTS.md"
    - "CODEBASE_FIXES.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: "ADR-167"
  title: "A fixture must change what is rendered, or the gate is measuring chrome"
  date: 2026-10-12
  status: "Accepted"
  context: |
    DEBT-DUI-6 was recorded on 2026-10-10 (ADR-160). The fleet gate's
    `renders-content` check asserts that mounting put something in the host.
    That assertion is true and useful, and the gate did NOT catch the failure
    it was written for. On 4 August 2026 a TreeView whose auto-detected
    `containerOption` was wrong constructed cleanly, rendered nothing, and
    satisfied every check including `destroy-clears-dom`. A human noticed it.
    `renders-content` was written in response and then found 17 components in
    the same state. DEBT-DUI-6 is that story one level down, and the lesson
    repeats: a check written after a miss closes the miss, not the class.

    It is also satisfied by chrome. A component whose shell is a trigger
    button, or a root div, or a toolbar and two panes, passes it with no data
    at all, and so does every other check that follows — `destroy-clears-dom`
    is trivially satisfied when nothing was added.

    Re-measured on the real gate before anything was written. Emptying the
    fixture for `usermenu`, `stacklayout` or `fileexplorer` in turn left all
    203 tests passing, confirming ADR-160. Swept across all seventeen glue
    files: of the thirteen that carry mount data, SEVEN could be replaced
    with an inert key and no test turned red — chartpanel, fileexplorer,
    permissionmatrix, personchip, stacklayout, treeview, usermenu.

    Two numbers in the original entry were wrong, both too kind to the gate.
    It said only timeline and multiselectcombo had fixtures the gate needed;
    the figure is six, because emptying datagrid, docviewer, multiselectcombo,
    splitlayout, stepper or timeline breaks a mount outright. And
    permissionmatrix was recorded as passing on its `emptyMessage`, which is
    true but is not why it was invisible: its data does reach the DOM.

    A FIRST ATTEMPT AT MEASURING THIS WAS THROWN AWAY. It reimplemented the
    gate's mount path in a probe file, and every component it reported as
    insensitive to its fixture was its own defect: three threw because the
    options never reached the factory, two rendered nothing because the
    probe's `mountMethod` handling was wrong. A probe that reimplements the
    harness measures the probe. The second attempt used the real gate and
    changed one glue file at a time.
  decision: |
    D1. Add a check rather than change one. `renders-content` keeps its
        assertion and its diagnostic, because it was never wrong, only
        incomplete, and its failure text is the one that names a wrong
        container option. `data-changes-render` is the missing half.

    D2. Compare two mounts rather than declare a selector per component. The
        check mounts a second instance with the fixture's options stripped
        and compares the hosts. Declaring an expected selector and count for
        each of a hundred components would be a hundred things to maintain
        and a hundred chances to declare something the component renders
        anyway. The differential needs no per-component declaration and is
        exactly the probe ADR-160 ran by hand.

    D3. Signature is the element sequence plus the normalised text, not the
        node count. A component that writes a fixture's label into chrome it
        would have rendered anyway changes the text and not the shape, and
        the data still arrived.

    D4. A baseline that cannot mount is a PASS, not a failure. Four
        components — docviewer, multiselectcombo, stepper, timeline — throw
        without their data. A factory that refuses to construct without data
        is the strongest proof available that the data reaches the DOM.

    D5. No exclusion list. No component needs one, and an empty allowlist
        invites an entry where a better fixture is the right answer. The
        failure diagnostic instead tells the author to say so in a comment
        and move the assertion to a Playwright spec, where the interaction a
        closed component needs is possible.

    D6. Assert the scope, because the check is conditional. It runs only for
        a target carrying fixture options, so it would go silent if the glue
        ever stopped reaching the target, and a check that quietly stops
        running looks exactly like a check that passes. A gate test asserts
        every `.conformance.ts` declaring mount options yields a target that
        still has them, with a floor of thirteen.
  consequences: |
    + ALL THIRTEEN MOUNT FIXTURES ARE NOW LOAD-BEARING, and the thirteen
      partition exactly: the seven the inert-key mutation catches and the six
      the empty-fixture mutation catches are disjoint and sum to thirteen.
      Nine pass by comparison, four because their factory will not construct
      without data.
    + BOTH NEW ASSERTIONS ARE MUTATION-PROVEN. Making treeview's fixture an
      inert key fails `data-changes-render` by name with the full
      diagnostic. Making `buildTarget` drop the glue options fails the scope
      test by name, along with six others.
    - EIGHTY-FOUR COMPONENTS STILL HAVE NOTHING TO COMPARE. Of the 97
      migrated components, 80 have no glue file and four more carry channel
      triggers without mount data. An earlier draft said 88 and attributed 84
      to the no-glue group alone, which double-counted the four; the 84 came
      from the discarded probe, which counted every component with a valid
      manifest rather than the migrated set. For those, `renders-content` still proves only
      that the host is not empty. That is a fixture-writing programme rather
      than a gate defect, and it stays open in DEBT-DUI-6's successor text.
    + THE GATE IS 204 TESTS, up from 203, and the new check costs one extra
      mount for each of thirteen components.
  files:
    - "runtime/src/conformance.ts"
    - "runtime/runtime.ts"
    - "runtime/fleet-conformance.test.ts"
    - "CODEBASE_FIXES.md"
    - "AGENTS.md"
    - "TESTING.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: "ADR-168"
  title: "A count whose file set and pattern are not written down is not a measurement"
  date: "2026-10-13"
  status: "accepted"
  context: |
    CODEBASE_FIXES.md carried counts from a March 2026 audit. Spot checks had
    already shown several were wrong, and the assumption was that they were
    merely stale. They are worse than stale: they are not reproducible.

    `console.log` was measured three times across this work as 406, then 200,
    then 176, with no change to the code in between. The reason is that
    neither the file set nor the pattern was ever recorded, so each
    measurement answered a slightly different question. WIN-1 was worse still.
    Its entry was re-measured on 2026-10-12 as "311 occurrences on 203 lines
    in 113 non-test files". The file count is right and the other two numbers
    match no file set in the repository, while the code containing those casts
    is byte-identical at every commit from `4daccb4` to `38c6f1b`. The
    counting command was never written down, so the error cannot be traced.

    Two further errors surfaced while measuring, both in probes written for
    this work. A probe searching shipped bundles for published API names kept
    the trailing parentheses the quick reference writes, so it reported
    seventeen real names as missing. A per-file count used `grep -oc`, where
    `-c` silently overrides `-o` and counts matching lines rather than
    occurrences, which is very likely how a line count became an occurrence
    count in the WIN-1 entry.

    Re-measuring also changed a verdict rather than a magnitude. LOG-1 asks
    for `console.log` to become `console.debug` and cites LOGGING.md. The tree
    holds 176 lines containing the token, and 161 are the body of a logging
    shim where `console.log` is the correct mapping for INFO. The authority for
    that shim is FRONTEND_LOGGING.md, which supersedes LOGGING.md and
    contradicts it: LOGGING.md forbids a shared logger module and
    FRONTEND_LOGGING.md ships one as a component and requires every component
    to use it.
  decision: |
    D1. CLOSE LOG-1 AS OBSOLETE RATHER THAN FIXING IT. Its count described a
        tree that no longer exists and its authority was superseded. Two
        genuine bare call sites remain, both in `errordialog.ts`, and they
        belong to the successor item because that component has no shim at
        all.
    D2. OPEN LOG-2 FOR THE CONTRADICTION FIRST AND THE FILES SECOND. The two
        logging documents must be reconciled before any migration, because an
        item citing a dead standard is how LOG-1 survived six months. 24
        files carry the shim without the `LogUtility` check and two call the
        console directly with a hand written prefix.
    D3. STATE THE FILE SET AND THE PATTERN IN CODE. `scripts/audit-counts.mjs`
        declares the file set once as tracked `*.ts`, excluding tests and
        anything under `dist/`, and every count derives from it.
    D4. CLASSIFY, DO NOT COUNT TOKENS. A `console.log` line is a shim body, a
        doc comment example, string data drawn on a canvas, the log utility's
        own fallthrough, or a real call site. Only the last is a violation,
        and the five outcomes are disjoint.
    D5. RATCHET EACH COUNT. Every count carries a baseline measured on a
        stated date, and check `[20]` fails when one rises. Lowering a
        baseline is how progress is recorded.
    D6. TEST THE CLASSIFIER, BECAUSE IT WAS WRONG THREE TIMES. Twenty-one
        tests pin every outcome, and all three bugs are regressions in that
        file rather than lessons in a document.
    D7. DATE EVERY FIGURE IN THE TRACKER. An undated count is an unverified
        claim from March 2026, and the summary now says so in those words.
  consequences: |
    + EVERY COUNT IN THE TRACKER IS NOW RE-DERIVABLE with one command, and
      check `[20]` holds ten of the eleven. The suite is 32 checks, up from 31.
      The exception is UNUSED-1, which needs a type check rather than a scan,
      so the tracker states the `tsc` command and says it is not ratcheted.
    + NINE OF THE TEN MARCH COUNTS RE-MEASURED SO FAR WERE WRONG, and the
      errors run in both directions: MRK-1 12 to 3, MRK-2 22-of-24 to 2-of-29,
      MRK-3 10 to 4 and LOG-1 406 to 2, against IMP-1 47 to 113, ANY-1 60 to
      88, WIN-1 62 to 294, UNUSED-1 119 to 421 and STD-1 19,198 to 30,693
      lines. The tenth, ERR-1, was never a count. Guessing which way a stale
      number leans is not available.
    + MRK-2 WAS WRONG BY A FACTOR OF ELEVEN and the evidence was already on
      screen. It claimed 22 of 24 files in `components/diagramengine/src/`
      lacked the marker. It is 2 of 29, and both files were already named by
      MRK-1, so MRK-2 adds nothing MRK-1 does not cover. The listing that
      proves it came out of the MRK-1 measurement and went unread for several
      steps, which is its own lesson: gathering evidence is not reading it.
    + THREE IDENTITY MUTATIONS PROVE THE TESTS. Treating every line as a shim
      body fails seven of the twenty-one, counting lines instead of
      occurrences fails two, and ignoring string literals fails four.
    + A THIRD CLASSIFIER BUG, FOUND IN REVIEW AND LATENT RATHER THAN ACTIVE.
      `insideStringLiteral` tracked each quote type's parity independently, so
      an apostrophe inside a double-quoted string left an odd single-quote
      count and filed a real call site as string data. It is now a single pass
      that tracks which quote is open, with that line as a test case. The
      161/10/2/1/2 partition is unchanged, which is how the bug is known to
      have been latent.
    + A CORRECTION TO THE WIN-1 RE-MEASUREMENT OF 2026-10-12, which was
      written straight into the tracker by commit `4daccb4` and never
      recorded in an ADR. Its 311 occurrences on 203 lines is replaced by
      294 on 186, with 112
      preamble lines carrying 220 of the occurrences and 74 sitting one per
      line. The sub-figure of 86 files whose only violation is the preamble
      was verified and stands. The claim of 15 `createHoverCard` reads was
      wrong and is 6.
    + IMP-1 WAS COUNTING THE WRONG FILES. The entry is about SCSS sources and
      the first draft of this script counted tracked `*.css`, which holds one
      occurrence against the sources' 113. Generated files measure the build,
      not the code.
    - IT COUNTS TOKENS, NOT INTENT. Whether a call site chose `logDebug` where
      `logInfo` was right is not answerable by grep, and that was the real
      question LOG-1 asked. Closing LOG-1 does not answer it.
    - THE BASELINES ARE A SNAPSHOT, NOT A TARGET. They record 2026-10-13 at
      `38c6f1b` and only stop silent growth. Nothing in the gate drives any
      count down.
    - THE RATCHET HOLDS LOCALLY AND NOT IN CI. `.github/workflows/ci.yml` runs
      `npm ci`, `build:css`, `build:ts` and `test:unit:coverage` only, so the
      whole structure suite, all 32 checks and not merely this one, runs where
      `./test-local.sh` is run. A count can therefore rise in a branch that CI
      calls green. Wiring the suite into CI is the obvious next step and is
      deliberately not bundled into this change.
  files:
    - "scripts/audit-counts.mjs"
    - "scripts/audit-counts.test.ts"
    - "test-local.sh"
    - "CODEBASE_FIXES.md"
    - "AGENTS.md"
    - "TESTING.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
