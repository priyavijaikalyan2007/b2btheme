- id: "ADR-115"
  title: "Sidebar conditional rendering of Close and Float buttons"
  date: "2026-04-12"
  status: "Accepted"
  context: >
    Sidebar component rendered the Close (x) and Float/Undock buttons unconditionally
    in the header, even when the host configuration disabled them. The Float button
    appeared regardless of draggable setting, and there was no option to hide the
    Close button at all.
