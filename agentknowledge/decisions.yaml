- id: "ADR-125"
  title: "HoverCard reusable primitive + GraphCanvas adoption"
  date: "2026-04-20"
  status: "Accepted"
  context: >
    GraphCanvas (and Strukture graph in a downstream app) shipped a basic
    per-component tooltip — plain text, no icon, no badge, no properties
    block, no dark-mode card framing. Ontology Visualizer team requested a
    Bootstrap-styled card with title/icon/type/badge/properties/description.
    Rather than upgrade GraphCanvas in place (which would re-invent the
    same card for Timeline, SpineMap, TreeView, DataGrid next quarter),
    built HoverCard as a reusable primitive in components/hovercard/ and
    adopted it inside GraphCanvas. Factory createHoverCard returns a
    HoverCardHandle (show/hide/update/reposition/isOpen/destroy).
    attachHoverCard(anchor, getContent, { shared }) wires hover + focus
    events; the shared option lets a host create one DOM node and wire
    hundreds of anchors to it (critical for large graphs). Content is
    declarative (HoverCardContent: title/subtitle/icon/iconColor/badge/
    properties/description/footer) with HTMLElement + string escape
    hatches. textContent only — never innerHTML for caller-supplied
    strings. Pure computePosition() does 4-way placement with cross-axis
    clamping; primary axis must fit. Dismissal via ESC, scroll ancestor,
    resize, browser-native contextmenu DOM event (yields to ContextMenu,
    native or ours), custom hovercard:yield CustomEvent (opt-in), and
    rAF-polled anchor detachment. Informational only — role=tooltip,
    pointer-events: none, no tab order, no scroll. maxHeight ceiling
    (320px default) with CSS ::after fade mask protects the escape-hatch
    path; declarative path degrades predictably via maxProperties and
    3-line description clamp. Z-index 1005 (above legacy gc-tooltip 1000,
    below modals 1050+, floating Toolbar popups 1060, ContextMenu 1080).
    Touch-primary devices (hover: none) no-op attachHoverCard; touch
    users get the host's alternative surface. Default delays tightened
    to 250ms open / 100ms close. GraphCanvas additions are non-breaking:
    new GraphNode.description + GraphEdge.description, new options
    tooltipMode (builtin | custom | off), renderNodeTooltip,
    renderEdgeTooltip. Legacy .gc-tooltip private DOM and TOOLTIP_DELAY
    removed. Existing onNodeHover / onEdgeHover callbacks preserved.
    IIFE runtime convention: hovercard.ts publishes createHoverCard and
    attachHoverCard to window; graphcanvas.ts resolves via (window as
    any).createHoverCard and silently skips when the HoverCard bundle
    is not loaded.
  files:
    - "components/hovercard/hovercard.ts"
    - "components/hovercard/hovercard.scss"
    - "components/hovercard/hovercard.test.ts"
    - "components/hovercard/README.md"
    - "components/graphcanvas/graphcanvas.ts"
    - "components/graphcanvas/graphcanvas.scss"
    - "components/graphcanvas/graphcanvas-hovercard.test.ts"
    - "components/diagramengine/src/stencils-ui-components.ts"
    - "demo/components/hovercard.html"
    - "demo/all-components.html"
    - "demo/studio/component-studio.html"
    - "specs/2026-04-20-graphcanvas-hover-card.md"
    - "specs/hovercard.prd.md"
    - "specs/hovercard.plan.md"

- id: "ADR-126"
  title: "HoverCard adoption — ActionItems and DiagramEngine"
  date: "2026-04-21"
  status: "Accepted"
  context: >
    Following ADR-125 (HoverCard primitive + GraphCanvas adoption), the
    apps team asked which other components would benefit. Two components
    were identified as strong fits: ActionItems (list rows carry rich
    metadata — assignee, due date, status, priority, tags, comments,
    content — too much for a single row) and DiagramEngine (shapes and
    connectors carry semantic.type, semantic.data, textContent, and
    tags). Ribbon tooltips and single-line labels were explicitly
    excluded; their existing affordances (title, HelpTooltip) suit their
    density.

    ActionItems defaults to `itemHoverCardMode: "builtin"` — it's a
    read-heavy list where hover context is pure upside. The default
    extractor intentionally shows *extra* info (full content as title,
    assignee as subtitle, status/priority badge, dates and comments as
    properties, tag labels as footer) rather than re-showing what the
    visible row already contains. Wiring uses `attachHoverCard` per row
    with a single shared card on the instance; per-row disposers are
    tracked in `hoverDisposers[]` and flushed on every re-render and
    on destroy so listeners never leak.

    DiagramEngine defaults to `objectHoverCardMode: "off"` — it's an
    editor, and hover popups during draw/pen/brush fight the editing
    flow. Host apps opt in when they want it (e.g. the demo turns it
    on). When enabled, the engine only shows the card while the active
    tool is "select" and no interaction is in progress. The latter
    required a minimal addition: an optional `isInteracting()` method
    on the Tool interface, forwarded by `ToolManager.isInteracting()`,
    implemented by SelectTool (any drag mode), ConnectorTool (mid-
    draw), and PanTool (mid-pan). Other tools inherit the conservative
    default of "not interacting" because they never switch to select
    mode during their active state.

    DiagramEngine wires via central pointermove + hit-test rather than
    per-object listeners because objects are re-created by
    rerenderObject and per-element rebinding would be fragile. Hit-test
    tries objects first, then connectors (mirrors the existing context-
    menu dispatch order). The anchor element is found by data-id /
    data-connector-id selector on the current SVG. On mouseup the card
    is hidden once to clear any stale anchor that pre-dated a drag.

    Default extractors are pure module functions (`buildObjectHover-
    Content`, `buildConnectorHoverContent`) so unit coverage is cheap.
    Both run `stringifyValue` over `semantic.data` and skip the
    reserved key `description`, which is promoted to the card's
    description slot when it's a string. The first `semantic.tags`
    entry becomes a primary badge; labels for connectors come from
    `presentation.labels[0].textContent.runs`.

    Resilience matches ADR-125: factory lookup via
    `(window as any).createHoverCard` returns null when HoverCard isn't
    loaded, and all wiring paths tolerate that. Tests cover the
    default-off behaviour, mode-custom render + null short-circuit +
    string XSS, tool-state suppression, and resilience-when-absent.
    20 new tests (11 ActionItems + 9 DiagramEngine); 3,880 total green.
  files:
    - "components/actionitems/actionitems.ts"
    - "components/actionitems/actionitems-hovercard.test.ts"
    - "components/diagramengine/src/types.ts"
    - "components/diagramengine/src/engine.ts"
    - "components/diagramengine/src/tool-manager.ts"
    - "components/diagramengine/src/tool-select.ts"
    - "components/diagramengine/src/tool-connect.ts"
    - "components/diagramengine/src/tool-pan.ts"
    - "components/diagramengine/diagramengine.ts"
    - "components/diagramengine/diagramengine-hovercard.test.ts"
    - "demo/components/actionitems.html"
    - "demo/components/diagramengine.html"
    - "specs/hovercard-adoption.prd.md"
    - "specs/hovercard-adoption.plan.md"
- id: "ADR-127"
  title: "GraphCanvas edge label density + collision avoidance"
  date: "2026-04-22"
  status: "Accepted"
  context: >
    The apps team filed a P2 readability bug against the CDN GraphCanvas
    (specs/2026-04-21-graphcanvas-edge-label-stacking-at-hubs.md): on
    schema graphs with a type of degree ≥ 5 (e.g. `strukture.org_unit`),
    all incident edge labels stacked at roughly the same pixel and
    became an illegible smudge. Root cause: `renderEdgeLabel` placed
    every label at the cubic-Bézier midpoint (t = 0.5), and the
    existing perpendicular offset only separates *parallel* edges
    between the same node pair — not different edges sharing a hub.
    Force-directed layouts cluster a hub's neighbors on one side of
    the hub, so midpoints of hub→neighbor edges pile up there.

    The only app-side lever was `showEdgeLabels`, a global boolean;
    flipping it to `false` hid the labels on sparse edges too, which
    the user rolled back on 2026-04-21.

    Decision: introduce `edgeLabelDensity: "all" | "hub-compact" |
    "none"` on `GraphCanvasOptions`, defaulting to `"hub-compact"`.
    Hub-compact renders a 2–3 char abbreviation on edges where either
    endpoint has visible degree ≥ `hubDegreeThreshold` (default 5);
    non-hub edges keep their full label. All label placement (compact
    or full) runs through a greedy collision-avoidance loop that steps
    the Bézier parameter t outward from 0.5 through a fixed candidate
    list (0.5, 0.45, 0.55, 0.4, 0.6, …) and places the label at the
    first t whose estimated bbox does not overlap any already-placed
    label; falls back to t = 0.5 if none fits (i.e. never hide). bbox
    width is estimated as `len * fontSize * 0.6` so the algorithm is
    deterministic under jsdom (getBBox returns zeros).

    Short-form rule is fixed and testable: multi-word labels →
    up-to-3 word initials (`"Sourced From"` → `"SF"`), single-word →
    first two chars uppercased (`"Mirrors"` → `"MI"`). The full label
    is always surfaced via the edge HoverCard on hover — the mouseenter
    listener fires regardless of on-canvas text, so the discovery
    channel is preserved (explicitly tested).

    Backward compatibility: the legacy `showEdgeLabels: false` still
    forces density to `"none"` and wins over any `edgeLabelDensity`
    value. Otherwise `edgeLabelDensity` wins when both are set. A
    behaviour-change note is called out in CHANGELOG and the component
    README — apps that relied on the old "everything at midpoint"
    rendering will see hub labels abbreviated unless they explicitly
    opt into `edgeLabelDensity: "all"`.

    Rejected: a SAT-based label solver (overkill for the common 6–8-
    label hub case); folding overlapping labels into a single "+N
    relationships" chip (conflicts with the at-a-glance goal — users
    would have to click to discover even the first relationship);
    suppressing labels entirely on hub edges (same regression as
    `showEdgeLabels: false`).

    Out of scope (tracked separately if needed): `renderEdgeConfidence`
    still places the `ai_inferred` percentage at t = 0.5 unconditionally
    — this was not called out in the bug report, and the hub-compact
    path leaves it alone to avoid an unrelated visual change.

    12 new tests (`graphcanvas-edge-labels.test.ts`) cover density
    none / all / hub-compact (default), short-form rules for both
    multi- and single-word labels, sparse-graph non-regression,
    threshold override, `.gc-edge-label-compact` CSS hook, hover
    channel intact on short-form, collision stepping producing
    distinct (x, y) positions, and the `showEdgeLabels: false`
    backward-compat override. Full suite: 3,893 / 3,893 green.
  files:
    - "components/graphcanvas/graphcanvas.ts"
    - "components/graphcanvas/graphcanvas.scss"
    - "components/graphcanvas/graphcanvas-edge-labels.test.ts"
    - "components/graphcanvas/README.md"
    - "specs/2026-04-21-graphcanvas-edge-label-stacking-at-hubs.md"

- id: "ADR-128"
  title: "CategorizedDataInlineToolbar UX pattern — optional, host-hookable, six-component first batch"
  date: "2026-04-26"
  status: "Accepted"
  context: >
    Repeated dogfooding of RelationshipManager surfaced a recurring
    pattern the component library had been re-litigating per-component:
    any panel that presents detailed data as multiple grouped cards or
    as a tree structure to convey categorization needs (a) a way to
    sort the groups by name ascending/descending and (b) a way to
    collapse or expand all groups at once. Without these, users have
    to scroll a long list to find one item, or toggle each group
    header individually. The same need appeared across RelationshipManager,
    TreeView, ActionItems, ExplorerPicker, DataGrid card-mode, and
    Timeline — each had been solving (or ignoring) it independently,
    leading to inconsistent affordances across apps.

    Survey: of the six initially-considered components (RelationshipManager,
    TreeView, ActionItems, ExplorerPicker, DataGrid, Timeline), only four
    are real fits. DataGrid is flat-tabular with per-column sort UI — no
    grouping, pattern does not apply. ExplorerPicker uses sections as a UI
    layout device for search results / ontology nodes, not data categori-
    zation, and has no public sort API; the pattern is semantically muddy
    there and is dropped from the first batch. TreeView already ships its
    own `.treeview-toolbar` with `toolbarActions`, `setSortMode`, and
    `expandAll/collapseAll`; it adopts the pattern by extending that
    existing toolbar with the four default actions when opted in (no
    second toolbar is mounted). RelationshipManager, ActionItems, and
    Timeline mount InlineToolbar in their panel header (Timeline gains a
    new header row above the axis since it had none).

    Decision: codify a reusable UX pattern, "CategorizedDataInline-
    Toolbar", recorded in agentknowledge/concepts.yaml. Rule: whenever
    a component renders multiple cards-by-category OR a tree
    conveying categorization, the component MUST expose an OPTIONAL
    InlineToolbar (or extend its existing toolbar) in its panel header.
    Default behaviour is OFF. The host opts in via `showInlineToolbar:
    true` (or a component-equivalent boolean). When enabled the toolbar
    offers at minimum (1) sort ascending by group name, (2) sort
    descending by group name, (3) collapse all groups, (4) expand all
    groups. Toolbar uses InlineToolbar size="sm", icon-only buttons,
    lives on the same row as the panel title.

    Two reasons for opt-in default: (1) the user explicitly told the
    component-library team not to assume consuming-app behaviour —
    teams know their data shape better than the library does; (2) the
    pattern can be visually noisy on small surfaces (e.g. a sidebar-
    embedded RelationshipManager with two relationship types), and
    forcing it would push a fix-up burden onto every existing
    consumer.

    Hookable events: every toolbar action emits a callback AND applies
    the change internally, so hosts can run controlled (intercept and
    drive state externally) or uncontrolled (let the component manage
    state). The shared callback shape across the six components is:
    `onSortModeChange(mode: "asc" | "desc" | null)` and
    `onCollapseStateChange(state: "all-collapsed" | "all-expanded" |
    "mixed")`. Initial values come from `initialSortMode` and
    `initialCollapsedState` options. Public setters (`setSortMode`,
    `expandAll`, `collapseAll`) preserve the imperative path. State
    round-trips so apps can persist and restore.

    Scope of this batch: four components — RelationshipManager,
    ActionItems, Timeline, and TreeView. RelationshipManager,
    ActionItems, and Timeline mount a new InlineToolbar; TreeView
    extends its existing `.treeview-toolbar` with the four default
    actions when the host opts in. ActionItems and Timeline already
    have grouping options that gate the toolbar's relevance; the
    toolbar shows only when grouping is active.

    Resilience: components resolve `window.createInlineToolbar`
    defensively (factory lookup; null when InlineToolbar bundle is
    not loaded — `showInlineToolbar: true` becomes a silent no-op).
    Pattern matches ADR-125 / ADR-126 (HoverCard).

    The pattern applies regardless of dataset size — no minimum-
    group-count gate, per the user's directive: "let's not make
    assumptions for the user's expectations." Components opt OUT
    only by structural mismatch (flat lists, single-group cards,
    non-categorized layouts).

    Rejected alternatives:
    - Forcing the toolbar on by default: would impose UX on existing
      consumers without warning; conflicts with the "don't assume"
      directive.
    - Inventing a per-component toolbar each time (status quo): leads
      to inconsistent iconography, inconsistent keyboard shortcuts,
      and duplicated test surface.
    - Building a higher-level "GroupedListContainer" wrapper that
      injects the toolbar automatically: would force adopters into
      a specific DOM structure they may not own; the InlineToolbar
      composition path is cheaper and matches Toolbar/HoverCard
      adoption.
    - Gating on item count (e.g. ">= 5 groups"): rejected at user
      request — assumes consumer behaviour the library cannot know.
    - Putting the rule only in AGENTS.md instead of agentknowledge/:
      machine-readable concepts.yaml is read at session start and
      cross-references InlineToolbar; AGENTS.md is already long and
      this is a discoverable-on-need rule, not a session-wide one.

    Out of scope: optional secondary operations (filter, search,
    density toggle, group-by selector). Components MAY add these to
    their InlineToolbar; the four defaults are the floor. Mobile/
    touch icon-row sizing also out of scope — InlineToolbar's
    existing size variants apply unchanged.

    AMENDMENT (2026-04-26): ActionItems exception — components that
    already ship a richer multi-mode sort dropdown (priority, due-
    date, assignee, created, modified, etc.) MUST surface alpha
    sort by adding `alpha-asc` and `alpha-desc` SortOption values
    to that existing dropdown rather than duplicating sort buttons
    in the InlineToolbar. ActionItems' InlineToolbar therefore
    exposes only expand-all and collapse-all (two items, not the
    canonical four) when `showInlineToolbar: true`. Rationale: a
    duplicated alpha-sort affordance would split the sort surface
    across two controls and force users to reason about a parallel
    "alpha overlay" state on top of the primary sort — confusing
    for both users and downstream agents. Single-source-of-truth
    via the existing dropdown is cleaner. Affected change: removed
    the parallel `alphaSortMode` state, `setAlphaSortMode`/
    `getAlphaSortMode` methods, `initialAlphaSortMode` /
    `onAlphaSortModeChange` options, the `applyAlphaOverlay` helper,
    and the `ActionItemsAlphaSortMode` exported type. Added
    `alpha-asc` and `alpha-desc` to `SortOption` with comparators
    sorting items by `content.localeCompare`. RelationshipManager,
    Timeline, and TreeView retain the canonical four-action shape
    because none of them ship a comparable existing sort dropdown.
    Net test delta: −2 (3,939 → 3,937).
  files:
    - "agentknowledge/concepts.yaml"
    - "agentknowledge/decisions.yaml"
    - "components/inlinetoolbar/README.md"
    - "components/relationshipmanager/relationshipmanager.ts"
    - "components/relationshipmanager/relationshipmanager.scss"
    - "components/relationshipmanager/relationshipmanager.test.ts"
    - "components/relationshipmanager/README.md"
    - "components/treeview/treeview.ts"
    - "components/treeview/treeview.scss"
    - "components/treeview/treeview.test.ts"
    - "components/treeview/README.md"
    - "components/actionitems/actionitems.ts"
    - "components/actionitems/actionitems.scss"
    - "components/actionitems/actionitems.test.ts"
    - "components/actionitems/README.md"
    - "components/timeline/timeline.ts"
    - "components/timeline/timeline.scss"
    - "components/timeline/timeline.test.ts"
    - "components/timeline/README.md"

- id: "ADR-129"
  title: "MetricCard (KPI card) — built component, not utility class extension"
  date: "2026-04-27"
  status: "Accepted"
  context: >
    Tenant Admin's reorganization onto NavRail + standard archetypes
    needs a single-value status card for dashboard "KPI strips" (4-6
    cards per row showing one prominent metric, label, optional trend
    delta, optional secondary stat). This was tracked as planned-but-
    not-built in MASTER_COMPONENT_LIST.md §10.2 ("KPI / Metric Card").
    The apps team filed a request spec on 2026-04-27 (specs/2026-04-27-
    tenant-admin-cdn-components.md) and asked whether to extend the
    `.metric-card` Bootstrap utility class or create a new component
    slug.

    Decision: ship as a new component at slug `metriccard` rather than
    extending the utility class. Reasons: (1) the spec requires four
    lifecycle states (ready / loading / error / empty) with state-
    transition guarantees (no layout jump on loading->ready); (2) it
    needs a handle (setValue, setTrend, setSecondary, setState,
    destroy) for async data sources that resolve after first paint;
    (3) it needs intent-aware trend colouring with override semantics
    (direction up + intent negative for "errors increased" cases) -
    none of which a CSS utility can express.

    Surface: factory `createMetricCard(opts) => MetricCardHandle`,
    matching StatusBadge / Toast / FormDialog conventions. Two sizes
    (sm 11px label / 22px value, md 12px label / 32px value) for dense
    analytics rows. Optional inline sparkline (24px tall) - added to
    the spec at UI-team review beyond the original ask, because
    MASTER_COMPONENT_LIST.md §10.2 explicitly called for it and the
    library should be a superset of any single app's needs.

    Click semantics: when `href` is set, root is an `<a href>`; when
    only `onClick` is set, root is a `<button type="button">`.
    Native semantics handle Enter/Space - no manual key handlers,
    correct ARIA role inferred from the element. Avoids the spec's
    original `role="link"`-for-onClick suggestion which would have
    been semantically wrong (links are for navigation, buttons for
    actions).

    Theme tokens: uses the `--theme-*` layer defined in
    src/scss/_dark-mode.scss with SCSS-variable fallbacks per the
    custom.scss precedent: `var(--theme-metric-positive, $green-700)`,
    `var(--theme-surface-raised-bg)`, `var(--theme-text-primary)` etc.
    Honours `data-bs-theme` automatically through CSS cascade - no
    JS theme listener needed for the card itself (Chart wrapper does
    need it because Chart.js paints to canvas).

    State semantics: `loading` shows skeleton shimmer over the value
    while keeping label visible and reserving height (no layout jump);
    `error` renders an em-dash and optional error text; `empty` renders
    only the em-dash; `ready` paints the value. `aria-busy="true"`
    while loading.

    Rejected alternatives:
    - Extending the .metric-card utility class: cannot express
      lifecycle states or imperative handle.
    - role="link" for onClick-only cards: semantically wrong (links
      navigate; buttons trigger actions); native <button> handles
      Enter/Space already.
    - --bs-secondary-bg / --bs-tertiary-bg tokens (per the original
      spec): the project standard is the --theme-* layer; mixing
      both creates drift between this card and the rest of the
      library on dark mode.
    - Adding --metric-card-* component-specific tokens: the existing
      --theme-* tokens cover every surface; new tokens would dilute
      the design-system contract.
  files:
    - "agentknowledge/decisions.yaml"
    - "components/metriccard/metriccard.ts"
    - "components/metriccard/metriccard.scss"
    - "components/metriccard/metriccard.test.ts"
    - "components/metriccard/README.md"
    - "specs/2026-04-27-tenant-admin-cdn-components.md"

- id: "ADR-130"
  title: "ChartPanel — Chart.js wrapper following ADR-028 external-globals pattern"
  date: "2026-04-27"
  status: "Accepted"
  context: >
    Same Tenant Admin reorg request needed a theme-aware wrapper
    around Chart.js for the bar / line / area / sparkline charts in
    the analytics pages. Tenant Admin (and other consumers) must not
    call Chart.js directly so that theme drift cannot leak through
    and dependency management has a single point.

    Initial spec from the apps team called for Chart.js to be bundled
    inside the wrapper (`components/chart/chart.js` UMD with Chart.js
    inlined, ≤90 KB gzip combined). UI-team review surfaced that this
    contradicts the established pattern: CodeMirror (ADR-028), marked,
    highlight.js, KaTeX, mermaid, and @viz-js/viz are all consumed via
    `window.<global>` by their respective wrappers (codeeditor.ts,
    markdownrenderer.ts), with the consuming app loading the third
    party via its own <script> tag. Bundling Chart.js inside would
    require adding esbuild/rollup to the build pipeline (currently
    just tsc + wrap-iife.sh + sass) and would diverge from a pattern
    the rest of the library has settled on.

    Decision: ChartPanel follows ADR-028. The wrapper reads
    `window.Chart` (Chart.js >= 4.4.0, < 5.0.0), aliases it internally
    as `ChartJS` to avoid name shadowing, and renders a literate error
    (per LITERATE_ERRORS.md) when the global is missing - exactly as
    codeeditor.ts does for CodeMirror. The wrapper alone targets ≤8 KB
    gzip; bundle size of Chart.js itself becomes the consuming app's
    deployment concern (caching across apps, version pinning).

    Naming: renamed from `Chart` to `ChartPanel` to avoid shadowing
    the `Chart` constructor that Chart.js installs on `window`.
    Factory `createChartPanel(opts) => ChartPanelHandle`. Public types
    `ChartPanelOptions`, `ChartPanelKind`, `ChartPanelSeries`. The
    suffix matches helpdrawer / commandpalette / formdialog pattern
    (descriptive of role, not dependency).

    Theme awareness: Chart.js paints to a `<canvas>` so CSS cascade
    cannot reach inside. Wrapper uses
    `getComputedStyle(documentElement).getPropertyValue("--theme-...")`
    to resolve every paint colour at render time, plus a
    MutationObserver on `<html>[data-bs-theme]` (themetoggle.ts:219
    is the canonical writer of that attribute) to recompute and
    re-render when the user toggles theme. Tooltips re-themed via
    Chart.js plugin options.

    Performance: ResizeObserver on the container, debounced at 100ms.
    `setData` with the same series IDs disables animation to prevent
    janky loops on poll-driven dashboards (initial render may animate).
    Initial render <50ms for 30 datapoints; setData under 16ms (single
    frame).

    Accessibility: `ariaLabel` is required (TS-enforced - chart is not
    decorative). Visually-hidden `<table>` (`fallbackTable`, default
    on) renders the same data as the chart for screen readers, similar
    to the canonical "data table for canvas chart" accessibility
    pattern. Caller can disable. Sparkline kind defaults to no axes,
    no legend, no value labels - the panel collapses to its visual
    minimum.

    `exportSVG` dropped: Chart.js renders to canvas, no native SVG
    output. Server-side path is the option for callers who need SVG.
    `exportPNG` retained (canvas.toBlob).

    Hex fallbacks (`FALLBACK_INTENT_HEX` in chartpanel.ts) — kept
    intentionally despite the spec's "no hex literals" rule. They are
    a safety net for environments where `getComputedStyle` returns
    an empty string for `--theme-*` variables: jsdom under vitest,
    and the brief window before custom.scss is parsed during page
    load. Runtime paint always tries the `--theme-*` token first; the
    hex constant is read only when the token is empty. The spec's
    rule is preserved in spirit (no hex chosen by humans for visual
    intent — the hex values mirror the light defaults from
    `_dark-mode.scss :root`).

    Rejected alternatives:
    - Bundle Chart.js inside the wrapper: requires bundler in build
      pipeline; diverges from CodeMirror / marked / KaTeX precedent;
      defeats consumer-side caching of the Chart.js bundle across
      apps that share a CDN.
    - Re-export Chart.js as a side effect: callers could still reach
      under the wrapper and call Chart.js directly, breaking the
      single-point-of-theme-control invariant.
    - --bs-* CSS variables only (per the original spec): inconsistent
      with the project's --theme-* layer.
    - Animation on `setData` always: causes visible jank on
      30-second polling dashboards.
    - Optional `exportSVG()`: canvas->SVG is non-trivial and would
      require a second renderer; cleaner to drop than to ship a
      half-working method.
  files:
    - "agentknowledge/decisions.yaml"
    - "components/chartpanel/chartpanel.ts"
    - "components/chartpanel/chartpanel.scss"
    - "components/chartpanel/chartpanel.test.ts"
    - "components/chartpanel/README.md"
    - "specs/2026-04-27-tenant-admin-cdn-components.md"

- id: "ADR-131"
  title: "NavRail — toggle moved to top of rail; dev-mode overlap warning"
  date: "2026-04-28"
  status: "Accepted"
  context: >
    Two issues surfaced during NavRail integration testing with the apps team
    (2026-04-28):

    (1) Inconsistency with Sidebar — NavRail rendered its collapse/expand
    chevron at the very bottom of the rail (after the footer slot), while
    Sidebar renders its collapse button in the actions row at the top of its
    header (sidebar.ts:968). This split the "rail-control affordance" across
    two different positions on the same edge of the screen, forcing users to
    look in two places depending on which surface they were touching. Industry
    references diverge — VS Code keeps a toggle near the bottom of its
    activity bar; Slack, Linear, and the Material navigation rail spec keep
    it near the top — but consistency *within this library* dominates: a user
    learning to collapse one surface should be able to use the same gesture
    location on the sibling surface.

    Decision (1): Move the navrail-toggle button to the top of the rail
    (first child of the root in `buildDOM`, above header/search/body/footer)
    and flip its SCSS divider from `border-top` to `border-bottom` so it
    visually separates from whatever follows. Tests look up the toggle by
    `.navrail-toggle` class; reordering is invisible to the public surface.
    Footer remains a slot for account/settings (true bottom-of-rail content).

    (2) Content-overlap surprises — NavRail is `position: fixed` (z-index
    1031). It publishes `--navrail-left-width` / `--navrail-right-width`
    CSS custom properties (NavRailManager) and the README explicitly tells
    consumers to either consume those vars on their content wrapper or wrap
    NavRail + content in a `DockLayout` (`contained: true`). The apps team
    skipped both paths and observed content sliding under the rail. Docs
    alone are insufficient; a runtime hint converts a documentation miss
    into an immediate, actionable signal.

    Decision (2): Add a one-shot, dev-mode heuristic at startup. After two
    `requestAnimationFrame` ticks (lets the browser apply the published vars
    and run consumer-side layout), the rail probes `elementFromPoint` just
    past its outer edge. If the topmost non-rail element extends back under
    the rail's footprint, log a `[NavRail]` warning naming the CSS variable
    to consume and the DockLayout alternative. Skipped outright when
    `contained: true`. New `suppressOverlapWarning?: boolean` option
    silences the check for layouts that are intentional but trip the
    heuristic (e.g., transparent overlays).

    Resizable rail explicitly *not* added: NavRail's value is two stable
    widths (icon rail / labeled drawer), like an activity bar. Apps that
    want a draggable edge already have `Sidebar` (resizable, dockable,
    floatable). Adding resize to NavRail would blur the boundary the
    README draws between the two surfaces and would not fix the overlap
    issue — the published CSS var would still need to be consumed.

    Refactor: `runOverlapCheck()` extracted into `findOverlapVictim(rect)`
    + `logOverlapWarning(el)` to keep methods under the 30-line CODING_STYLE
    limit; new `⚓ NavRailOverlapCheck` anchor for the section.

    Rejected alternatives:
    - Switch NavRail to flow/inline layout (no `position: fixed`): breaks
      the Slack / VS Code / activity-bar pattern and the Sidebar-coexistence
      contract (Sidebar already honours `--navrail-*-width` via SidebarManager).
    - Make the rail resizable: see above — wrong surface for that.
    - Walk the DOM looking for elements that consume the CSS var: there is
      no DOM API to ask "does this style use that variable?". The
      `elementFromPoint` probe is a heuristic, but a high-signal one.
    - Always-on warning regardless of `contained`: contained NavRails are
      explicitly nested inside a `DockLayout` panel and *cannot* overlap.
  files:
    - "agentknowledge/decisions.yaml"
    - "components/navrail/navrail.ts"
    - "components/navrail/navrail.scss"
    - "components/navrail/README.md"

- id: "ADR-132"
  title: "DynamicFormSwitcher: variant-form switcher primitive with inline field renderer"
  date: "2026-05-13"
  status: "Accepted"
  context: |
    The Integrations Install/Configure flow needs an Auth Method choice that
    drives a different field set per method (API Key, Basic, OAuth2 CC,
    OAuth2 Auth Code, Bearer, AWS SigV4, GCP Service Account, mTLS, HMAC,
    None). Today it uses a JSON CodeEditor as a stopgap. A specialised
    `createAuthConfigForm` was considered and rejected (catalog isn't closed;
    auth shapes are vendor-specific; the pattern recurs across webhook event
    types, sync filters, notification channels, JSON schema editors).

    The chosen design ships a *generic* primitive — DynamicFormSwitcher — that
    holds N variants (each a field schema) and shows exactly one at a time,
    retaining per-variant values across switches. The calling app owns the
    variant definitions; the CDN never gains a closed catalog.

    Field-renderer reuse: spec §5.4 invited us to reuse FormDialog's internal
    field-renderer module. IIFE wrapping (scripts/wrap-iife.sh) strips
    cross-module imports, so reuse via `import` is not possible. Three options
    were considered:
      (a) Reimplement the field renderer inline in DynamicFormSwitcher.
      (b) Refactor FormDialog to expose a `window.__formdialog.createFieldGroup`
          helper that both components call.
      (c) Add an "inline/headless" mode to FormDialog and embed it.

    (a) was chosen. (b) destabilises a 1938-line, widely-used component;
    (c) inverts the dependency unhelpfully. Reimplementation cost was bounded
    (~400 LOC) and matches the established pattern for cross-component reuse
    (FileExplorer, PromptTemplateManager).

    Field-type set: spec demanded the *full* set of types
    (text/email/password/url/number/textarea/select/multiselect/radio/
     checkbox/toggle/date/datetime/time/file/color/code/richtext/custom),
    but FormDialog itself only supports a subset today (text/email/password/
    number/select/textarea/readonly/hidden/checkbox/toggle/date/custom).
    We shipped the full set in DynamicFormSwitcher and recorded ADR-133 to
    track extending FormDialog to match. Until that follow-up lands, the two
    components diverge on field-type coverage.

    Value extraction: native-typed at read time (no String→Number coercion).
    Empty number input → null; checkbox → boolean; multi-select → string[];
    file → File[]; code/richtext → string. getValues() returns
    Record<string, unknown> because the map is heterogeneous, but each
    individual value is already at its correct native type.

    State retention: keyed by (variantId, fieldName). Same-name fields across
    variants are stored independently — a user's base URL for one auth scheme
    is rarely identical to another (§5.1 invariant).

    Selector styles: dropdown / segmented / tabs. `showSelector` defaults to
    false because the dominant use case is FormDialog embedding where the
    host owns the auth-method select. resetAll() added in v1 (originally a
    follow-up in §15 of the spec — adopted now to avoid asymmetric API).

    CodeEditor/RichTextInput/ColorPicker are not linked at construction
    (IIFE wrap blocks imports). Those types render as native fallbacks
    (monospace textarea, contenteditable div, native colour input).
    Callers needing the rich surface embed via `type: "custom"`.
  files:
    - "components/dynamicformswitcher/dynamicformswitcher.ts"
    - "components/dynamicformswitcher/dynamicformswitcher.scss"
    - "components/dynamicformswitcher/dynamicformswitcher.test.ts"
    - "components/dynamicformswitcher/README.md"
    - "components/diagramengine/src/stencils-ui-components.ts"
    - "demo/components/dynamicformswitcher.html"
    - "demo/studio/component-studio.html"
    - "specs/dynamicformswitcher.req.md"

- id: "ADR-133"
  title: "FormDialog field-type expansion (additive subset; multiselect/file deferred)"
  date: "2026-05-13"
  status: "Accepted (Partial)"
  context: |
    Scope: extend FormDialog's `FormFieldType` to share the
    DynamicFormSwitcher vocabulary WITHOUT changing the `getValues()`
    return shape (`Record<string, string>`), which 8 internal callers
    depend on.

    Added (string-valued — fit the existing contract):
      - `url`      → string (with URL validation when non-empty)
      - `datetime` → string (ISO datetime-local)
      - `time`     → string (HH:MM)
      - `color`    → string (hex)
      - `radio`    → string (selected option value)
      - `code`     → string (monospace textarea)
      - `richtext` → string (innerHTML; rendered as contenteditable + hidden
                              mirror so the existing `getValue` path reads
                              from `mirror.value`)

    Deferred — require a breaking change to `getValues(): Record<string, string>`:
      - `multiselect` → `string[]`
      - `file`        → `File[]`

    Until the deferred follow-up lands, callers needing `multiselect` or
    `file` from inside FormDialog must use `type: "custom"` with
    `customElement`, or reach for DynamicFormSwitcher (which returns
    `Record<string, unknown>` and supports both natively).

    The renderer logic is duplicated across the two components by design —
    IIFE wrapping (scripts/wrap-iife.sh) blocks cross-module imports.
    Tests in both files cover the overlapping vocabulary so they stay in
    lockstep; a future refactor may unify via a shared internal module if
    the divergence becomes painful.
  files:
    - "components/formdialog/formdialog.ts"
    - "components/formdialog/formdialog.scss"
    - "components/formdialog/formdialog.test.ts"

- id: "ADR-134"
  title: "Form-field-capable Components Convention (DynamicFormSwitcher auto-discovery + registry)"
  date: "2026-05-13"
  status: "Accepted"
  context: |
    DynamicFormSwitcher (ADR-132/-133) needs to host any value-bearing
    component in the library — not just native HTML inputs. The naive
    answer (curated adapter pack) was rejected because it caps the field
    vocabulary at whatever the UI team ships. The chosen answer is a
    *convention* every field-capable component honours, plus a single
    auto-discovery path in DynamicFormSwitcher that resolves any
    conforming `window.create<PascalCase>` factory at render time.

    ## Convention
    A value-bearing component MUST expose:
      - factory  `window.create<PascalCase>(container, options) => Handle`
      - handle   `getValue(): unknown`
      - handle   `setValue(value): void` (or document read-only)
      - handle   `destroy(): void` (idempotent)
      - options  `value?: unknown` (initial seed)
      - options  `onChange?: (v: unknown) => void` (fires on every change)

    Domain-named methods (e.g. PeoplePicker.getSelected) and domain-named
    options (LatexEditor.expression, TimezonePicker.timezone,
    VisualTableEditor.data) MAY coexist with the convention names — the
    convention names are aliases. Initialisation prefers the domain name
    when both are set.

    ## Auto-discovery resolution (in DynamicFormSwitcher)
    `field.type` resolves to a factory in this order:
      1. `create<PascalCase(type)>` — handles kebab/snake-case (canonical).
      2. `create<typename[0].toUpperCase() + slice>` — handles camelCase.
      3. Window scan for `create*` globals where the suffix lowercases to
         the type — handles single-token lowercase types.
      4. Registry (`registerDynamicFormFieldProvider`) overrides 1–3.
      5. Literate error in-place if none match.

    ## Audit of the existing fleet (2026-05-13)
    Conforming (26):  anglepicker, codeeditor, colorpicker, columnspicker,
                      cronpicker, datepicker, durationpicker,
                      editablecombobox, fontdropdown, gradientpicker,
                      layoutpicker, lineendingpicker, lineshapepicker,
                      linetypepicker, linewidthpicker, marginspicker,
                      markdowneditor, orientationpicker, periodpicker,
                      richtextinput, sizespicker, spacingpicker,
                      sprintpicker (post-retrofit), timepicker,
                      timezonepicker (post-retrofit), toolcolorpicker.

    Retrofitted (7):
      - latexeditor       — added setValue; value option aliases expression.
      - symbolpicker      — added setValue; onChange option fires on selection.
      - sprintpicker      — added value option; init applies via setValue.
      - timezonepicker    — value option aliases timezone.
      - peoplepicker      — getValue/setValue aliases getSelected/setSelected;
                            value option aliases selected.
      - multiselectcombo  — getValue/setValue aliases getSelectedValues/
                            setSelected; value option aliases selected.
      - visualtableeditor — getValue/setValue aliases getData/setData;
                            value option aliases data.

    Excluded — out of scope by design (2):
      - explorerpicker — resource-selection navigation panel with onSelect;
                         use registerDynamicFormFieldProvider to surface
                         a field-shaped wrapper if needed.
      - smarttextinput — has multiple content shapes (plain / serialized /
                         cursor-context); the right "value" is consumer-
                         specific. Use the registry.

    Out-of-scope class taxonomy:
      - Layout containers       (SplitLayout, AnchorLayout, StackLayout,
                                 CardLayout, BorderLayout, DockLayout)
      - Dialog / overlay        (FormDialog, ConfirmDialog, ErrorDialog)
      - Navigation / chrome     (Sidebar, Toolbar, NavRail, StatusBar,
                                 Breadcrumb, AppLauncher, UserMenu)
      - Selection panels        (ExplorerPicker)
      - Multi-shape AI inputs   (SmartTextInput)
      - Diagram / chart         (DiagramEngine, ChartPanel, GraphCanvas)

    ## Mechanism additions
    DynamicFormSwitcher gained:
      - `field.mount: (host, fieldName) => DynamicFormFieldAdapter` — one-off
        escape hatch for `type: "custom"`. Caller returns a full adapter;
        DFS owns lifecycle.
      - `field.componentOptions?: Record<string, unknown>` — verbatim
        forwarded to the auto-discovered factory or the provider.
      - `registerDynamicFormFieldProvider(typeName, factory)` /
        `unregisterDynamicFormFieldProvider(typeName)` — module-level
        registry exposed on the factory and on window.
      - `tearDownActiveAdapters()` called before re-render and on destroy,
        so embedded components release listeners cleanly.
      - Literate error rendering in `.dynamicformswitcher-component-missing`
        when no factory and no provider matched.

    ## AGENTS.md
    A CRITICAL section "Form-field-capable Components — DynamicFormSwitcher
    Convention" added immediately after the stencil/Component-Studio
    requirements. Includes the checklist that every new field-capable
    component PR must satisfy.
  files:
    - "AGENTS.md"
    - "components/dynamicformswitcher/dynamicformswitcher.ts"
    - "components/dynamicformswitcher/dynamicformswitcher.scss"
    - "components/dynamicformswitcher/dynamicformswitcher.test.ts"
    - "components/dynamicformswitcher/README.md"
    - "components/latexeditor/latexeditor.ts"
    - "components/symbolpicker/symbolpicker.ts"
    - "components/sprintpicker/sprintpicker.ts"
    - "components/timezonepicker/timezonepicker.ts"
    - "components/peoplepicker/peoplepicker.ts"
    - "components/multiselectcombo/multiselectcombo.ts"
    - "components/visualtableeditor/visualtableeditor.ts"

- id: "ADR-135"
  title: "FormDialog wizard value cache for cross-step state persistence"
  date: "2026-05-15"
  status: "Accepted"
  context: |
    The apps team reported that `type: "toggle"` fields silently lose state
    when the user navigates forward in a FormDialog wizard and returns —
    `getValues()` from a later step returned the declared `field.checked`
    default instead of the user's input, and re-entering the step rendered
    the toggle unchecked. Investigation revealed the defect was broader
    than toggle: FormDialog had no value cache. `switchStepImmediate` and
    `switchStepAnimated` both ran `fieldMap.clear()` and `renderFormContent()`
    on every step transition, destroying the live DOM and rebuilding from
    `field.value` / `field.checked` declarations. Every field type was
    affected; toggle was the most visible because its declared default is
    usually `false` and the discrepancy is obvious on a review step.

    The apps team's previous workaround (a closure-backed custom element)
    was explicitly removed before filing the bug, so the regression was
    observable in production.

  decision: |
    Introduce a value cache that is the source of truth across step
    transitions. Field declarations only seed the cache; the cache drives
    every subsequent render.

    Implementation in `components/formdialog/formdialog.ts`:

    1. **`valueCache: Map<string, string>`** — class field holding the
       per-name string snapshot (preserves the existing
       `getValues(): Record<string, string>` contract; no value-shape
       change).

    2. **Construction-time seeding** —
       `seedValueCacheFromDeclarations()` walks every declared field across
       every step (or `options.fields` for single-page mode) and seeds the
       cache. Checkbox/toggle always seed with `"true"`/`"false"` so the
       boolean state is unambiguous from any vantage point. Non-boolean
       fields only seed when a real declared value exists; an empty seed
       would force `el.value = ""` via `applyCachedValue` and clobber the
       browser's natural `<select>` first-option fallback.

    3. **Live → cache snapshot before clear** —
       `snapshotLiveValuesToCache()` runs at the top of
       `switchStepImmediate` and just before the animation begins in
       `switchStepAnimated`. It iterates `fieldMap` and writes
       `getValue(name)` to the cache. Snapshotting before the animation
       (not in the post-animation `setTimeout`) protects against a destroy
       mid-flight (user closes the dialog before TRANSITION_DURATION
       elapses).

    4. **Cache → DOM restore on rebuild** —
       `applyCachedValue(name, el)` runs in `buildFieldGroup` and
       `buildHiddenField` immediately after `fieldMap.set`. It writes
       through the existing `writeFieldElementValue` helper, which handles
       every field type uniformly (text, select, textarea, checkbox/toggle,
       radio group, richtext mirror).

    5. **Continuous cache update on input** — `onFieldInput` writes the
       current value to the cache on every user change, so even
       programmatic value mutations through `setValue` (which calls
       `onFieldInput`) keep the cache fresh.

    6. **`setValue` writes cache unconditionally** — `setValue(name, value)`
       always updates the cache, even if the target field is not currently
       mounted. The next rebuild of the target step will pick it up via
       `applyCachedValue`.

    7. **`getValue` falls back to cache** — when the field is not in
       `fieldMap` (i.e. lives on an inactive step), `getValue` returns
       `valueCache.get(name) ?? ""`.

    8. **`getValues` merges cache + live** — cached values are written
       first (so inactive-step fields are present), then live `fieldMap`
       entries overlay anything currently mounted.

    Public API surface unchanged. Apps that wrote workarounds for the
    pre-fix behaviour can remove them.

  consequences: |
    + Every field type now round-trips state across wizard step navigation.
    + `getValues()` returns a complete, step-agnostic snapshot from any
      step — review steps no longer need a custom collation pass.
    + `setValue()` works for fields on any step, including unmounted ones.
    + 7 regression tests in `FormDialog wizard state persistence` (toggle,
      checkbox, radio, text, textarea, cross-step `setValue`, declared-
      defaults visibility) lock the behaviour in place.
    + Existing 38 FormDialog tests pass unchanged.
    + Repo-wide 4094/4094 tests across 123 files; tsc clean.
    - Memory footprint grows by one `Map<string, string>` per dialog
      instance (negligible — names are short, values are bounded by user
      input).
    - `seedValueCacheFromDeclarations` runs in the constructor, before
      `show()`, so consumer mutations to the declarations after
      construction are NOT reflected. This matches existing FormDialog
      semantics: option objects are not deeply observed.

  files:
    - "components/formdialog/formdialog.ts"
    - "components/formdialog/formdialog.test.ts"
    - "components/formdialog/README.md"
    - "CHANGELOG.md"

- id: "ADR-136"
  title: "Public consumer contract — apps-team usage guide + rename policy"
  date: "2026-05-15"
  status: "Accepted"
  context: |
    The apps team reported three silent CDN API renames in eight weeks:
    Breadcrumb `segments`→`items`, SymbolPicker `onChange` semantics shifted
    (added `onInsert`), MultiselectCombo factory-name case flipped. The
    pattern was reliable enough that they treated it as a process problem
    and requested (a) a CI guard against rogue `window.create*` names and
    (b) README-first discipline as a workflow contract.

    Renames had been driven by the form-field-capable convention work
    (ADR-134) which required some component surfaces to align. The
    convention is the right long-term outcome but the short-term churn
    cost the apps team velocity.

  decision: |
    Publish a consumer-facing usage guide and commit to a public rename
    policy.

    1. **`docs/APPS_TEAM_USAGE_GUIDE.md`** — new file, shipped via
       `scripts/copy-docs.sh` to `dist/docs/` (no exclusion). Covers:
       - The three rules (README-first, pin + read CHANGELOG, CI grep guard).
       - Acknowledgement of the three renames with dates and reasons.
       - Slug→factory-name gotchas table for the 10 compound-word
         components where PascalCase boundaries aren't mechanical.
       - CI guard recipe (bash + ESLint) with an allowlist alternation
         pattern.
       - The stable form-field-capable surface (createXxx, `value`,
         `onChange`, `getValue`, `setValue`, `destroy`) that is locked by
         ADR-134 and will not be renamed.

    2. **Rename policy commitments** —
       - Public-API renames ship a runtime `[ComponentName] DEPRECATED:
         'oldKey' renamed to 'newKey'` warning under the old name for at
         least one minor cycle before the old name is removed.
       - Every rename gets a CHANGELOG entry under a `### BREAKING`
         heading with the before/after symbol and the cycle.
       - Every README's Quick Start block carries the canonical factory
         name at the top. If a stale CDN cache returns an outdated
         README, the canonical source is the per-component README under
         `static.knobby.io/docs/components/<slug>/README.md`.

    3. **Form-field-capable surface is contractual** — the symbols
       `createXxx`, `options.value`, `options.onChange`, `handle.getValue`,
       `handle.setValue`, `handle.destroy` are off-limits for rename
       across the entire convention surface. Renaming any of them would
       break the auto-discovery contract, so the convention itself locks
       them in place.

  consequences: |
    + Apps teams have a single, citable workflow document.
    + The CI guard recipe is copy-paste deployable and gives them PR-time
      protection against silent regressions.
    + The public rename policy bounds future churn and makes migration
      windows explicit.
    + The convention surface is now contractually stable; future
      field-capable retrofits will add aliases rather than replace names.
    - The repo accepts an ongoing maintenance cost: deprecation warnings
      and BREAKING CHANGELOG markers must be authored carefully on every
      rename.

  files:
    - "docs/APPS_TEAM_USAGE_GUIDE.md"
    - "CHANGELOG.md"

- id: "ADR-137"
  title: "ThemeInit: CDN pre-paint theme script for cross-subdomain parity"
  date: "2026-07-11"
  status: "Accepted"
  context: |
    The IDP team's spec (specs/keycloak-theme-parity-requirements.md, R2/R3)
    requires Keycloak pages on auth.knobby.io to render in the user's chosen
    theme with no flash of the wrong mode. The app's preference lives in
    localStorage on prod.knobby.io (invisible cross-origin) plus a
    `knobby-theme` cookie on Domain=.knobby.io written by the apps repo's
    ThemeManager (R1 — verified already implemented). The app's own
    pre-paint script (admin-theme.js) is app-local and localStorage-only,
    so a shared, cookie-aware reader was needed on the CDN.

  decision: |
    New `components/themeinit/themeinit.ts`, published at the canonical URL
    `/js/theme-init.js` (copy in package.json copy:js) alongside the
    standard component path. Placed under components/ purely to reuse the
    tsc -> wrap-iife -> terser pipeline and co-located vitest; it is NOT a
    UI component (no factory, no CSS, no stencil — exempt from the stencil
    and Component Studio conventions).

    Behavior: resolution order cookie -> localStorage['knobby-theme'] ->
    prefers-color-scheme -> 'light'; values strictly validated against the
    light|dark|auto literals (R3.2 — a tampered cookie can never reach
    setAttribute); sets data-bs-theme on <html> synchronously (blocking
    <head> script, no inline JS, CSP-safe); when the mode is 'auto' OR no
    preference exists, attaches a matchMedia('(prefers-color-scheme:dark)')
    change listener so acceptance criterion #3 (live OS-toggle tracking)
    passes — this listener requirement is implied by the spec's AC but
    absent from R2's text, flagged back to the IDP team. Injectable
    ThemeInitEnvironment keeps the module pure for tests; the shipped IIFE
    leaks nothing onto window. ~1.2 KB minified.

  consequences: |
    + One implementation serves app pages and Keycloak FreeMarker templates.
    + Fresh-browser default follows the OS (spec AC#4). NOTE: when the apps
      team converges admin-theme.js onto this script (R2.6), their fresh-
      user default changes from always-light to follow-OS — flagged in the
      handoff notes.
    + No THEME_CHANGED postMessage bridge — shell/iframe live-sync remains
      ThemeManager's job (setupSubAppTheme).
    - Two URLs serve the same bytes (/js/theme-init.js and
      /components/themeinit/themeinit.js); the js/ path is canonical.

  files:
    - "components/themeinit/themeinit.ts"
    - "components/themeinit/themeinit.test.ts"
    - "components/themeinit/README.md"
    - "package.json"

- id: "ADR-138"
  title: "AuthCard: frozen Keycloak-parity contract for the login surface"
  date: "2026-07-11"
  status: "Accepted"
  context: |
    Parity spec R5: the login card's look (auth-card, idp-button, divider,
    brand-logo, auth-step classes) lived only in the apps repo's
    frontend/static/app.css, unreachable from auth.knobby.io. The spec
    offered R5.a (promote to CDN — preferred) or R5.b (freeze + vendor).
    User chose R5.a as a component PLUS a JS factory.

  decision: |
    New components/authcard/: authcard.scss is a VERBATIM port of the
    app.css auth rules (class names unchanged — they are the contract the
    IDP team's FreeMarker templates mirror; all colors already use runtime
    --bs-* tokens so dark mode is automatic). createAuthCard(containerOrId,
    options) renders the canonical Appendix-A markup for app pages; server-
    rendered consumers (Keycloak) link ONLY the CSS and emit the markup
    themselves because login must work without JavaScript. The unit tests'
    "canonical structure" describe-block is the CI drift guard: any change
    to the frozen class structure fails the build before it silently breaks
    the FreeMarker mirror. Renames/restructures are breaking changes
    governed by CDN_CONTRACT.md §4 (ADR-139). Explicitly excluded from the
    DynamicFormSwitcher field convention (ADR-134): a workflow surface like
    FormDialog, not a value-bearing field. Security: all option strings
    render via textContent; iconSvg is the sole trusted-markup input,
    guarded to a single well-formed <svg> root and documented as app-
    authored-literals-only.

  consequences: |
    + One source of truth for both logins; the apps team can drop the
      duplicated rules from app.css once they adopt the CDN asset.
    + Frozen generic class names (.divider, .brand-logo) now live on the
      shared CDN — collision risk for consumers accepted and documented,
      since parity requires the exact names.
    - The stencil count tests in diagramengine-embed.test.ts track the
      ui-components pack size and were bumped 111 -> 112.

  files:
    - "components/authcard/authcard.scss"
    - "components/authcard/authcard.ts"
    - "components/authcard/authcard.test.ts"
    - "components/authcard/README.md"
    - "components/diagramengine/src/stencils-ui-components.ts"
    - "demo/components/authcard.html"
    - "demo/studio/component-studio.html"

- id: "ADR-139"
  title: "CDN consumption contract: latest + additive-only, no hard pinning"
  date: "2026-07-11"
  status: "Accepted"
  context: |
    Parity spec R4.2/R4.3 requires an explicit versioning/pinning story so
    the Keycloak image is not broken by CDN advances, plus cache headers.
    The CDN was bare Cloudflare Workers static assets with no _headers and
    no versioned paths. User's steering question: what survives theme
    evolution WITHOUT requiring IdP redeploys? Hard pinning and SRI both
    fail that test — every theme release would require an image rebuild,
    and an SRI mismatch bricks the login page on any byte change.

  decision: |
    "Latest + contract" (CDN_CONTRACT.md): consumers link unversioned URLs;
    safety comes from (1) an additive-only guarantee on the parity asset
    set (custom.css tokens, theme-init behavior, authcard classes, the
    knobby-theme cookie) enforced by CI drift-guard tests, (2) cdn/_headers
    copied to dist at build — DISJOINT patterns because Cloudflare appends
    headers from every matching rule: icons/fonts immutable+ACAO*, vendor
    1d+SWR, css/js/components 300s+SWR 1d, build.json no-cache, and (3)
    trust anchored in the Cloudflare account (same trust the app already
    places in the CDN; Keycloak's CSP allowlists only static.knobby.io, so
    the login page adds no new attack surface). Escape hatch: publish a
    /v<major>/ snapshot tree of the previous contract only if a breaking
    change is ever unavoidable, with IDP-team notification before deploy.
    build.json (no-cache) is the deploy-introspection endpoint.

  consequences: |
    + Theme evolves freely; auth.knobby.io picks up fixes within ~5 min.
    + Breaking changes now have a written protocol (ADR + notify + snapshot).
    - Integrity depends on Cloudflare account hygiene rather than consumer-
      side pinning — documented and accepted.

  files:
    - "cdn/_headers"
    - "CDN_CONTRACT.md"
    - "package.json"

- id: "ADR-140"
  title: "Dynamic UI layer boundary — runtime ships the contract, the app ships the intelligence"
  date: "2026-08-03"
  status: "Accepted"
  context: |
    A dynamic UI assembles components on demand from natural-language intent,
    wires them together, and persists as a restorable scene. The question that
    determines everything else is where to cut the layer: this repository is an
    open-source component library published to a CDN, not an application. If
    LLM calls, storage, or authorisation leaked into it, the layer would be
    untestable and unusable by anyone whose stack differs.
  decision: |
    This repository ships FIVE artifacts and nothing else: (1) the CanvasDocument
    schema and validator, (2) the capability manifest format plus defaults for
    every component, (3) the DynamicCanvas host runtime, (4) the declarative
    wiring engine, (5) host adapter INTERFACES. Everything intelligent enters
    through a callback the host supplies — the DynamicUIHost interface is six
    functions (onResolve, onFetch, onPersist, onLoad, actionDispatcher,
    capabilitiesProvider). Structurally enforced: runtime/ is headless with no
    DOM, components/ renders. "If it renders, it is a component; if it decides,
    it is runtime" — the same headless-engine split blessed for DiagramEngine
    in ADR-082.
  consequences: |
    + The whole layer is unit-testable without a browser, a model, or a server.
    + Any consuming app can adopt it; nothing assumes knobby.io's stack.
    + The demo implements the host interface with a lookup table, so it doubles
      as the reference integration and proves the boundary holds.
    - Consumers must implement six functions before seeing anything work. The
      demo host exists specifically to make that a copy-paste starting point.
  files:
    - "specs/dynamicui.prd.md"
    - "specs/dynamicui.plan.md"
    - "runtime/src/types.ts"

- id: "ADR-141"
  title: "Surface contract — widening ADR-134's exclusion table for canvas-mounted components"
  date: "2026-08-03"
  status: "Accepted"
  context: |
    ADR-134 defines the field contract (getValue/setValue/destroy plus value and
    onChange options) and explicitly excludes DataGrid, TreeView, ChartPanel,
    DiagramEngine, layout containers, and navigation chrome as "out of scope by
    design". Those exclusions are precisely the components a dynamic canvas must
    mount, feed, and snapshot. An audit found the fleet is mountable but not
    wirable: 113 of 118 components expose destroy(), but only 3 expose a runtime
    subscribe API, ~14 a setData-style injector, and ~15 getState/setState.
    Components hand out callbacks at construction, which cannot be rebound.
  decision: |
    Introduce a second, broader Surface contract — setData / on / getState /
    setState / destroy — that sits BESIDE the field contract rather than
    replacing it, and SUPERSEDES ADR-134's exclusion table for canvas purposes.
    Three conformance levels: display (destroy only), field (ADR-134), surface
    (the full contract). The level is verified by a generic manifest-driven
    conformance suite and NEVER self-declared; a manifest claiming surface while
    failing the suite fails the build. State is defined as "what is needed to
    restore the view", bounded by manifest-declared stateKeys and required to be
    JSON-serialisable. Purely additive: constructor callbacks remain permanent
    public API and become subscriber zero on the new emitter, preserving firing
    order. Only DiagramEngine's on() changes shape (void widened to Unsubscribe);
    SmartTextInput is already canonical and GraphMinimap's on() is a declaration
    describing a consumed dependency, not its own handle.
  consequences: |
    + The canvas can mount, feed, rewire, virtualize, and restore any component.
    + A legacy-surface assertion in the conformance suite makes the additive
      guarantee verifiable on every component rather than merely asserted.
    - ADR-134's conformance list needs a follow-up entry recording the widening.
    - 118 components need manifests and a retrofit; sequenced so the structural
      gate exempts un-migrated components and the exemption list shrinks to zero.
  files:
    - "specs/dynamicui.prd.md"
    - "runtime/src/types.ts"
    - "runtime/src/registry.ts"

- id: "ADR-142"
  title: "Capability manifests colocated per component, aggregated at build time"
  date: "2026-08-03"
  status: "Accepted"
  context: |
    The canvas needs semantic metadata per component — what it can render, what
    it emits, what it accepts, what actions it offers, what it weighs. That
    metadata could live centrally (one registry file) or beside each component.
    The repository's own churn data settles it: the top-churn files are all
    central aggregation points — history.jsonl (156 changes), COMPONENT_REFERENCE
    (109), concepts.yaml (106), COMPONENT_INDEX (46). A central manifest would
    join that list and serialise every parallel contributor.
  decision: |
    Each component folder carries its own <name>.manifest.ts. A build step walks
    components/*/, validates each manifest, fills weight.js from the compiled
    bundle size, and emits dist/capability-manifest.json plus a window global.
    A structural test asserts every component directory has a valid manifest, so
    a component that is not canvas-capable physically cannot land. Per-component
    README capability tables are GENERATED from the manifest, so documentation
    cannot drift from behaviour.
  consequences: |
    + Distributed authorship; no merge-conflict hotspot; the obligation is
      visible at review time because the folder has an empty slot.
    + Docs generated from the same source that drives the runtime.
    - Adds a build step and a required file to every component folder.
  files:
    - "specs/dynamicui.prd.md"
    - "runtime/src/registry.ts"

- id: "ADR-143"
  title: "Allowlist-only factory resolution for model-authored documents"
  date: "2026-08-03"
  status: "Accepted"
  context: |
    ADR-134's resolveFactoryName() falls back to scanning the window object for
    a factory whose name resembles a requested field type. That is acceptable
    for a form definition written by a developer. It is NOT acceptable for a
    scene document authored by a language model, where the component name is
    untrusted input and a window scan turns it into arbitrary global invocation.
  decision: |
    (CRITICAL) The canvas resolves components allowlist-only, against the
    registered capability manifests. lookupFactory() reads EXACTLY ONE property
    off the supplied scope — the factory named by a registered manifest — and
    never enumerates or searches the scope. An unregistered component yields a
    literate error naming the component and the registration call; it never
    triggers a lookup, however closely the name resembles a real global. Tests
    assert both that a plausible-but-unregistered global is unreachable and that
    near-miss names are not searched. Related hardening in the same layer:
    transforms are registry-named rather than inline expressions, so a document
    can carry no executable code; fanout is capped by FANOUT_CEILING so a
    document cannot mount unbounded components; and cycles are rejected at
    validation rather than looping at runtime.
  consequences: |
    + A malicious or hallucinated component name cannot reach any global.
    + Scene documents carry data only — no code, no markup, no expressions.
    - Every mountable component must be explicitly registered. This is the point.
  files:
    - "runtime/src/registry.ts"
    - "runtime/src/wiring.ts"
    - "specs/dynamicui.prd.md"

- id: "ADR-144"
  title: "Factory argument order recorded as manifest data, not enforced as a convention"
  date: "2026-08-03"
  status: "Accepted"
  context: |
    ADR-134 declares `create<PascalCase>(containerId, options)` the canonical
    factory signature and states that auto-discovery passes the id-string form.
    Building the Dynamic UI mount path required calling all 118 component
    factories generically, which forced an audit of what the fleet actually
    does. The result contradicts the ADR:

      35  container-first  create(containerId, options)   -- the ADR's form
      27  options-first    create(options, containerId)
      45  options-only     create(options) with options.container as an ELEMENT
       7  non-standard     union first params, or no create* export at all
       4  no factory       services, boot scripts, element builders

    So the canonical form is a minority at roughly 30%. Three ways forward:
    (a) migrate 72 components onto the canonical signature, (b) write per
    component adapter glue, (c) record the convention as data.
  decision: |
    Option (c). `CapabilityManifest` gains `factoryStyle`
    ("container-first" | "options-first" | "options-only") and, for the
    options-only case, `containerOption` naming the option key that carries the
    host element. The conformance runner and the canvas mount path honour all
    three. Option (a) is rejected outright: renaming or re-signaturing 72
    public factories would break every existing consumer, which the Dynamic UI
    layer is forbidden from doing (ADR-139, ADR-141). Option (b) was rejected
    because 72 near-identical glue files is noise that hides the handful of
    components with genuinely unusual needs.

    ADR-134's stated convention is NOT withdrawn — it remains the form NEW
    components should use, and AGENTS.md now says so explicitly while dropping
    the implication that the fleet already follows it. Existing components are
    not migrated.
  consequences: |
    + The canvas can mount any component regardless of its historical shape.
    + Zero changes to existing public signatures; the additive guarantee holds.
    + The audit numbers are now recorded, so nobody re-derives them.
    - Three call conventions must be supported forever, in the conformance
      runner and the canvas mount path. The cost is two branches in one
      function, paid once.
    - A wrong factoryStyle produces a mount failure rather than a type error.
      The conformance gate catches it on the component's first run.
  files:
    - "runtime/src/types.ts"
    - "runtime/src/registry.ts"
    - "runtime/src/conformance.ts"
    - "AGENTS.md"

- id: "ADR-145"
  title: "Overlay presentation and the annotation interaction model"
  date: "2026-08-07"
  status: "Accepted"
  context: |
    Annotations shipped as ordinary canvas nodes: the packer gave each one a
    slot, so annotating a grid PUSHED the grid aside — a mark that displaces
    what it marks. Browser testing then surfaced three further faults that all
    trace to the same mistake of treating an overlay like a widget. Expanding
    swapped the pin for a card, pulling the element out from under the pointer,
    firing pointerleave, collapsing, and re-expanding — a self-sustaining
    flicker. The card drew a tail pointing down while opening to the right, so
    the tail pointed at nothing. And the label was read-only, leaving no way to
    edit a note the reader had just placed.
  decision: |
    A capability manifest declares `presentation: "framed" | "overlay"`.
    An overlay is positioned relative to its anchor's rect, lifted in z, and
    excluded from the packer's occupancy — it can never move what it overlays,
    and the canvas gives it no frame furniture (no titlebar, no chrome).

    For annotations specifically: the pin is PERMANENT and is the pointer's
    only target; the card opens beside it and is built once, hidden by class
    rather than rebuilt, so nothing under the pointer is ever replaced. The
    card is a plain box — the pin already carries the anchoring meaning a tail
    was drawing, and a tail that points somewhere the card does not open is a
    false claim. The expanded card is a `<textarea>`, not `contenteditable`:
    a paste into contenteditable inserts MARKUP, which would breach this
    library's textContent-only discipline (CODING_STYLE.md). Edits update the
    label in place with no repaint, so the caret survives a keystroke.

    An anchor may carry an optional fractional `spot: {x, y}` naming a place
    WITHIN the target rather than its corner, plus `within` naming which
    scrolling region the fraction is measured against.

    AMENDED 2026-08-09. This ADR first placed the GESTURE that sets `spot`
    outside the library, on ADR-140's boundary. That reading was wrong and the
    owner corrected it: an application must not have to do extra work to use a
    component. Recording where a click landed is coordinate translation, and
    every consuming app would re-derive the same zoom, scroll and pan
    arithmetic to do it. Persisting the resulting document is the app's job;
    producing it is not.

    So DynamicCanvas ships the gesture: startPlacement() arms the canvas, the
    user's next click resolves to a target and a spot, and the result is
    emitted as an ordinary patch. Capture and restore are written adjacent as
    explicit inverses — capture starts from client coordinates and divides out
    zoom, restore works in layout pixels — because housed apart they drift, and
    a drifted pair puts the mark somewhere plausible rather than throwing.

    `spot` is a fraction of the target's scrollable CONTENT, not of its visible
    box, so a mark holds its place through scrolling and resizing. The packer
    places it geometrically as a headless fallback; the canvas refines it
    against the live DOM afterwards, and that refinement is what a browser
    measures.
  consequences: |
    + An annotation can never rearrange the canvas; e2e asserts the bounding
      box of an annotated node is unchanged after six annotations.
    + Any future overlay-shaped component gets the same treatment by declaring
      one manifest field, with no canvas changes.
    + The flicker class of bug is structurally excluded: the hover target is
      never rebuilt.
    - The label is no longer page text, so tests must read the editor's value
      rather than getByText. Recorded in the component README.
    + An overlay with fixed coordinates is excluded from the packer's obstacle
      list as well as its occupancy, so a mark dropped on bare canvas no longer
      pushes nearby nodes aside.
    + `spot` and `within` are validated like everything else in a document: a
      NaN fraction from a model-authored scene is rejected rather than placing
      a mark at no coordinates at all.
    - A geometric anchor survives scrolling and resizing but NOT reflow: the
      same fraction covers different text once a document re-wraps at a new
      width. Content anchoring (a text quote, a row id) is what the entity
      anchor is for, and it remains unbuilt.
    - The canvas now carries a modal gesture state. It is one-shot and Escape
      cancels, but it is the first modal thing the canvas has.
  files:
    - "runtime/src/types.ts"
    - "runtime/src/packer.ts"
    - "components/annotation/annotation.ts"
    - "components/annotation/annotation.scss"
    - "components/dynamiccanvas/dynamiccanvas.ts"

- id: "ADR-146"
  title: "MarketingHero and SiteFooter — CSS is the contract, the factory earns the surfaces"
  date: "2026-09-01"
  status: "Accepted"
  context: |
    The Outcrop Inc website asked for two components Bootstrap does not
    provide: a hero for public pages and a semantic site footer. The request
    specified CSS-first components requiring no JavaScript, which is the right
    shape for a marketing page — copy belongs in HTML where it can be edited
    and crawled, not inside a script.

    Taken literally that meant two folders with no TypeScript in them, and the
    library has no such thing: every one of the 123 component folders ships a
    `.ts`, and all but a handful expose a `create*` factory — the exceptions
    being services and boot scripts such as ThemeInit, which are in
    NOT_MOUNTABLE for that reason. The cost is
    not stylistic. `runtime/fleet-conformance.test.ts` enumerates every
    directory in `components/`, so a folder with no factory needs a
    NOT_MOUNTABLE entry — a category reserved for services, boot scripts and
    overlays, not for renderable surfaces. Component Studio registers each
    entry by a `factory` name string (demo/studio/component-studio.html), so a
    factoryless component cannot appear there at all, and the Layout Studio
    stencil would have nothing to preview. AGENTS.md requires both surfaces of
    every new component.

    AuthCard had already met this problem from the other direction and settled
    it: "The CSS is the contract; the JS is a convenience." Keycloak's
    FreeMarker templates link only the stylesheet and emit the markup
    themselves, because the login must work with JavaScript disabled.
  decision: |
    Both components ship the AuthCard shape: `<name>.scss` is the deliverable,
    and a thin `create<Name>(containerId, options)` factory renders exactly the
    markup the README documents. A canonical-structure test asserts that
    equality, because the site loads only the CSS and would be where silent
    drift surfaced.

    Five design decisions were settled with the user and are recorded in
    specs/marketinghero-sitefooter.prd.md as D1 through D5:

    D1 — First-class library components under the normal additive contract,
    not a frozen parity contract like AuthCard's and not in the website repo.
    A freeze is warranted when another team mirrors the markup verbatim; the
    website is the first consumer, not the only one.

    D2 — The existing compact enterprise scale, with no new spacing or type
    tokens. A separate public-surface scale would add tokens two components
    use, and the site should look unmistakably like the product.

    D3 — The stylesheet is the contract; the factory is a convenience. The
    factory is not overhead paid for the website — it is what buys the
    stencil, the studio entry, and a passing conformance gate.

    D4 — MarketingHero's eyebrow follows the heading in the DOM and is lifted
    above it with `order: -1`. The request asks both for an eyebrow and for
    the heading to stay first in document order. Nothing in that block is
    focusable, so displaced visual order carries no keyboard hazard; nesting
    the eyebrow inside the heading would pollute its accessible name.

    D5 — SiteFooter's unvisited links use muted text and visited links take
    the accent colour. The user chose this to make the visited state obvious
    while keeping the footer quiet. It inverts the common convention, so it is
    recorded rather than left looking like an accident. Colour is not the only
    signal: hover and focus add an underline.

    Both declare `conformance: "display"` and `factoryStyle: "container-first"`
    — the canonical ADR-134 signature, which new components must use and which
    costs nothing here because there are no existing consumers to break.
  consequences: |
    + A static page links one stylesheet, writes semantic HTML, and loads no
      script. That is what the request actually asked for.
    + Both components stay first-class citizens of the library rather than
      exceptions to it: stencil, studio entry, manifest, conformance gate.
    + The canonical-structure test makes "the CSS and the factory agree" an
      executable claim rather than a stated intention, as it did for AuthCard.
    + Neither component carries a dark-mode rule. The `--theme-*` tokens are
      already redefined under the dark selector, so `data-bs-theme` switching
      works by architecture rather than duplication.
    - Roughly 150 lines of TypeScript per component that the primary consumer
      will never call. Accepted as the price of the discovery surfaces.
    - The footer's visited-link colouring will read as wrong to anyone who
      meets it without this record. Hence D5 is written down twice, here and
      in the spec.
    - Contrast is verified by eye. There is no automated gate in this
      repository, and this work does not add one — see DEBT-WEB-1.
      SUPERSEDED 2026-10-09 (ADR-158) — checks [12], [13] and [15] were built
      by the ADR-150/-153/-155 arc. Both components use only --theme-* tokens,
      so check [12] now covers the pairs this consequence was about.
  files:
    - "specs/marketinghero-sitefooter.prd.md"
    - "specs/feature_request_website.md"


- id: "ADR-147"
  title: "Visual refresh — tonal surface ladder, state layers, two-layer shadows, small corner radius"
  date: "2026-09-08"
  status: "Accepted; surface values superseded by ADR-150"
  context: |
    Applications built on this library were compared against Material Design 3
    applications and read as dated. Five aspects of MD3 were named as better:
    chrome carrying a different background from content, tabs looking natural,
    subtle shadows, a small corner radius, and slightly more spacing. Adopting
    MD3 itself was explicitly rejected — too round, too airy for a dense
    enterprise library.

    Diagnosis found the flatness had a precise cause rather than a stylistic
    one: --theme-body-bg and --theme-surface-bg both held $gray-50 (#f8fafc).
    They were the SAME COLOUR. The page had no ground, so a sidebar was
    separated from the content beside it by a 1px border and nothing else.

    The library turned out to be unusually disciplined about tokens — 80 uses
    of $border-radius against ~10 hardcoded outliers — so the whole change
    lands in two files rather than across 125 components.

    D1 Radius: 4px base / 2px sm / 6px lg / 8px xl, tiered by role. Chosen by
    the user over a frictionless 2px, which would have stayed inside the
    existing sanctioned exception but been close to imperceptible at 14px text.
    This AMENDS the AGENTS.md rule "rectangular components with 0-2 border
    radius"; the rule was rewritten rather than quietly contradicted.
    $radius-affordance is retained as an alias of $border-radius so its six
    call sites keep working.

    D2 Surfaces: a four-step tonal ladder in both themes. The light-mode
    direction — "raised" is DARKER than "surface" — is long-standing and
    preserved; 140 call sites depend on it, and it inverts in dark mode.

    D3 State layers: --theme-hover-bg and --theme-active-bg were opaque greys,
    which punch a hole in any surface that is not that exact grey. Now
    translucent overlays. This is what makes D2 hold up in practice rather than
    optional polish.

    D4 Shadows: two layers (tight key + wide ambient) at lower alpha instead of
    one wide blur, which read as a smudge under an element rather than the
    element lifting. Values are DUPLICATED as Sass $shadow-* and CSS
    --theme-shadow-*; both are updated and each now carries a note that the
    other exists.

    D5 Tabs: the indicator becomes a 3px pseudo-element inset 6px from the tab
    edges, so it marks the label rather than the whole cell. It also moves from
    a hardcoded $blue-600 to a token — the old value was a light-mode Sass
    colour, so the indicator never responded to dark mode at all.

    D6 Spacing: deliberately the smallest of the five. $spacer drives only
    Bootstrap-level padding; the $sp-* fixed-pixel scale and $control-height-*
    do not follow it, so a global bump moves layouts unevenly and ends less
    coherent than it started. Four targeted values governing reading density in
    list-like surfaces were raised instead.

    D7 Two defects found during diagnosis and fixed here: --theme-primary-rgb
    held Tailwind blues in BOTH themes that do not match $primary, so every
    focus ring and hover glow was tinted a hue the theme does not use; and
    --theme-surface-bg-rgb had drifted from --theme-surface-bg.
  consequences: |
    + The change is auditable and reversible as a token edit. Setting the radius
      tokens to 0 and restoring four surface values returns the old look without
      touching a single component.
    + Chrome, content, ground and insets are now four distinct planes, which is
      the whole of the "flat" complaint.
    + A translucent state layer shades whatever surface it lands on, so one
      token is correct on a white card, a tinted sidebar and a coloured row.
    + The tab indicator responds to dark mode for the first time.
    - Two contrast REGRESSIONS were introduced by this work and caught only by
      measuring every text-on-surface pair in the browser, after a draft of the
      spec had already asserted from reasoning that no ratio was reduced. That
      assertion was wrong. --theme-text-muted on the darker ground fell to
      3.94:1, and D5's tinted active tab label measured 3.91:1 on chrome. Both
      are fixed: muted darkens to #556478, and a new --theme-primary-text token
      (blue-700 light / blue-300 dark) carries primary as TYPE while
      --theme-primary stays the fill colour.
    - Playwright cannot run on this machine (DEBT-WEB-3), so no automated visual
      regression covers this. Appearance is reviewed by eye against
      demo/visual-refresh.html.
    - The hover-glow idiom shifts hue as a side effect of the primary-rgb fix.
      This is a correction, but it is visible and would otherwise look like an
      unexplained change.
  files:
    - "specs/visual-refresh-2026.prd.md"
    - "src/scss/_variables.scss"
    - "src/scss/_dark-mode.scss"
    - "components/tabbedpanel/tabbedpanel.scss"
    - "demo/visual-refresh.html"
    - "AGENTS.md"
  amendment_2026_09_08: |
    Round one was reviewed as "only a slight difference overall", with ribbon
    controls, dropdowns and the Dynamic UI DataGrid reported as still square.
    Both correct. The context above claims the change "lands in two files";
    that described where the tokens LIVE, not where they are CONSUMED, and it
    was optimistic.

    Four causes, all of them consumers that never received the tokens:
    (1) $body-bg still compiled to $gray-50, so Bootstrap painted the page the
    OLD ground while components used the new one, and the dark --bs-* surface
    overrides were pinned to raw greys off the ladder. (2) Bootstrap has its
    OWN $box-shadow scale, never overridden — dropdowns and modals draw from it
    rather than $shadow-*, so the most visible overlays kept the old smudge.
    The "nice" dropdown shadows noted in review were in fact the old style.
    (3) Ribbon pinned 17 call sites to a local $ribbon-ctrl-border-radius: 0,
    and 34 further sites hardcoded border-radius: 0, several with comments
    enforcing the now-dead rule. (4) dynamiccanvas.scss referenced
    var(--theme-border, ...) and var(--theme-surface, ...) — NEITHER TOKEN
    EXISTS, the names are --theme-border-color and --theme-surface-bg — so it
    resolved to its hardcoded fallbacks and never participated in the theme in
    either mode. A custom-property fallback fails silently by design, which is
    why no test and no review ever caught it.

    Fixed by declaring the ladder once as Sass variables and interpolating it
    into the CSS tokens, pointing the Bootstrap variables and shadow scale at
    the same values, and assigning the 51 hardcoded radius sites by role.
    Three stay 0 deliberately and now document why. AuthCard's card was
    var(--bs-body-bg) — the page ground — so it was the same colour as the page
    behind it; it imports no Sass on purpose because Keycloak templates mirror
    its markup, so its radius uses var(--bs-border-radius-lg).

    Verified: --bs-body-bg and --theme-body-bg now agree in both themes (they
    did not before), --bs-box-shadow is two-layer, the ladder is monotonic in
    both directions, and the worst text-on-surface pair measures 5.00 light /
    5.72 dark against a 4.5 floor.

    Open: DEBT-VR-1 — 38 sites use --theme-hover-bg/--theme-active-bg as a
    STATIC background rather than an interaction state. Since D3 made them
    translucent these composite instead of filling; the light-mode result is
    within a hair of the old $gray-200, so nothing looks broken, but it is the
    wrong token for the job. The fix is a --theme-fill-subtle token and 38
    reassignments, deliberately left as its own change.
  amendment_2_2026_09_09: |
    Three further reports. (1) Dark mode had no visible elevation, and raising
    alpha could never have fixed it: measured against the #0d1420 ground a black
    shadow reaches 1.034 contrast at alpha 0.22 and only 1.106 at 0.75, while a
    LIGHT-mode shadow at 0.08 already reaches 1.192. The ground is near-black so
    a darker shadow has nowhere to go. Dark elevation now leads with a hairline
    LIGHT ring, which is what reads as lifted. Two gaps went with it:
    --bs-box-shadow was compiled statically from the light values and never
    redefined in the dark block (the THIRD time this Sass-vs-custom-property
    desync has bitten this work), and --theme-edge-shadow-color, the chrome
    mixins, was black at 0.25 and equally invisible.

    (2) Radius by omission. Round two swept the 51 sites that SET
    border-radius: 0; the larger group was 71 components that never declare a
    radius AT ALL and so render square whatever the token says. The reported
    symptom, a sharp LineWidthPicker beside a rounded CronPicker on one ribbon,
    is precisely the split between hand-rolled DOM and components built on
    Bootstrap primitives, which inherited the refresh for free. 163 rules across
    46 components assigned by role; layouts, full-bleed bars, text renderers,
    drag handles and edge-docked roots deliberately excluded, with the exclusion
    list written into the spec so the sweep is auditable.

    (3) Type: $font-size-sm carries 481 call sites against base's 201, so it and
    not base decides whether the interface reads small. sm 12.8->13.6, base
    14->15, lg 16->17; xs and 2xs held because 12px at line-height 1.45 needs
    17.4px against a 16px ribbon label row. Control heights +2px because 15px
    text needs a 21.75px line box. $spacer 12->13px, $sp-* internals unchanged.

    Verified in a browser: LineWidthPicker trigger 4px / dropdown 6px with
    shadow, ProgressModal 6px, ribbon buttons and tabs 4px, zero vertical
    overflow anywhere in the ribbon at the larger type, and the light ring
    present in all five --theme-shadow-* plus --bs-box-shadow.

    Note for the record: this ADR's context claims the change "lands in two
    files". Three rounds proved that wrong. It described where the tokens live,
    not where they are consumed, and the gap between those two things was the
    entire cost of this work.

    Unrelated defect found: agentknowledge/history.jsonl has three malformed
    lines (43, 58, 104; dated 2026-02-20 and 2026-03-07) that fail json.loads.
    They are on main and predate this work. NOT repaired here — the file is
    declared append-only, so repairing it is its owner's decision rather than a
    side-effect of a styling change. Tracked as DEBT-KB-1.

- id: "ADR-148"
  title: "No fabricated reads — a component that cannot read must refuse, not answer"
  date: "2026-10-04"
  status: "Accepted"
  context: |
    Two bug reports arrived from the consuming apps repo after a production
    data-loss incident on 2026-10-03. A mock graph substituted for a failed CDN
    import answered serialize() with an empty document; Thinker's autosave wrote
    that over live sessions as a whole-document replacement, and they were not
    recoverable. The reports named four pickers in this library with the same
    shape and asked for a standing rule.

    An audit of all 125 components found TWELVE sites across SEVEN components,
    including three the reports did not reach and one they explicitly cleared.

    The two findings that mattered most were both missed by the reports:

    DynamicFormSwitcher is the AGGREGATION POINT, and fixing the pickers without
    it would have accomplished nothing. AGENTS.md designates it the generic form
    host every value-bearing component is driven through. readFieldValue()
    converted an adapter throw into `undefined`, and fallbackDefault() invented
    a typed value for a field that never mounted; both fed getValues(), which is
    precisely what a host hands to api.save(). A picker rewritten to throw would
    have had that throw caught there and turned back into a fabrication.

    prompttemplatemanager's save path was the most damaging single site. On a
    rejected save it called replaceTemplate() with the local copy, then ran
    clearDirty() UNCONDITIONALLY and logged "Saved". The editor reported the
    template as saved and dropped the unsaved-changes marker, so a user who
    navigated away lost the work with no error at the point of loss. That is the
    incident's mechanism — failure rendered as success, then acted upon — rather
    than the milder stale-value-persisted shape.

    The report cleared layoutpicker as "not a problem" because its null object
    fabricates only getElement(). It also answered `getValue: () => null`, and
    the contract is `LayoutAlgorithm | null`, so null is a LEGITIMATE value
    meaning "no layout selected" — the stand-in was indistinguishable from a
    real user choice, which is the report's own deciding question failing.

    Two tests were asserting the defect: columnspicker and spacingpicker
    required `getValue().name` to equal the fabricated preset after a failed
    mount. The report warned about exactly this shape and said "yours is not
    that". It was. layoutpicker had no test file at all.

    The instruction that permitted this here was NOT the contradiction the
    reports expected. This repo carries neither "design fallback mechanisms for
    storage failures" nor the Fallback Code Prohibition. It carries
    FRONTEND.md:87 — "log the error and leave the DOM unchanged" — which is
    incomplete rather than wrong: it mandates the two things the defective code
    already did correctly and is silent on the third, do-not-answer. An agent
    following it exactly produces createNullPicker().

    D1 A missing container throws; the five null-object factories are deleted.
       No internal caller is affected — every in-repo reference to those
       factories is a registry name string. breadcrumb already threw and is the
       in-repo precedent.
    D2 A degraded getValue() becomes impossible because the object is gone.
    D3 DynamicFormSwitcher.getValues()/getAllValues() throw, naming every
       unreadable field. CHOSEN BY THE USER over omitting failed fields or a
       discriminated result, both of which leave a path where a whole-document
       host still persists a partial form. An UNREADABLE unique symbol
       distinguishes "could not read" from the undefined/null/"" a form may
       legitimately contain.
    D4 A failed host callback never becomes the success path. Throwing is wrong
       for async UI flows: keep prior state and surface the error.
    D5 Cache reads may degrade to empty; the WRITE-BACK withdraws, so recents
       that failed to load are not overwritten with nothing.
    D6 scripts/check-stand-in-reads.py enforces it as structure check [9],
       mutation-tested.
  consequences: |
    + The data-loss path is closed at the aggregation point, not just at the
      five leaves the reports named.
    + A partial form can no longer be saved: getValues() refuses rather than
      returning fields the host cannot distinguish from empty ones.
    + An unsaved template stays marked unsaved, which is the only thing standing
      between the user and silent loss.
    + The rule is enforced by the build rather than by prose, which had already
      failed twelve times here and three times in the apps repo.
    - BREAKING for a consumer that today reads a partial form and tolerates it,
      and for one that calls a picker factory with a bad container and expects
      an object back. Both breaks are intended and were requested by the team
      that lost the data. The additive guarantee (ADR-141) governs the
      Surface-contract migration, not defect fixes; a read that fabricates
      persisted state is a defect.
    - The guard sees ONE shape — named stand-in factories exposing a read. It
      cannot see inline failure branches, catch-swallows, or aggregation-point
      defaults like fallbackDefault, which was the worst instance in the audit
      and was found by hand. A catch-block regex was prototyped, produced 25
      hits of which roughly 4 were real, and was dropped rather than shipped as
      noise that would train everyone to ignore the gate.
    - ConfirmDialog was checked against the reports' open question and fails
      VISIBLE, not invisible-but-clickable: plain divs, no JS-set visibility,
      and the only opacity:0 is a keyframe from-state. No change needed.
    - The dependency-closure request is accepted in principle and deferred to
      its own spec as DEBT-SEC-4, DOMPurify first.
  files:
    - "specs/2026-10-04-no-fabricated-reads.prd.md"
    - "components/dynamicformswitcher/dynamicformswitcher.ts"
    - "components/prompttemplatemanager/prompttemplatemanager.ts"
    - "components/orientationpicker/orientationpicker.ts"
    - "components/columnspicker/columnspicker.ts"
    - "components/spacingpicker/spacingpicker.ts"
    - "components/toolcolorpicker/toolcolorpicker.ts"
    - "components/layoutpicker/layoutpicker.ts"
    - "scripts/check-stand-in-reads.py"
    - "AGENTS.md"
    - "FRONTEND.md"

- id: "ADR-149"
  title: "Serve the frontend dependency closure at immutable URLs with SRI"
  date: "2026-10-04"
  status: "Accepted"
  context: |
    The consuming apps fetched executable code — maxGraph, DOMPurify, vditor,
    chart.js, bootstrap, signalr, font-awesome, cytoscape — from jsdelivr and
    cdnjs at page load. Requested in 2026-10-03-serve-the-dependency-closure.md
    (apps #232, same programme as #212, subresource integrity).

    The reasoning in the report is accepted as written. Runtime loading is
    correct and bundling was tried and reverted — several apps share maxGraph,
    and a bundled copy is re-pushed on every app deploy (Thinker went 462KB to
    2.0MB). The question is whose infrastructure. A public CDN serving
    arbitrary package content is a trust boundary we do not control, and
    whatever it serves runs with the session of whoever is looking at the page.

    Serving the closure and applying SRI are ONE requirement, not two:
    `integrity` attaches to a <script src> tag and cannot attach to a bare
    import specifier, so an artifact that resolves further imports at runtime
    defeats the point — each of those arrives unverified.

    FINDINGS THAT CHANGED THE WORK:

    The priority asset was itself vulnerable. The report said do DOMPurify
    first because a substituted sanitizer becomes the attack. Pinning the
    apps' 3.2.4 in order to vendor it surfaced NINETEEN open advisories
    against that version, including XSS bypasses. It does not need
    substituting. Vendored at 3.4.16; the apps should move their pin
    regardless of where they fetch from. maxgraph, signalr and cytoscape are
    clean at the versions the apps use.

    vditor cannot satisfy the one-file constraint. It hardcodes unpkg.com as
    its default sub-resource CDN and lazily fetches from a 21MB dist/js tree
    (echarts, mermaid, katex, mathjax, graphviz, abcjs, markmap, highlight.js,
    lute, i18n), injecting those chunks as script tags with NO integrity
    attribute. It is exactly the "one level down" case the report names, and
    SRI on those chunks is unreachable without patching vditor. Deferred with
    three options recorded in the spec.

    The real asset list was larger than the report's table: cytoscape@3.26.0
    was absent from it entirely, and the apps already load TWO font-awesome
    versions. That is the argument for generating the manifest rather than
    maintaining a list by hand.

    /vendor/* could not simply be made immutable — its paths are unversioned,
    so content legitimately changes on upgrade. cdn/_headers also warns in the
    file that Cloudflare applies every matching rule, so overlapping patterns
    emit duplicate Cache-Control headers. Hence a disjoint /lib/ prefix, and a
    manifest at /lib-manifest.json rather than inside it.

    D1 URL scheme /lib/<name>-<version>.<ext>, immutable for a year.
    D2 Source versions pinned as devDependencies so the lockfile pins them and
       npm audit covers them — a vendored library with a CVE is our problem
       once we serve it, which is precisely how the DOMPurify finding surfaced.
    D3 Closure is ASSERTED from esbuild's metafile, never grepped. A regex over
       the output was tried first and gave three false positives from a class
       method named `import`.
    D4 The manifest is the deliverable: consumers generate integrity attributes
       from it rather than transcribing hashes, which is what unblocks #212 and
       what stops a cytoscape-shaped omission recurring.
    D5 Access-Control-Allow-Origin on /lib/* is required, not cosmetic — SRI
       forces crossorigin="anonymous", making even a script-src request CORS.
  consequences: |
    + Four libraries, including the sanitizer, no longer come from a trust
      boundary we do not control.
    + One canonical URL per asset, shared across apps, cached indefinitely —
      an app deploy no longer invalidates the library.
    + #212 is unblocked: hashes are published and machine-readable.
    + Vendoring put these packages under our own npm audit, which is how 19
      DOMPurify advisories were found. That coverage is a durable benefit of
      D2 rather than a one-off.
    - This repo now carries five devDependencies it does not itself use, and
      owns the duty to upgrade them when advisories land.
    - vditor, font-awesome, bootstrap/bootstrap-icons and chart.js are NOT yet
      served. The first needs a design decision, the next two need decisions on
      the apps' side about version skew.
    - Serving an asset here gives a fixable host, NOT a guarantee of presence.
      Any runtime fetch can be absent; what makes absence safe is fail-fast
      behaviour in the consumer (ADR-148).
  files:
    - "specs/2026-10-04-dependency-closure.prd.md"
    - "scripts/vendor-closure.mjs"
    - "scripts/check-closure.mjs"
    - "cdn/_headers"
    - "CDN_CONTRACT.md"
    - "package.json"

- id: "ADR-150"
  title: "Widen the surface ladder and tint chrome, so panels read as a different material"
  date: "2026-10-06"
  status: "Accepted"
  context: |
    Reported after living with ADR-147: side panels, top bars and status bars
    were not well differentiated from content, and a moderate tint was asked
    for.

    Measurement made the complaint precise. Chrome against content was 1.056,
    where 1.000 means the two colours are identical — a sidebar was separated
    from the document beside it almost entirely by its 1px border. Dark was
    1.151, better, which is why this read as mostly a light-mode problem.

    Two faults in the ADR-147 ladder, and the second is the one that matters:

    (1) It separated planes by LUMINANCE ALONE. Saturation never exceeded 0.33
    across all four surfaces, so every plane was the same near-neutral material
    at a different brightness. Nothing said "this is chrome" except "this is
    slightly darker".

    (2) It had run out of room. Four steps were packed between #e6eaf1 and
    white, chrome sitting 0.051 of luminance below content and 0.051 above
    ground. Tinting chrome alone was tried FIRST and does not work: chrome
    moves down into the ground step and chrome|ground collapses from 1.055 to
    1.013. The whole ladder has to widen.

    D1 Widen every step and give chrome a low-saturation cast toward the
       primary, so it reads as a different MATERIAL rather than a dimmer white.
       This is the one Material Design 3 idea in play — a tonal surface.
    D2 Darken $gray-550 again, #556478 -> #4d5b6d. The widened ladder puts the
       darkest light surface at #d8e2ee, where the old value measured 4.61 —
       passing AA by hundredths, the exact state that broke when a background
       last moved (AGENT_INSIGHTS 6.8). It measures 5.29 there now.
    D3 Judge separation on the adjacencies that OCCUR ON SCREEN, not on every
       pair. sunken|ground measures only 1.040 in dark and that is fine: wells
       sit inside content, never against the page ground. Optimising a pair
       that never abuts would have cost contrast elsewhere for nothing.
  consequences: |
    + The edge the complaint was about roughly doubles: chrome|content 1.056 ->
      1.108 light, 1.151 -> 1.240 dark.
    + Chrome is a tinted material rather than a grey one, which is what makes a
      panel read as chrome at a glance rather than on inspection.
    + Luminance ordering stays monotonic in both themes — light ascends
      sunken->content, dark inverts with chrome highest — so the 140 call sites
      that depend on the direction are untouched.
    + Every value still flows from the Sass ladder; nothing in the fleet
      hardcoded the old hexes, verified by grep before editing.
    - Every surface value changes, not just chrome. That is forced by the
      geometry rather than chosen, but it means the whole interface shifts, and
      a reviewer comparing against a screenshot from yesterday will see more
      than the tint.
    - Content is now pure #ffffff rather than #fdfdfe. The near-white bought
      nothing once the ladder widened and cost separation at the top.
    - Contrast is still verified by a hand-run browser audit. There is no
      automated gate (DEBT-WEB-1), so a future surface change can still regress
      a text pair silently.
      SUPERSEDED 2026-10-09 (ADR-158) — this consequence was the direct cause
      of DEBT-VR-5, and check [12] now holds that line: a surface change that
      regresses a text pair fails the build. The silent-regression risk this
      names is closed.
  files:
    - "src/scss/_variables.scss"
    - "src/scss/_dark-mode.scss"

- id: "ADR-151"
  title: "Measure text contrast against composited backgrounds, not flat surfaces"
  date: "2026-10-07"
  status: "Accepted"
  context: |
    Structure check [12] (ADR-150, DEBT-VR-5) measured text against the four
    FLAT surfaces and passed cleanly. Eight pairs were still below the 4.5 AA
    floor in shipped CSS, because --theme-hover-bg and --theme-active-bg are
    translucent (ADR-147 D3): what a user sees is the layer composited over
    whatever surface is beneath it, and NO TOKEN NAMES that colour. A checker
    enumerating tokens cannot examine it.

    The worst was confirmed concretely rather than inferred. toolbar.scss:581
    sets `color: var(--theme-text-muted)` and :586 sets
    `&:hover { background-color: var(--theme-active-bg) }` on the SAME
    element, over chrome — so hovering a toolbar button in dark mode put its
    own label at 3.69. 21 sites across the fleet pair a state layer with
    muted text.

    D1 Check STRICTLY: every layer over every surface against every text
       token, 96 pairs per run. A usage map of which components sit on which
       plane would permit kinder values, but it goes stale silently the moment
       a component moves surfaces, and a stale map makes the gate confidently
       wrong. The user chose strict over a map when the costs were presented.
    D2 An unparseable layer FAILS rather than being skipped. A skipped case
       and a passing case are indistinguishable in the output, and the first
       implementation skipped silently — a false pass in a safety check.
    D3 Fix by moving three TEXT tokens; the state layers are untouched.
       Reaching zero appeared to require softening the layers ~25%, and that
       cost was presented and accepted. Measuring the specific consequence
       first showed light hover on chrome would fall to 1.072 — against the
       1.056 that prompted the original "not well differentiated" complaint —
       trading an AA failure for an invisible hover. Re-solving with the
       layers held fixed showed the text changes alone clear all 96 pairs, so
       the accepted cost was not paid.
    D4 Light and dark muted move in OPPOSITE directions: light $gray-550 ->
       $gray-600 (darker), dark $gray-400 -> $gray-350 (LIGHTER). A light-mode
       layer is dark and darkens the surface so dark text must darken; a
       dark-mode layer is white and lightens it so light text must lighten.
       Moving both the same way was tried first and DOUBLED the failures from
       8 to 14.
    D5 $gray-550 is retired. The value light muted now needs is #475569, which
       is exactly $gray-600, so the custom half-shade ADR-150 added for this
       purpose is redundant. $gray-350 is added for the same reason in the
       other direction.
  consequences: |
    + Eight shipped AA failures are fixed, including a toolbar button whose
      own label was unreadable on hover under two prior contrast reviews.
    + The hover affordance is exactly as approved; the softening that looked
      mandatory was avoided.
    + The gate cannot be satisfied by a token that merely looks fine in
      isolation, which is the property that let this ship.
    - Three text tokens changed, so muted labels and the active tab label look
      slightly different from what was reviewed on 2026-10-06.
    - DEBT-VR-5c records what is still unmodelled: a layer over a SELECTED row
      (two layers composited), WCAG's large-text exemption, and text over the
      --theme-group-bg-* pastels. The two-layer case is the likeliest to become
      real.
    - DARKMODE.md §2.3 claimed muted text was $gray-500 "in BOTH modes" and had
      been stale since ADR-147. Corrected, and now states the opposite-
      directions rule explicitly, since that is the trap most likely to be hit
      by the next person adjusting it.
  files:
    - "scripts/check-contrast.py"
    - "src/scss/_variables.scss"
    - "src/scss/_dark-mode.scss"
    - "DARKMODE.md"

- id: "ADR-152"
  title: "Data-driven colours reach CSS as custom properties, never as inline backgrounds"
  date: "2026-10-07"
  status: "Accepted"
  context: |
    Two dark-mode defects were reported from the demo gallery, and they share
    one shape: a light background applied as a FIXED value while the text
    colour came from the theme. In dark mode the text inverts and the
    background does not, so the content disappears against its own row.

    VisualTableEditor: four presets (blue-header, dark-header, green-accent,
    warm) carried a near-white `alternatingRow` and the factory wrote it as
    `tr.style.backgroundColor`. An inline background cannot respond to a
    theme. The two presets that looked correct, minimal and striped, use
    var(--bs-*) tokens — and the demo page stated that only those two adapt,
    so the defect was documented and shipped and still read as broken the
    first time anyone opened the gallery in dark mode.

    Stepper: the fault was in the DEMO, not the component. Its makeContent()
    helper hardcoded a #f8f9fa background and a #dee2e6 border inline, while
    the component used tokens correctly throughout. Two other demos carried
    the same helper, and the splitlayout demos had the same shape in another
    form — coloured panes setting a background without its paired foreground.

    Both defects PRE-DATE this session, confirmed by git. ADR-150's widened
    ladder made them starker by moving the surrounding dark surfaces further
    from the light patches, which is why they were reported now.

    D1 A colour that comes from DATA — a preset, a user choice, a brand value
       — is handed to CSS as a custom property (--vte-alt-row,
       --vte-alt-row-dark) and the stylesheet chooses per theme. A theme
       toggle then repaints with no re-render.
    D2 Any preset carrying a LITERAL tint must declare a dark twin at the same
       hue. A preset whose tint is already a token does not, because the token
       resolves per theme on its own.
    D3 The fallback is the themed sunken surface, never the light literal.
       Reusing the light value when no dark twin exists reproduces the defect.
    D4 Demo code is held to the same rule. It is the first thing a consumer
       copies, and a background set without its foreground teaches the
       mistake.
  consequences: |
    + Every alternating row in VisualTableEditor is readable in both themes,
      verified in a browser as carrying genuinely different backgrounds per
      theme rather than an absence of tint.
    + A regression test asserts a literal-tint preset declares a dark twin and
      never pins an inline background; mutation-tested by reverting the apply
      path.
    - The four dark twins are hand-picked at the same hue rather than derived,
      so a future preset needs its twin chosen by eye and measured. Deriving
      them would need a colour model the component does not otherwise carry.
    - The contrast gate (check [12]) cannot see any of this: these colours are
      component data, not theme tokens, so they never appear in the compiled
      stylesheet's :root block. The gate covers the ladder; component-level
      literals remain the responsibility of review and tests.
  files:
    - "components/visualtableeditor/visualtableeditor.ts"
    - "components/visualtableeditor/visualtableeditor.scss"
    - "components/visualtableeditor/visualtableeditor.test.ts"
    - "demo/components/stepper.html"
    - "demo/components/splitlayout.html"
    - "demo/full-demo.html"

- id: "ADR-153"
  title: "Component colour palettes must carry their own text, and be derived rather than picked"
  date: "2026-10-08"
  status: "Accepted"
  context: |
    DEBT-VR-7 and DEBT-VR-8, taken together because the second is the tool
    the first kept needing.

    The surface-contrast gate (check [12], ADR-150/151) reads the compiled
    stylesheet, so it covers the THEME ladder and nothing else. Colours that
    live in component TypeScript never appear in :root. Nine palettes across
    nine components sat in that blind spot, and measuring them found:

      INITIALS_PALETTE   8/8 entries failed, worst 1.92 (white on #eab308)
      INITIALS_COLORS    4/8 failed, worst 3.00 (white on #e67700)
      HASH_PALETTE       5/12 failed, worst 3.00

    Two distinct faults. Five components painted white on a palette that
    could not carry it. Three more — activityfeed, applauncher,
    workspaceswitcher — set only the background and let the FOREGROUND be
    inherited, so it flipped to near-white in dark mode and every entry
    failed. That is the ADR-152 pattern, found by sweeping rather than by
    being reported.

    D1 Palettes are darkened HUE-PRESERVING until white clears 4.5, and the
       three inheriting components set the foreground explicitly.
    D2 Caller-supplied colours cannot be vetted at build time. actionitems,
       facetsearch, logconsole and tagger paint host-provided values, and a
       fixed "#fff" fails on anything pale. They gained readableOn(), which
       picks ink or paper by relative luminance, guaranteeing 4.5 against one
       extreme for ANY input. Duplicated per component because each bundles
       as a standalone IIFE.
    D3 presenceindicator used #f8f9fa and measured 4.36 on the corrected
       palette. It moves to pure white rather than re-darkening a palette
       five other components share for one component's sake.
    D4 Check [13] enforces it. The pairing of palette to foreground is an
       explicit table, not a regex widening, so adding a palette is a
       deliberate claim about what text sits on it.
    D5 scripts/derive-colour.py replaces picking these by eye — `fit` for a
       palette entry that must carry a fixed foreground, `twin` for a dark
       counterpart of a light tint. A developer tool: the gates verify the
       results, nothing imports it.
  consequences: |
    + Nine palettes that shipped unreadable are now readable, including white
      initials on yellow at 1.92.
    + Any caller-supplied colour is now safe by construction rather than by
      hoping the host picks a dark one.
    + The derivation is validated, not merely plausible: `fit` reproduces all
      four hand-derived palette values EXACTLY. The four preset twins already
      shipped meet its threshold, so nothing was churned to adopt it.
    + Check [13] found a colour the hand pass missed on its FIRST run —
      tagger's #d9480f at 4.30, missed because I guessed that palette's
      contents rather than reading them.
    - INITIALS_PALETTE changed all eight entries, so avatars in activityfeed,
      applauncher and workspaceswitcher look meaningfully darker. That is the
      cost of carrying white text; the alternative was dark text, which fails
      in the other direction on the saturated end of the palette.
    - readableOn() is duplicated in four components. The IIFE build forbids a
      shared module, which is the same constraint that already duplicates the
      avatar palette six times. If that constraint ever lifts, both should
      collapse into one helper.
    - Still unchecked: chart and diagram palettes, where the requirement is
      series DISTINCTNESS rather than text contrast — a different
      measurement, recorded as DEBT-VR-9.
  files:
    - "scripts/check-component-palettes.py"
    - "scripts/derive-colour.py"
    - "components/peoplepicker/peoplepicker.ts"
    - "components/personchip/personchip.ts"
    - "components/presenceindicator/presenceindicator.ts"
    - "components/sharedialog/sharedialog.ts"
    - "components/usermenu/usermenu.ts"
    - "components/activityfeed/activityfeed.ts"
    - "components/applauncher/applauncher.ts"
    - "components/workspaceswitcher/workspaceswitcher.ts"
    - "components/tagger/tagger.ts"
    - "components/actionitems/actionitems.ts"
    - "components/facetsearch/facetsearch.ts"
    - "components/logconsole/logconsole.ts"
