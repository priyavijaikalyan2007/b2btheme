- id: "ADR-160"
  title: "Eleven of sixteen exemption blockers did not survive re-measurement, because the runtime grew the mechanisms they named"
  date: "2026-10-10"
  status: "Accepted"
  context: |
    DEBT-DUI-4 recorded sixteen components as EXEMPT from the fleet
    conformance gate, "with recorded blockers". The count had been verified a
    day earlier (ADR-159) and was right. The blockers themselves had never
    been re-read since the list was seeded on 2026-08-03.

    Six of them said "Required option shape not yet determined". Four named a
    "non-standard factory signature". One said "Factory returns null under
    jsdom; needs investigation". Each is a sentence about what somebody
    expected to be hard, not a record of an attempt.

    Between the seed and today the runtime grew `factoryStyle`
    (container-first / options-first / options-only), `containerOption`,
    `containerAs`, `mountMethod`, and the `invoke` hook in
    `<name>.conformance.ts` — precisely to honour a fleet where only 35 of 118
    factories follow the canonical argument order. The seed's blockers predate
    all of it.
  decision: |
    D1. Six components are MIGRATED at `display`: usermenu, timeline,
        stacklayout, multiselectcombo, permissionmatrix, fileexplorer. None
        needed a change to its own source. Each needed a manifest declaring
        the argument order the runtime already supports, and five needed
        fixture options in conformance glue.

    D2. Five components move from EXEMPT to NOT_MOUNTABLE, which is where they
        always belonged: statusbar (createStatusBar calls show() with no
        argument, appending to document.body — mechanically identical to the
        toolbar exclusion), graphtoolbar (builds a preconfigured Toolbar via
        window.createToolbar and throws without it, so it wraps an already
        excluded component), commandpalette (a getInstance() singleton that
        appends its backdrop to document.body and is opened by a shortcut),
        guidedtour (a full-viewport walkthrough that steps a popover across
        other components' elements), helptooltip (takes the element it
        decorates as its first argument and throws without one).

    D3. `display` is the target, not `surface`. EXEMPT means "no manifest";
        clearing it needs mount, render and destroy. Promotion to `field` or
        `surface` is a change to a component's own public API and belongs with
        that component's arc. DEBT-DUI-4's prose conflated the two.

    D4. AuthCard stays EXEMPT, but its blocker is replaced rather than kept.
        `(containerOrId: string | HTMLElement, options)` IS container-first —
        the union accepts the host id the gate passes — so the frozen ADR-138
        contract was never the obstacle. What is open is a category decision:
        AuthCard renders Keycloak's pre-session login step, and a manifest
        would publish it to consumers as canvas-mountable. That is the user's
        call, not a migration task.
        CLOSED 2026-10-11 (ADR-163): the answer is NOT_MOUNTABLE, and the
        reason is sequence rather than shape. A canvas is composed in reaction
        to a model response; AuthCard's login step runs before a session
        exists, so there is never a response for it to be part of.

    D5. The surviving four blockers are rewritten to say what was TRIED.
        graphminimap requires a live GraphCanvas and a 2D context jsdom does
        not implement. diagramengine waits on phase 10, unchanged.
        dynamicformswitcher's signature resolves; what is open is what its
        manifest should declare, which is consumer-visible design.
        markdowneditor exports a class and no factory, so migrating it means
        ADDING one to the public surface.

    D6. The renders-content blind spot found while proving the new entries is
        recorded as DEBT-DUI-6 rather than fixed. Changing the check affects
        all 97 migrated components.
  consequences: |
    + EXEMPT: 16 -> 5. Migrated: 91 -> 97 of 102 in scope. Permanently
      excluded: 18 -> 23. The gate logs all three on every run.
    + Not one of the six migrations touched component source. Six manifests,
      six glue files, and the removal of six names from a Set.
    + Every new entry was mutation-proved, not just observed passing.
      Flipping timeline's containerAs to "element" fails renders-content with
      the diagnostic naming all three attachment fields; flipping
      stacklayout's to "id" fails `mounts` with
      "options.container.appendChild is not a function".
    - THREE OF THE SIX FIXTURES ARE NOT WHAT MAKES THE GATE PASS. Emptying
      the glue options for usermenu, stacklayout and fileexplorer leaves all
      three GREEN, because renders-content is satisfied by chrome — a toolbar,
      a trigger button, a root div — and by an empty-state message in
      permissionmatrix's case. Only timeline and multiselectcombo have
      load-bearing fixtures. Measured, and written into each glue header, so
      the next reader does not assume a deleted fixture would turn the gate
      red.
    - emits[].legacyOption is ALSO hand-declared and unchecked at display:
      the channel checks are surface-level, so a misspelled callback name
      would ship to consumers in capability-manifest.json and pass green. All
      nine were grepped against their option interfaces. FileExplorer turned
      up TWO callbacks for one event -- onSelect and onSelectionChange, fired
      from adjacent lines of the same method -- which is recorded in its
      manifest, because legacy-callback-fires checks one name and the
      duplicate would go unobserved on promotion to surface.
    - mountCost and holdsResources are HAND-DECLARED and nothing checks them.
      weight.js is overwritten by the build from the real bundle, so it is
      the one field that cannot drift; the two beside it can. All six were
      corrected against the measured bundle size and the fleet's own size
      bands after the first build, and timeline's holdsResources is true
      because it retains an IntersectionObserver and a ResizeObserver.
    - typeIssue() in runtime/src/errors.ts produced "Supply a valid a
      non-empty string" at every one of its ~20 call sites, because each
      caller's `expected` string carries its own article so it reads correctly
      after "Expected". Found by reading a real validation failure. Fixed in
      the one place.
  files:
    - "runtime/fleet-conformance.test.ts"
    - "runtime/src/errors.ts"
    - "components/usermenu/usermenu.manifest.ts"
    - "components/timeline/timeline.manifest.ts"
    - "components/stacklayout/stacklayout.manifest.ts"
    - "components/multiselectcombo/multiselectcombo.manifest.ts"
    - "components/permissionmatrix/permissionmatrix.manifest.ts"
    - "components/fileexplorer/fileexplorer.manifest.ts"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"

- id: "ADR-161"
  title: "Content anchors are resolved by the host, and unresolved content orphans the note rather than losing it"
  date: 2026-10-11
  status: "Accepted"
  context: |
    DEBT-DUI-1 and DEBT-DUI-5 were one defect: every anchor the canvas could
    resolve named a POSITION, so a mark survived scrolling and resizing and
    not reflow. Both entries prescribed the same cure, the existing
    `{ kind: "entity" }` anchor, and that cure did not exist. document.ts
    validated an entity anchor, anchorTarget() returned null for it because it
    tested kind === "node", and the overlay was packed as though unanchored.
    It rendered, reported nothing and was attached to nothing.

    specs/2026-10-10-durable-anchors.prd.md put three questions to the user.
    All three were answered on 10 October 2026: make the resolver REQUIRED on
    DynamicUIHost, show an unresolved note as ORPHANED rather than hiding it,
    and build it now because the apps team has not taken a dependency yet.

    One fact shaped the implementation and is not in the design. DynamicUIHost
    is declared in runtime/src/types.ts and consumed NOWHERE in this
    repository. No runtime code holds a host instance; the canvas takes its
    wiring through DynamicCanvasOptions, where every member is optional. So a
    required member is a contract change for the one external consumer, and
    the functional wiring had to go through the canvas option as well.
  decision: |
    D1. `EntityAnchor` gains an optional `selector`, opaque to the runtime and
    passed to the host verbatim. `entityId` alone cannot disambiguate the same
    record mounted twice.

    D2. `DynamicUIHost.onResolveAnchor` is REQUIRED, taking (anchor, nodeId)
    and returning `HTMLElement | null`. The interface comment moves from six
    functions to seven. Paid now, before the first host exists.

    D3. The canvas option `onResolveAnchor` stays OPTIONAL. Demo pages, the
    Layout Studio and the test suites mount the canvas and are not host
    applications. A canvas with no resolver treats every content anchor as
    unresolved, which D4 defines.

    D4. Unresolved content ORPHANS the note: `dyncanvas-overlay-orphaned`, a
    warning glyph, and a visually hidden sentence. Never hidden, never
    removed, never re-placed by coordinate. Orphaned and hidden are exclusive.
    A comment must not disappear because the data it discussed was deleted.

    D5. The resolver is SYNCHRONOUS and called once per render, never from the
    scroll path. A resolved element is re-measured while it stays connected;
    the resolver is asked again only when it disconnects.

    D6. A remembered `frameId` separates "deleted" from "not mounted". Once a
    note resolves, it follows that frame's mounted-ness like a spot mark, and
    the resolver is not asked while that frame is unmounted.

    D7. The canvas verifies what the host returns: the element must be inside
    a mounted frame of THIS canvas and not inside the anchored node's own
    frame.
  consequences: |
    + A content anchor survives reflow, which is what DEBT-DUI-1 asked for.
      DEBT-DUI-5 stays open: that is approach B, region names, 68 components.
    + The published type stops compiling for a host that does not implement
      the member, which is the intended effect and the reason for the timing.
      specs/2026-10-11-content-anchors-migration-guide.md is the one-function
      migration.
    - D6 EXISTS BECAUSE THE OBVIOUS IMPLEMENTATION IS WRONG. A resolver's null
      means "not found now", which is equally true when the component holding
      the content was demoted by virtualization. Asking and believing the
      answer turns every comment on a grid orphaned the moment the user pans
      away. That is decision D4 lost through the back door, and the advisor
      caught it in the plan rather than in the code.
    - THE BROWSER FOUND A BUG THE UNIT SUITE COULD NOT. `refineOverlaysOf`,
      the scroll handler, selected overlays with `anchorTarget(node) ===
      targetId`, which is node-anchors-only, so a content-anchored note did
      not follow its row on scroll. jsdom reports every rectangle as zero, so
      no unit assertion could see it. Fixed by `trackedTarget`, used by the
      scroll handler and the virtualization pass alike.
    - The own-frame refusal (D7) is UNREACHABLE for overlays and reachable
      only for a normal node. An overlay's container carries
      `dyncanvas-overlay` and never `dyncanvas-frame`, so `closest` cannot
      find one. The first version of that test passed for the wrong reason
      and was rewritten against a stickynote carrying a content anchor.
    - A FIRST-LOAD FALSE ORPHAN IS POSSIBLE AND IS NOT TESTED. visibleNodes
      runs before mounting, and on the first pass a content-anchored note has
      no learned frame, so its own rectangle decides whether it mounts. If the
      note's nominal placement is in view and the component holding its
      content is not, the note mounts, resolves to nothing and shows orphaned
      for one render. It clears on the next pass once that component mounts.
      Acceptable because an orphan is a statement about now, and because the
      wording never claims deletion. The e2e probe builds both nodes in view,
      so nothing exercises it.
    - An orphaned note keeps its last resolved position only while the canvas
      is open. After a reload nothing records where the content was, so the
      packer places it by its stored placement. Recorded in the README and the
      migration guide rather than hidden. NARROWED for geometric anchors by
      ADR-162 the same day; for a content anchor it needs a region and a spot
      kept as a hint, which is approach C and is not built.
    - `CSS.escape` is not available in jsdom, so the orphan description
      element is found by class rather than by id.
    - Position is asserted in tests/dynamic-ui.spec.ts, not in vitest. Three
      e2e tests measure real layout, and both the geometry and the scroll fix
      are mutation-proven there. The vitest file covers the resolver's state
      machine, and says so in its header. ADR-162 later added two tests to the
      same file for region-name handling, which is why the header names both
      subjects rather than one.
  files:
    - "runtime/src/types.ts"
    - "runtime/src/document.ts"
    - "runtime/src/document.test.ts"
    - "runtime/runtime.ts"
    - "components/dynamiccanvas/dynamiccanvas.ts"
    - "components/dynamiccanvas/dynamiccanvas.scss"
    - "components/dynamiccanvas/dynamiccanvas-anchors.test.ts"
    - "components/dynamiccanvas/README.md"
    - "tests/dynamic-ui.spec.ts"
    - "docs/DYNAMIC_UI_GUIDE.md"
    - "specs/dynamicui.prd.md"
    - "specs/2026-10-10-durable-anchors.prd.md"
    - "specs/2026-10-11-content-anchors-migration-guide.md"
    - "CODEBASE_FIXES.md"
