- id: "ADR-106"
  title: "Chrome CSS fallback values — self-contained component CSS for CDN consumers"
  date: "2026-04-05"
  status: "Accepted"
  context: "Chrome effects (hover glow, edge shadow, focus ring) were invisible in CDN-consuming apps. Root cause: chrome CSS custom properties (--theme-glow-color-hover, --theme-edge-shadow-rgb, --theme-edge-shadow-opacity) were defined only in custom.css via _dark-mode.scss. Component CSS files used bare var() references with no fallback. Apps loading individual component CSS without custom.css got empty values. Fix: (1) Added CSS var() fallback values to all 99 --theme-glow-color-hover references across 44 SCSS files — fallback is rgba(37,99,235,0.18) (primary blue at 18%). (2) Replaced split rgba(var(--rgb), var(--opacity)) edge-shadow pattern with single --theme-edge-shadow-color composite token with fallback rgba(15,23,42,0.12). (3) Added --theme-edge-shadow-color to _dark-mode.scss for both light (0.12 opacity) and dark (0.25 opacity) modes. Apps that DO load custom.css override fallbacks via normal CSS cascade. Each component CSS is now self-contained for chrome effects."
  files:
    - "src/scss/_chrome.scss"
    - "src/scss/_dark-mode.scss"
    - "src/scss/custom.scss"

- id: "ADR-107"
  title: "Chrome edge shadow visibility + raw HTML input hover glow"
  date: "2026-04-05"
  status: "Accepted"
  context: "Two follow-up chrome issues after ADR-106 fallback fix: (1) Edge shadows still imperceptible — opacity 0.07 produced only 17px contrast delta on white, below perceptual threshold. Increased to 0.12 (29px delta, matching --theme-shadow-sm). Dark mode stays at 0.25. (2) Raw HTML inputs without Bootstrap .form-control class (e.g. input[type=number]) didn't get hover glow — custom.scss only targeted .form-control/.form-select. Added native input (excluding hidden/checkbox/radio/submit/button/reset/range/file/image/color), textarea, select selectors with hover glow + 150ms transition."
  files:
    - "src/scss/_chrome.scss"
    - "src/scss/_dark-mode.scss"
    - "src/scss/custom.scss"

- id: "ADR-108"
  title: "Edge shadow clipping fix — DockLayout overflow removal + contained mode z-index elevation"
  date: "2026-04-05"
  status: "Accepted"
  context: "Edge shadows on Sidebar, TabbedPanel, and Ruler were invisible in DockLayout despite correct fallback values (ADR-106) and increased opacity (ADR-107). Two root causes: (1) DockLayout grid cells (.dock-layout-toolbar, .dock-layout-left, .dock-layout-right, .dock-layout-bottom) all had overflow:hidden, which clips children's box-shadow — contained Sidebar/TabbedPanel/Ribbon sit inside these cells. Fix: removed overflow:hidden from these 4 grid cells; contained components (Sidebar, TabbedPanel, Ribbon) already manage their own overflow:hidden. Center and status cells retain overflow:hidden. (2) Contained-mode docked panels (.sidebar-contained.sidebar-docked, .tabbedpanel-contained.tabbedpanel-docked) used z-index:auto, which doesn't create a stacking context — adjacent grid siblings paint their backgrounds over the shadow area. Fix: changed to z-index:1, creating minimal stacking elevation above auto-z siblings. (3) Ruler (.ruler) had position:relative but no z-index — sibling elements in flow painted over its edge shadow. Fix: added z-index:1."
  files:
    - "components/docklayout/docklayout.scss"
    - "components/sidebar/sidebar.scss"
    - "components/tabbedpanel/tabbedpanel.scss"
    - "components/ruler/ruler.scss"

- id: "ADR-109"
  title: "DataGrid column resize vs drag-and-drop conflict fix + sizeHint presets"
  date: "2026-04-06"
  status: "Accepted"
  context: "Column resize handles used pointerdown with stopPropagation() but not preventDefault(). Since the header cell has draggable=true for column reorder, the HTML5 drag-and-drop system (independent of pointer events) still detected the gesture and fired dragstart, moving the column instead of resizing it. Fix: added preventDefault() to resize handle pointerdown to suppress HTML5 drag initiation, and added a dragstart guard that cancels drag when initiated from .datagrid-resize-handle. Also added sizeHint column option (xs/s/m/l/xl → 60/100/160/240/360px) that resolves to width and minWidth during column initialization, giving consumers semantic initial sizing without calculating pixel values."
  files:
    - "components/datagrid/datagrid.ts"
    - "components/datagrid/README.md"

- id: "ADR-110"
  title: "SymbolPicker stale search state on reopen"
  date: "2026-04-06"
  status: "Accepted"
  context: "After searching and inserting a symbol, reopening the SymbolPicker (popup or RibbonBuilder inline) retained the previous search term. Deleting it character-by-character eventually left the grid empty and non-interactive. Root cause: neither closePopup() nor enable() cleared filterQuery or searchInput.value, so openPopup()/enable() rendered the grid with a stale filter. Fix: added resetFilterState() private helper that zeroes filterQuery and clears searchInput.value. Called from openPopup() (popup mode) before renderGrid(), and from enable() (inline/RibbonBuilder mode) with a follow-up renderGrid(). Refactored switchMode() to reuse resetFilterState() instead of duplicating the same two lines."
  files:
    - "components/symbolpicker/symbolpicker.ts"

- id: "ADR-111"
  title: "FileExplorer flat mode extension for host-driven content panel"
  date: "2026-04-06"
  status: "Accepted"
  context: >
    Apps team requested a flat content browser component (no tree sidebar, host-driven
    breadcrumbs, flat item arrays). Analysis showed this is the right-hand panel of the
    existing FileExplorer. Rather than a new component, extended FileExplorer with a
    flat mode code path covering 22 identified gaps (G1-G22) across 7 phases.
  decision: >
    Single-point data source change: getCurrentChildren() returns flatItems when non-null,
    making all 5 callers (getSortedItems, renderStatusLine, handleKeySelectAll, navigate
    announcement, selectRange) automatically use flat items. New public methods: setItems(),
    getItems(), setBreadcrumb(), showLoading(), showEmpty(), selectItem(), selectItems(),
    deselectAll(), getSelectedIds(), startRenamePublic(), focus(). New interfaces:
    BreadcrumbSegment, FileExplorerColumn. FileNode extended with iconColor, typeLabel,
    owner, readOnly, isSystem. Options extended with items, breadcrumb, columns, groupBy,
    multiSelect, emptyState, and 8 new callbacks. Grouping via getGroupedItems() with
    type-first, none, and custom function modes. Detail view refactored for custom columns
    via FileExplorerColumn[]. DnD with attachDragListeners(). Dynamic context menu items.
    readOnly/isSystem guards on rename and delete. CSS custom properties on root. 38 tests.
  files:
