- id: "ADR-105"
  title: "ExplorerPicker — separate dimming from selectability, fix tree interaction"
  date: "2026-04-05"
  status: "Accepted"
  context: "In selectionTarget resource mode, container nodes (ORG_UNIT, FOLDER) were non-selectable. applyRowState applied dimmed class to all non-selectable nodes, and dimmed had pointer-events:none in SCSS. This blocked expand toggles, making the entire tree unclickable. Fix: (1) removed pointer-events:none from dimmed CSS — dimmed rows still need clickable expand arrows. (2) Created shouldDimNode() separate from isNodeSelectable() — containers in resource mode serve as navigation and must not be dimmed; only excluded nodes and wrong-target items are dimmed. (3) Refactored 7 methods exceeding 30-line limit into extracted helpers. (4) Added demo entries to index and full-demo pages."
  files:
