    - "agentknowledge/history.jsonl"

- id: ADR-175
  title: The `any` count watched the annotation and not the assertion, and the casts were downstream of unwritten types
  date: 2026-10-14
  status: accepted
  context: |
    ANY-1 was baselined at 88 occurrences of `: any`. That pattern watches a
    DECLARATION saying the type is unknown. A value cast says the same about
    an expression and carries no colon, so 69 `as any` were counted by
    nothing. 88 of 157.

    This is the third instance in three days. windowAnyCasts watched one
    spelling of four. windowCasts watched every spelling of the assertion
    and missed the alias that carried 73 accesses. Each gate was correct,
    re-derivable and mutation-proven, and each was named after a behavior it
    only partly watched. Insight 6.67.

    Reading the 69 casts changed what the item is. 56 were in
    components/toolbar/toolbar.ts and 41 of those were
    `(config as any).<field>`. The cause was one line: the live-config map
    named three of the ten item interfaces the file declares, and the seven
    it omitted carry `checked`, `value` and `suffix`, which are the fields
    the casts reach for. Nothing failed, because `addTool` stores
    `JSON.parse(JSON.stringify(tool))` and `JSON.parse` returns `any`.

    The same shape appeared twice more. DockLayout described five slots as
    `any` when the twelve members it calls are identical every time, and
    eight layout components each described the mounted child as `any` when
    the surface is the same seven members in all eight.
  decision: |
    D1. `anyCasts` IS A SECOND COUNT, NOT A WIDER REGEX. A wider pattern
        would have merged two numbers that should disagree. Kept apart, a
        cast rewritten as an annotation fails anyAnnotations while anyCasts
        holds, and the reverse also fails. Baselined at 69 before any source
        file moved, then at 2. anyAnnotations went 88 to 13. The counter
        skips comment lines and string data, which windowCasts does not.

    D2. A MISSING UNION IS FIXED, NOT THE 41 CASTS DOWNSTREAM OF IT.
        `ToolbarItem` names all eleven members, `ToolbarTool` excludes the
        separator because a separator has no id and never reaches a live
        config, and `ToolbarItemFields` names what a live item may carry.

    D3. THE GENERIC PATHS ASSERT ONCE TO A NAMED INTERSECTION. They read
        `ToolbarTool & Partial<ToolbarItemFields>` rather than `any`, which
        is weaker than the per-member types and far stronger than what it
        replaces. Narrowing on `type` instead would mean adding run-time
        checks where none exist, which is a behavior change wearing a
        type-safety costume. `setToolState` writes eight fields to any tool
        id today and that is the behavior being described.

    D4. ONE SHARED `MountableComponent` IN components/globals.d.ts rather
        than eight private copies. Components here do not import one
        another, so a `.d.ts` in the global scope is the only place a shared
        structural contract can live. `DockSlotComponent` extends it and
        adds the five members DockLayout alone needs.

    D5. THE BOOTSTRAP GLOBAL IS DECLARED ONCE, as `var` rather than as a
        member of `Window`, because three components reach it as a bare
        identifier. ANY-2 found four declarations of it, one of them a
        `@ts-expect-error` that was the only type suppression in the tracked
        sources.

    D6. ANY-3 CARRIES THE LAST 15. They are in visualtableeditor and name
        Toolbar and ContextMenu option types, which are exported from their
        own components but not published as globals, so neither the
        no-cross-import rule nor globals.d.ts reaches them. That is a policy
        question, not a typing one, and it is not decided here.
  consequences: |
    + 157 USES OF `any` BECOME 15, and all 15 are in one file.
    + 123 OF 126 BUNDLES BYTE-FOR-BYTE IDENTICAL across three commits, and
      every difference was read. The DockLayout change alone left all 126
      identical, which is what a purely type-level change looks like.
    + THREE FIXES CAME OUT OF THE TYPES. A color value could escape a
      function declared to return a string, a non-function `onChange` would
      have been called, and `ErrorDialog` threw a bare ReferenceError when
      Bootstrap's JavaScript was absent.
    = THE DOCKLAYOUT INTERFACE WAS WRONG ON THE FIRST ATTEMPT, written from
      a grep that matched a bare receiver and not `this.bottomPanel.`, so it
      missed `getHeight` and `options`. The compiler caught it. The second
      attempt enumerated the surface rather than sampling it.
    - A COUNT NAMED AFTER A CONCEPT IS READ AS COVERING THE CONCEPT. Three
      times now the pattern was written by looking at the code in front of
      it. Before baselining, state the behavior in a sentence with no syntax
      in it and ask how many ways the language has to express it.
    - AN IMPLICIT `any` IS INVISIBLE TO BOTH COUNTS. `JSON.parse` returning
      `any` is what let the toolbar union be wrong for as long as it was,
      and no text pattern can see it. That is noImplicitAny territory and it
      is not opened here.
  files:
    - "scripts/audit-counts.mjs"
    - "scripts/audit-counts.test.ts"
    - "components/globals.d.ts"
    - "components/toolbar/toolbar.ts"
    - "components/docklayout/docklayout.ts"
    - "components/errordialog/errordialog.ts"
    - "components/markdowneditor/markdowneditor.ts"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "AGENTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-176
  title: Verbose logging is opt-in, a local host opts in for you, and the rule is written three times on purpose
  date: 2026-10-14
  status: accepted
  context: |
    The user asked whether trace and debug could reach production, said
    neither should be on by default anywhere, and asked for debug to turn on
    automatically on localhost. Reading the code found two independent
    reasons the answer was no.

    THE DEFAULT LEVEL WAS "debug". The level lands at 0 and the debug gate
    is `level > LEVELS.debug`, which is `0 > 0` and false. Documented as the
    default in logutility/README.md, so it was deliberate, but all 125
    components call `createLogUtility()` with no options, the singleton
    keeps whatever the first caller passed, and nothing in the repository
    calls `setLevel`. The four demo pages that create it call it bare.

    THE FALLBACK HAD NO FILTER. The branch after the colon in
    `_lu ? _lu.debug(...) : console.debug(...)` runs when `logutility.js` is
    absent, and it read no flag and no level. FRONTEND_LOGGING.md recorded
    that 6 of 138 demo pages load the utility and called a page without it
    "fully supported". It also justified leaving debug in production with
    "Browser DevTools hides debug output by default", which is true of the
    DISPLAY filter and not of emission.
  decision: |
    D1. THE DEFAULT LEVEL IS "info". Info, warn and error emit. Debug and
        trace are opt-in. A host that already passes a level is unaffected,
        because the first caller still wins.

    D2. THE DEBUG FLAG IS TRI-STATE. Unset means "decide from the host",
        true is on anywhere, false is off even on localhost. The third state
        is not decoration: jsdom serves every test from localhost, so
        without it the suite goes verbose, and six level-filtering
        assertions failed the moment the rule landed.

    D3. A LOCAL HOST TURNS DEBUG ON, AND ONLY DEBUG. Trace is event-handler
        volume and nobody wants it for opening a page. The rule matches
        localhost, 127.0.0.1, the bracketed IPv6 loopback, and any
        .localhost subdomain, against location.hostname. Brackets kept,
        because that is what a browser reports for an IPv6 literal.
        Subdomains in, per RFC 6761. Out on purpose: file URLs, LAN
        addresses, and .test. A hostname like localhost.example.com is a
        registrable public domain and reads as remote, which a
        "hostname contains localhost" rule would have got wrong.

    D4. THE FLAGS FORCE ON, THEY DO NOT OVERRIDE. An explicit level of
        "debug" still emits whatever the flag says, because the level
        comparison short-circuits before the flag is read.

    D5. THE RULE IS WRITTEN THREE TIMES AND GUARDED MECHANICALLY. The
        component fallback exists precisely when logutility.js is absent, so
        the three copies cannot share code. driftedHostRule fails if any
        file computing the gate stops carrying the literal, a test asserts
        the literal the script compares against is the one logutility.ts
        declares, and ungatedVerboseShims pins the shim text at 0.

    D6. diagramengineLines RISES, 30478 to 30482. First baseline in the
        table to go up. The engine factory needs three lines for the two
        constants and one comment. Recorded in the BASELINES comment rather
        than absorbed, because a ratchet that cannot record a justified
        exception gets worked around instead, and a worked-around ratchet
        measures nothing.
  consequences: |
    + DEBUG AND TRACE NO LONGER REACH A PRODUCTION CONSOLE unless the page
      asks. 225 ungated shims across 117 files go to 0, plus the engine
      factory serving nineteen namespaces.
    + THE SUITE FOUND THE LOCALHOST RULE ITSELF, by going verbose and
      failing six assertions, which is better evidence that it works than
      any test written afterwards.
    = FOUR SHIM SHAPES, NOT ONE. 109 files use the one-liner, five split the
      ternary, four use if/else, NavRail uses an early return. The migration
      took three passes and one hand edit. A script that assumes uniformity
      in a codebase that is not uniform skips what it does not recognize.
    = THE COUNTER HAD THE SAME BUG AND IT MATTERED MORE. A lazy body match
      stopped at the brace closing an `if`, so four MIGRATED files read as
      unmigrated. Anchoring to a newline-brace fixed those and broke the
      one-liners. Counting braces reads all four shapes.
    - 50 COMPONENTS CARRY A GATE THAT CANNOT FIRE, because both verbose
      shims are dead there, and terser keeps the window read while dropping
      the constant. 15485 bytes, 0.71 percent. That is the LOG-4 decision:
      trace is declared in 108 components and called in 2, while 80 of the
      other 106 have high-frequency handlers. Instrumenting them makes the
      gates work; deciding against trace removes shims and gates together.
    - 216 SHIM LINES GOT LONGER, against a 120-character limit that nothing
      enforces and that 543 of them already broke. LOG-5.
  files:
    - "components/logutility/logutility.ts"
    - "components/logutility/logutility.test.ts"
    - "components/logutility/README.md"
    - "components/diagramengine/src/logging.ts"
    - "scripts/audit-counts.mjs"
    - "scripts/audit-counts.test.ts"
    - "tests/setup.ts"
    - "FRONTEND_LOGGING.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-177
  title: A generated file stripped the exports that the published types are built from, and the only check that could see it had to be a floor
  date: 2026-10-15
  status: accepted
  context: |
    STD-1 and STD-2 were the last two entries in the CRITICAL - Standards
    section of CODEBASE_FIXES.md, open since March 2026. Both were wrong.
    Reading them to plan the work found the defect that STD-1 was sitting
    on top of without naming it.

    STD-1 SAID components/diagramengine/diagramengine.ts has no export
    keywords and called this the single largest standards violation in the
    repository. The observation was right. The file is GENERATED, and
    scripts/bundle-diagramengine.sh deleted the keywords on purpose with
    `s/^export //g` while concatenating thirty src modules. The stated
    mechanism, that "tsc treats files as scripts", was false here, because
    the script re-added one export and that alone makes the file a module.
    STD-1 also cited MEMORY.md as the source of the convention, and this
    repository has no MEMORY.md.

    THE REAL DEFECT WAS THE PUBLISHED TYPE SURFACE. The strip ran before
    tsc, so the compiler wrote the .d.ts from a source holding one export.
    dist/components/diagramengine/diagramengine.d.ts was 2,169 lines and
    published one usable name. Its signature referenced DiagramEngineOptions
    and DiagramEngineImpl, both present in the same file and neither
    exported, and the trailing `export {}` made the file a module so the
    2,168 other declarations were unreachable. A consumer could call the
    factory and could not name its argument or its result. This is not
    hypothetical: docs/APPS_TEAM_USAGE_GUIDE.md step 3 tells the apps team
    to type-check against the published .d.ts. Breadcrumb publishes 5 names,
    treeview 13, toolbar 31, and the largest component published 1.

    STD-2 SAID twelve files were missing export on their primary classes.
    All ten that exist export their options type, their handle type and
    their factory, and keep only the implementation class private. That is
    the handle pattern working. Doing what STD-2 asked would have published
    an implementation detail, which is what PAT-1 asks us to stop doing, in
    the same document. The count was wrong too: 53 classes are unexported,
    not twelve.
  decision: |
    D1. KEEP THE EXPORT KEYWORDS IN THE GENERATED BUNDLE. The strip bought
    nothing. wrap-iife.sh already removes every export keyword from the
    emitted JS, and build:ts runs it before minify-js.sh, so the browser
    never saw them. bundle-diagramengine.sh now removes import lines only,
    and the single-symbol rescue patch for createDiagramEngine is deleted
    because every export survives concatenation.

    D2. VERIFY BY EMIT, NOT BY SUITE. All 126 .js bundles are byte-identical
    to the versions built before the change. That is the proof a type-only
    change was type-only. A passing suite speaks only for covered paths.

    D3. EXPORT DiagramEngineImpl AS A STOPGAP AND SAY SO. The factory
    returns it, so without the export the return type is unnameable. The
    class is already public at run time as window.DiagramEngine, so this
    publishes nothing that was private. It is still the implementation type
    and not a handle interface. Recorded under PAT-1 rather than called
    finished.

    D4. ADD A FLOORS TABLE TO scripts/audit-counts.mjs. Every count in that
    file is a CEILING on something unwanted. A missing export is an ABSENCE,
    so nothing in the repository could see this defect, and restoring the
    strip is a one-character edit whose only visible effect is a .d.ts
    quietly returning to one export. diagramengineBundleExports fails below
    138. Mutation-proven: with the strip restored it reads 0 and the check
    fails.

    D5. CLOSE STD-2 INTO PAT-1 RATHER THAN DELETING IT. The ten files it
    named are the model, not the problem, and the record of why matters more
    than the entry. Its one real case, a factory returning a private class,
    moves to PAT-1.

    D6. RAISE diagramengineLines A SECOND TIME, 30482 to 30488. Six comment
    lines explaining the exported class. The note left with the first raise
    claimed STD-1 existed to stop this file growing, which was a conflation
    of two unrelated things, and it is corrected in place.
  consequences: |
    + DIAGRAMENGINE PUBLISHES 138 NAMES INSTEAD OF 1, and the repository
      total in docs/AGENT_QUICK_REF.md goes from 1,336 to 1,473. The bundles
      did not move by a byte.
    + THE LAST CRITICAL SECTION IS EMPTY, and both entries closed by being
      disproved rather than by being done.
    + PAT-1 IS MEASURED FOR THE FIRST TIME. scripts/pat-scan.mjs reports 83
      of 130 factories returning an exported class rather than a handle. The
      entry said "some" and is marked MINOR. It is the majority.
    = A RATCHET CANNOT SEE AN ABSENCE. This is the fifth time in this arc
      that a check proved narrower than the behavior it was named for, after
      WIN-1, WIN-2, the any-cast count and the logging fallback. The first
      four were patterns that matched too little. This one was the wrong
      DIRECTION, and no amount of widening a ceiling would have found it.
    = THE DEFECT WAS A TEXT SUBSTITUTION, SO IT COST NO LINES. `s/^export //g`
      rewrites a line and never removes one, which is why diagramengineLines
      sat at 30482 through the whole regression and reported nothing.
    - UNUSED-1 DROPPED 421 TO 414 AND NO FURTHER. The tempting theory, that
      the 110 unused locals in the generated bundle were an artifact of the
      strip, was tested and is mostly false. Only 7 of 79 distinct names were
      exported in src. The rest are real dead locals.
    - THE 83 PAT-1 CASES ARE NOT MECHANICAL. DiagramEngineImpl has 135 public
      methods. Writing a handle interface means deciding which are API, per
      component, which is why the entry has sat open.
  files:
    - "scripts/bundle-diagramengine.sh"
    - "scripts/audit-counts.mjs"
    - "scripts/pat-scan.mjs"
    - "components/diagramengine/src/engine.ts"
    - "components/diagramengine/diagramengine.ts"
    - "docs/AGENT_QUICK_REF.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-178
  title: Trace was declared in 108 components and called in 2, and the gap needed a floor plus a resolver that refused the cases it could not place
  date: 2026-10-15
  status: accepted
  context: |
    LOG-4 recorded that logTrace was declared in 108 components and called
    in 2, latexeditor and visualtableeditor, 10 call sites in all. The
    entry asked for a binary decision: instrument the components with
    high-frequency handlers, or take trace out and remove the dead gates
    with it. The user chose to instrument.

    THE ENTRY SAID 80 AND THE NUMBER IS 83. No single change to the event
    list reproduces 80. The three components that are only reachable
    through a bound method reference, magnifier, graphminimap and ruler,
    are the likely cause, because a scan looking for an inline handler
    body would miss exactly those. 83 minus 3 is 80. That is an
    explanation, not a derivation, and it is recorded as one.

    THE ENTRY ALSO UNDERSTATED THE POPULATION. Its event list omitted
    selectionchange, which richtextinput uses, and it looked only at
    listeners. Eight layout components register no high-frequency listener
    and relayout on every ResizeObserver callback, which during a window
    drag is frame rate. activityfeed does the same through an
    IntersectionObserver.

    NOTHING COULD HAVE CAUGHT ANY OF IT. Every count in audit-counts.mjs
    before STD-1 measured an unwanted thing and held it down. An uncalled
    helper costs nothing and breaks nothing, which is why it survived
    seven months.
  decision: |
    D1. THE SCOPE IS THE 106 THAT DECLARED A SHIM. LOG-4 was defined over
        the components that declared logTrace and never called it. 13
        components do high-frequency work and never declared one. They are
        a real gap and they are not this one, so they are filed as LOG-4a
        and held at 13 by a ceiling. diagramengine is among them and is
        the multi-namespace bundle with a line ratchet, which is a second
        reason not to fold it in here.

    D2. HIGH FREQUENCY MEANS REPEATS WITHIN ONE GESTURE, OR OBSERVES.
        Fourteen DOM events qualify. So do ResizeObserver,
        IntersectionObserver and MutationObserver. A one-shot
        requestAnimationFrame that starts a CSS transition does not, and
        neither does setInterval, which in this repository is a countdown
        tick. bannerbar, codeeditor and gauge turn on that distinction and
        all three lost their shim rather than gained a call. The rule is
        code in scripts/trace-scan.mjs, not prose, because the last count
        described in prose was wrong.

    D3. THE CALL GOES ON THE HANDLER, NOT THE REGISTRATION. 99 of 229
        listener sites attach by reference and the commonest remaining
        shape is a delegating thunk. Inserting at the registration site
        would have missed the first group entirely and instrumented a
        wrapper rather than a handler in the second. The transform worked
        on the TypeScript AST and resolved each listener through
        .bind(this), name aliases and thunks to the function that runs.

    D4. A DELEGATION IS FOLLOWED ONLY WHEN IT IS PROVABLY THE HANDLER.
        Either the wrapper forwards its own event argument, or the callee
        is referenced exactly once in the file. Without the second
        condition the resolver reached helpers whose first parameter was a
        string or a number, and four handlers would have been instrumented
        as input events inside a shared method with other callers. The
        guard caught all four and they were done by hand. 222 of 246 sites
        resolved and the 24 refusals were deliberate.

    D5. THE PAYLOAD IS METADATA AND NEVER CONTENT. Trace runs inside text
        and password fields, and a payload is read by whoever turns the
        flag on. keydown logs a key NAME and only when key.length is
        greater than 1, so a single character reports as "(char)". input
        logs inputType and never the value or its length, because a length
        leaks a password. scroll and resize read nothing from layout,
        since a forced reflow inside a scroll handler is the bug trace
        exists to find. One limit is accepted and written down: a
        surrogate-pair key such as an emoji has length 2 and is logged.

    D6. THE RATCHET IS A FLOOR AND THREE CEILINGS. tracedComponents is the
        second floor in the table, for the same reason as the first: a
        missing logTrace is an absence. untracedHotShims and
        deadTraceShims sit at 0 and hotWithoutTraceShim at 13. All four
        were mutation-proved, and a separate test drives a real mousemove
        through a real Magnifier and asserts the payload is exactly
        { x, y }, because a count cannot tell whether a line reaches a
        console.

    D7. THE COST IS PAID AND NOT HIDDEN. dist/components grew 22,651
        bytes, 0.60 percent, against the on-disk e361179 build. Nothing
        was saved. The branch that saved the 15,485 bytes of LOG-3 gates
        was the branch that deleted trace, and it was not taken.
  consequences: |
    + A DRAG OR A SCROLL NOW PRODUCES TRACE in 96 components rather than
      2, across 268 call sites, with one flag.
    + THE GAP CANNOT REOPEN QUIETLY. Four counts and 23 unit cases hold
      the shape, and removing a single trace call fails two of each.
    + TWELVE DEAD HELPERS ARE GONE, which FRONTEND_LOGGING.md already
      asked for and nothing enforced.
    - BUNDLES ARE 22,651 BYTES LARGER. Trace is not free and the entry
      offered a cheaper branch.
    - THIRTEEN COMPONENTS STILL HAVE NO SHIM, including diagramengine.
      Held at a ceiling, filed as LOG-4a.
    ? LOG-6 WAS FOUND WHILE READING THE GATES. FRONTEND_LOGGING.md
      section 6 promises a runtime console toggle that the fallback branch
      cannot deliver, because 109 components capture the trace flag once
      at script load. It affects debug equally, so it is filed separately
      and section 6 now carries a caveat instead of a false sentence.
  files:
    - "scripts/trace-scan.mjs"
    - "scripts/trace-scan.test.ts"
    - "scripts/audit-counts.mjs"
    - "components/magnifier/magnifier.trace.test.ts"
    - "FRONTEND_LOGGING.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-179
  title: The verbose gates became calls rather than constants, and the reflow that LOG-5 wanted came free with it
  date: 2026-10-15
  status: accepted
  context: |
    FRONTEND_LOGGING.md section 6 told customer support that a flag set in
    a browser console takes effect immediately. That was true on the
    LogUtility branch, where isGlobalFlagSet reads window on every call. It
    was false on the console fallback, where `const _dbg` and `const _trc`
    were evaluated once when the script loaded. The fallback is the branch
    on 132 of the 138 demo pages, so the promise was false where it
    mattered most. LOG-3 had added those gates and read them at load, and
    nothing decided that they should be read there.

    LOG-5 was a separate entry: 531 shim lines over the 120-character limit
    in AGENTS.md, which nothing enforced. Both entries rewrite the same
    five lines in the same 117 files.
  decision: |
    D1. THE GATE IS A CALL, NOT A CAPTURE. `_dbg()` and `_trc()` read
        window on every invocation, in 117 component preambles and in
        components/diagramengine/src/logging.ts, where one copy serves all
        twenty namespaces. The regex is hoisted to a module-level
        LOCAL_HOSTS so the per-call cost is a property read rather than a
        regex construction.

    D2. LOG-5 LANDED IN THE SAME PASS. Reflowing separately would have
        rewritten 610 lines twice. The codemod reflowed exactly 531
        one-liners and the repository count of over-length lines went
        819 to 288, which is the same number from the other direction.

    D3. THE LIMIT IS COUNTED IN COLUMNS, NOT BYTES. `awk 'length > 120'`
        reported 928 against the new check's 819 at one commit. awk counts
        bytes in the C locale and every marker header in this repository
        carries the four-emoji set at three bytes each. The overLengthLines
        ceiling counts characters, and it is the first count in the table
        that measures a style rule rather than a defect.

    D4. THE SEMANTIC DRIFT WAS CLOSED AT THE SAME TIME. driftedHostRule
        compares the host REGEX between the two implementations and cannot
        see how the flag VALUE is read. The two had diverged there: the
        shim tested `=== true` and so ignored a truthy non-boolean that
        isGlobalFlagSet honours, and it sent an explicit null to the host
        rule where isGlobalFlagSet reads it as off. Both now match, and the
        same tri-state table runs against both sides.

    D5. _lu IS STILL RESOLVED ONCE, DELIBERATELY. The user asked for a
        completely dynamic FLAG and that is what this is. Which logging
        back end a component uses is a load-order contract that section 1.2
        documents, not an oversight, and making it dynamic would mean a
        component changing back ends mid-session.

    D6. A TEXT COUNT CANNOT PROVE A TIMING FIX. magnifier.flag.test.ts
        imports the component ONCE and flips the flag afterwards, which is
        the experiment a captured const fails. 9 of its 17 cases fail
        against the old code, which was measured rather than assumed. It
        also asserts window.createLogUtility is absent, because with the
        utility present the component takes the branch that was always
        dynamic and every case would pass while proving nothing.

    D7. THE FLOOR IS FOR THE MUTATION THE CEILING CANNOT SEE.
        ungatedVerboseShims now requires the call form, so reverting a gate
        fails it. It skips a function it cannot find, so a shim DELETED
        with its calls leaves it at zero and reads as success.
        dynamicVerboseShims holds 213 of them, 117 logDebug and 96
        logTrace. The 96 were already covered by tracedComponents. The
        117 were covered by nothing.
  consequences: |
    + THE DOCUMENTED PROMISE IS NOW TRUE ON BOTH BRANCHES. A flag set in a
      live console takes effect from the next log call on any of the 138
      demo pages.
    + THE BUILD GOT SMALLER, by 2,868 bytes. The minifier inlines `_trc()`
      to `window.__ebt_trace_logging && console.debug(...)` and drops the
      declaration, so the dynamic read costs less than the const it
      replaced.
    + 531 OVER-LENGTH LINES ARE GONE and a ceiling holds the remaining 288.
    - 288 OVER-LENGTH LINES REMAIN, 203 of them in two diagramengine files.
      They are ordinary long lines rather than one repeated template, so
      each needs its own judgment.
    - THE DEBUG GATE RE-TESTS THE HOST REGEX when the flag is unset, which
      is the usual production state. It is not memoised, on purpose:
      isGlobalFlagSet re-tests it too and driftedHostRule exists to keep
      the two identical. Debug is lifecycle-frequency, and trace pays
      only a property read.
    ? DOC-1 WAS FOUND BY THE BUILD DIFF ON A GENERATED FILE. The new gate
      declares `const f = window.__ebt_debug_logging;`, and extractGlobals
      in scripts/generate-docs.js treated any `= window...;` as an alias of
      the global object. It had been publishing fourteen CSS property names
      from smarttextinput as callable CDN API, because
      `const style = window.getComputedStyle(el)` reads the same way. Fixed
      with a negative lookahead and a regression case. Keeping generated
      output in the tree is what surfaced it.
  files:
    - "scripts/audit-counts.mjs"
    - "scripts/audit-counts.test.ts"
    - "scripts/generate-docs.js"
    - "scripts/generate-docs.test.ts"
    - "scripts/trace-scan.test.ts"
    - "components/diagramengine/src/logging.ts"
    - "components/logconsole/logconsole.ts"
    - "components/magnifier/magnifier.flag.test.ts"
    - "components/magnifier/magnifier.trace.test.ts"
    - "FRONTEND_LOGGING.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-180
  title: LOG-4a closed the third trace population, and a mutation that failed produced a fourth count
  date: 2026-10-15
  status: accepted
  context: |
    LOG-4 instrumented the components that declared a logTrace shim. 13
    others did high-frequency work and declared none, so they were never in
    scope, and hotWithoutTraceShim held them at 13 so the set could not
    grow. LOG-4a is that set. The entry called diagramengine the awkward
    one, because it is the multi-namespace bundle of FRONTEND_LOGGING.md
    section 1.1 and it carries a line ratchet.
  decision: |
    D1. THE SHIM COPIES THE FILE, NOT THE TEMPLATE. Five distinct preamble
        forms exist across the twelve, from a compact ternary to a
        typeof-guarded if/else, and each new logTrace matches the form
        beside it. What is NOT negotiable is the literal text
        `_trc() && console.`, because countUngatedVerboseShims reads it. A
        gate written as `if (_trc()) { … }` behaves the same and counts as
        ungated.

    D2. THE ENGINE WAS THE SMALLEST OF THE THIRTEEN, NOT THE LARGEST.
        30,524 lines and 5 hot registrations in 2 files. makeLogger already
        returned a trace that nothing destructured, so adding
        `trace: logTrace` to the single destructure in src/logging.ts made
        it reachable from all twenty namespaces. The ratchet took its
        fourth deliberate raise, 30503 to 30524.

    D3. TRACE GOES IN THE LISTENER WHEN THE METHOD HAS OTHER CALLERS.
        dynamicformswitcher's four input listeners delegate to
        onFieldInput, which has twelve callers and eight of them are change
        events. Instrumenting the method would have labelled a change as an
        input. This is the toolbar judgment from ADR-178 a second time, and
        it is the reason the codemod refuses rather than guesses.

    D4. A FIELD NAME IS SCHEMA AND A FIELD VALUE IS CONTENT. Those four
        listeners forward no event, so there is no inputType to read, and
        four lines reading `input handler` would not say which field fired.
        The payload is `{ field: name }`. Where no name is in scope either,
        the payload is empty rather than whatever is nearby: in annotation
        and stickynote the only other thing in scope is the text the user
        typed. Section 4.5 gained a fourth row.

    D5. THE SHIM FORM NOBODY ELSE USES EARNS ITS OWN TEST.
        dynamicformswitcher keeps its logger in `_logger`, builds it in a
        try/catch, and had no trace on its ComponentLogger interface until
        now. dynamicVerboseShims reads shim TEXT and would be satisfied by
        a body that never runs, so the branch is driven through a real
        input event on a real password field. Both mutations fail it: 3 of
        4 cases with the trace calls removed, and 3 of 4 with the gate
        frozen in a const.

    D6. traceCalls EXISTS BECAUSE A MUTATION FAILED TO BE CAUGHT. Deleting
        four of diagramengine's five trace calls moved no count at all.
        tracedComponents counts COMPONENTS, and the fifth call, in
        src/render-engine.ts, kept the file in the traced bucket. A
        30,524-line file can lose almost all of its instrumentation that
        way. The new floor holds the 301 calls themselves, and the mutation
        now fails it.
  consequences: |
    + TRACE REACHES 109 OF 138 COMPONENTS across 301 calls, from 96 and 268.
      Every component that does high-frequency work now has it.
    + hotWithoutTraceShim IS A CEILING OF 0. A new component that does
      high-frequency work and declares no shim fails, rather than being
      absorbed into a baseline.
    + THE PER-CALL GAP IS CLOSED. traceCalls catches the partial deletion
      that a per-component floor cannot see, in any file.
    - THE ENGINE IS NOT IN dynamicVerboseShims. It destructures trace from
      makeLogger rather than declaring `function logTrace`, so there is no
      shim text to count there and its gate is covered only by the copy in
      src/logging.ts that driftedHostRule reads.
    - IF THE ENGINE'S TRACE CALLS ARE EVER REMOVED it is reported as
      hotWithoutShim, which is literally true and still the wrong
      instruction. The fix is to put the calls back, not to add a shim the
      engine does not use. Written into the scanner header beside the same
      note about logconsole.
  files:
    - "scripts/audit-counts.mjs"
    - "scripts/trace-scan.mjs"
    - "components/diagramengine/src/engine.ts"
    - "components/diagramengine/src/logging.ts"
    - "components/diagramengine/src/render-engine.ts"
    - "components/dynamicformswitcher/dynamicformswitcher.ts"
    - "components/dynamicformswitcher/dynamicformswitcher.flag.test.ts"
    - "FRONTEND_LOGGING.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-181
  title: The SRI question was left open and the unpinned URLs underneath it were not
  date: 2026-10-15
  status: accepted
  context: |
    DEBT-SEC-5 asks whether five optional third-party renderers should join
    the vendored SRI closure in dist/lib. Scoping that meant reading every
    place this repository hands a consumer a third-party URL, and the
    reading found a different problem. Eleven jsdelivr URLs in
    documentation and demo pages carried no exact version, so jsdelivr
    resolved them at request time to whatever the project had published
    most recently. One of them was DOMPurify.
  decision: |
    D1. THE VENDORING QUESTION STAYS OPEN AND CARRIES A RECOMMENDATION.
        None of the six is installed, so vendoring means six new
        devDependencies and roughly 6 MB more on the CDN for renderers that
        are optional by design. The recommendation is to publish an SRI
        hash for each recommended build instead, which gives a consumer the
        same protection without this repository owning the upgrade
        treadmill for six projects. That is a decision about what the
        library guarantees, so it is recommended and not taken.

    D2. IT IS SIX AND NOT FIVE. `marked` is probed on window, named in the
        same README table, and not vendored, and it is the only one of the
        six marked Required. It was missed because WIN-2 surfaced this
        entry while looking at globals no declaration of ours can own, and
        marked has one.

    D3. PINNING IS NOT A DECISION AND WAS DONE. Eight URLs had no version
        and two were floating majors. DOMPurify with no version is the
        worst of them, because vendor-closure.mjs says in its own comments
        that a substituted sanitizer becomes the attack. Every replacement
        URL was fetched and checked for a 200 before it was written down.

    D4. ONE OF THEM WAS ALREADY BROKEN.
        `bootstrap@5/css/bootstrap.min.css` returns 404. The setup block in
        components/conversation/README.md has been handing consumers a dead
        stylesheet link. The correct path has `dist/` in it. A pinning
        sweep that fetches what it writes finds this and a search-and-
        replace does not.

    D5. THE CHECK'S OWN FIRST RUN WAS WRONG, IN THE SAFE DIRECTION. It
        reported four correctly pinned `gh/` URLs as floating, because a
        jsdelivr package name is one segment under npm, two when scoped,
        and ALWAYS two under gh, where it carries no leading at-sign.
        Deciding that from the leading character rather than the registry
        reads `gh/highlightjs/cdn-release@11.11.1` as the package
        `highlightjs`. Both forms are now unit cases.

    D6. THE VERSION DRIFT IS A THIRD THING AND IS FILED, NOT SWEPT.
        Documented versions disagree with installed ones for four packages,
        and chart.js is the sharp case: the repository serves a hashed
        4.5.1 at dist/lib while the documentation sends consumers to an
        unhashed 4.4.7. Changing a recommended version is a compatibility
        decision for consumers rather than a lint fix, so each row needs
        its own answer. DEBT-SEC-7.
  consequences: |
    + NO DOCUMENTED THIRD-PARTY URL FLOATS. unpinnedCdnRefs is a ceiling of
      0 over every tracked .md and .html, mutation-proved by putting
      `mermaid@11` back.
    + A BROKEN SETUP BLOCK IS FIXED, found only because the sweep fetched
      what it was about to publish.
    - THE SRI GAP IS UNCHANGED. Six libraries are still loaded by the host
      with no integrity attribute recommended. Pinning makes the target
      stable, which is a precondition for publishing a hash and not a
      substitute for one.
    - DEBT-SEC-7 IS OPEN AND NOT RATCHETED, because the right version for
      each row is a judgment and a count would force all four at once.
  files:
    - "scripts/audit-counts.mjs"
    - "scripts/audit-counts.test.ts"
    - "components/conversation/README.md"
    - "components/markdownrenderer/README.md"
    - "demo/studio/component-studio.html"
    - "demo/studio/layout-studio.html"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-182
  title: The markers were present in prose and absent in shape, and the unratcheted count was stale within a day
  date: 2026-10-15
  status: accepted
  context: |
    MRK-1, MRK-2 and MRK-3 recorded 3 TypeScript files and 4 SCSS files
    missing the COMPONENT marker MARKERS.md requires. UNUSED-1 recorded 414
    unused-local errors and was the one tracked count in this repository
    with no ratchet, because it needs the compiler rather than a scan.
  decision: |
    D1. NONE OF THE SEVEN FILES WAS UNMARKED. Every one carried a comment
        saying what a marker block says. treegrid.ts had a banner reading
        "TreeGrid Component - Phase 1". The two engine files had a
        `/** DiagramEngine — … */` paragraph. All four SCSS files had an
        abbreviated one-liner, `/* ⚓ SymbolPicker — … */`, carrying the
        anchor emoji and not the COMPONENT keyword. The information was
        there and the shape an agent greps for was not, which is the whole
        point of a marker and the reason a count of them is worth keeping.

    D2. THE ENGINE PAIR COST THE LINE RATCHET ITS FIFTH RAISE, five lines,
        30524 to 30529. The three marker counts reach 0 with it, so the
        same change that raises one ceiling closes three others.

    D3. UNUSED-1 IS RATCHETED, AND SHELLING OUT TO tsc IS THE POINT. An
        unused binding is an absence and no text scan can see one, so
        `unusedLocals` runs the compiler and counts TS6133. It costs about
        1.6 seconds, which makes it the slowest check in audit-counts.mjs
        and still the cheapest way to measure the thing.

    D4. THE 414 WAS STALE ON THE DAY IT WAS WRITTEN, AND BY A QUARTER.
        The real figure is 308. 106 of the difference were LOG-4's dead
        `logTrace` declarations, which TS6133 counts like any other unused
        binding. This was measured rather than inferred: a worktree at
        e361179 reports 414 of which 106 name logTrace, and the tree after
        LOG-4 reports 308 of which none do. 414 - 106 = 308 exactly.
  consequences: |
    + ALL THREE MARKER COUNTS ARE 0 and every tracked source and stylesheet
      now carries the block form.
    + EVERY TRACKED COUNT IN THIS REPOSITORY IS NOW RATCHETED. UNUSED-1 was
      the last exception.
    + THE STALENESS IS ON RECORD. A quarter of a tracked count vanished as
      a side effect of unrelated work, on the same day the count was
      re-measured by hand, and nothing noticed. A number that has to be
      re-derived by hand is a memory of a measurement and not a
      measurement.
    - 308 UNUSED BINDINGS REMAIN, 103 of them in the generated
      diagramengine.ts and none elsewhere above 10. The ceiling stops them
      growing and does not remove them.
    - diagramengineLines HAS NOW BEEN RAISED FIVE TIMES. Every raise is
      recorded with its reason and its line count, but five is enough that
      the next one should be argued against rather than recorded.
  files:
    - "scripts/audit-counts.mjs"
    - "components/diagramengine/src/engine.ts"
    - "components/diagramengine/src/types.ts"
    - "components/treegrid/treegrid.ts"
    - "components/diagramengine/diagramengine.scss"
    - "components/fontdropdown/fontdropdown.scss"
    - "components/markdownrenderer/markdownrenderer.scss"
    - "components/symbolpicker/symbolpicker.scss"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-183
  title: The !important count was headed Component SCSS and measured every stylesheet, and the first reclassification broke on Allman braces
  date: 2026-10-15
  status: accepted
  context: |
    The tracker section reads "!important in Component SCSS (113
    occurrences, 20 files)". The ratchet behind it, scssImportant, spans
    every tracked .scss in the repository. IMP-2 and IMP-3 list the
    occurrences they consider justified and ask for the rest to be
    refactored.
  decision: |
    D1. 58 OF THE 113 ARE NOT COMPONENT STYLESHEETS, and 56 of those 58
        are in one file, src/scss/_dark-mode.scss, where beating
        Bootstrap's own specificity is the third-party override
        CODING_STYLE.md permits. The population the section describes is
        55 across 18 files. This is the third time a ratchet in this
        repository has been named for one population and measured another,
        after anyAnnotations and WIN-1.

    D2. BOTH COUNTS ARE KEPT. scssImportant stops the total growing
        anywhere, including in the core stylesheets. scssImportantComponents
        is the one IMP-1 is measured against and the one that should fall.

    D3. ONE OF THE 113 IS THE WORD INSIDE A COMMENT and 112 are real. It is
        left in rather than parsed out, because SCSS block comments need a
        real scanner and the error is one occurrence in a known place.
        Written down so it is not rediscovered as a defect.

    D4. THE FIRST RECLASSIFICATION WAS WRONG AND ALLMAN BRACES ARE WHY.
        It reported 8 declarations inside a prefers-reduced-motion block
        and 32 unjustified. The scanner took the nesting depth from the
        line matching prefers-reduced-motion, but this repository puts the
        opening brace on the NEXT line, so depth had not risen yet and the
        block closed itself immediately. Three whole files of accessibility
        overrides read as unjustified. The real split is 11 reduced-motion,
        14 commented, 29 neither. Every brace-counting scan over this
        codebase has the same trap in it.

    D5. IMP-3 NAMED A FILE THAT DOES NOT EXIST.
        components/graphcanvasmx/graphcanvasmx.scss is not in the tree. A
        count cannot surface that, because occurrences in an absent file
        are zero and zero reads as clean. The list was also short by three
        real files: contextmenu, dynamicformswitcher and toast all carry
        reduced-motion overrides and none was listed.

    D6. THE 29 ARE NOT REFACTORED HERE. Removing an !important changes
        specificity and specificity changes are visual. This repository
        keeps a visual-regression suite and measured contrast adjacencies
        for that reason, so the work belongs with a visual check rather
        than beside a logging change.
  consequences: |
    + THE TARGET IS EXACT AND SMALLER. 29 declarations in 8 files, named by
      line, against a headline that said 113.
    + THE COUNT NOW MATCHES ITS OWN HEADING, and the wide count still
      guards the core stylesheets it was accidentally covering.
    + IMP-3 CLOSES at 11 verified accessibility overrides.
    - 29 DECLARATIONS REMAIN and they need a visual check to remove, which
      is why this entry stays open with a precise target rather than being
      swept.
    ? THE ALLMAN-BRACE TRAP IS GENERAL. Any future scan here that tracks
      nesting by counting braces per line must wait for the opening brace
      rather than assume it sits on the line that introduced the block.
  files:
    - "scripts/audit-counts.mjs"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-184
  title: Ten SpineMap adapters answered a missing picker with a text input, and three of them discarded every keystroke
  date: 2026-10-16
  status: accepted
  context: |
    The repository owner restated a standing instruction: do not write
    fallback code, and when something is broken let it break. The
    instruction arrived while DEBT-ERR-2 was waiting on the opposite
    recommendation, which was to let ErrorDialog degrade rather than throw.
    AGENTS.md already carried "No Fabricated Reads", which governs what a
    broken component may ANSWER. It did not govern whether a broken
    component may CONTINUE.
  decision: |
    D1. THE RULE IS WRITTEN DOWN. AGENTS.md gains "No Fallback Code" as a
        CRITICAL section. The owner reported having given the instruction
        many times, which is evidence that an unwritten rule does not
        survive a session boundary. It is also saved as a durable memory.

    D2. DEBT-ERR-2 CLOSES WITH NO CODE CHANGE. ErrorDialog already threw.
        The entry was open only because the question "should it degrade
        instead" had been asked. The question was wrong, so the entry
        closes rather than being decided.

    D3. THE PRECEDENT CITED IN THAT ENTRY WAS BACKWARDS. It named Toolbar
        and MarkdownEditor as components that degrade, and read that as
        support for degrading. They are not precedent, they are debt, and
        they are now tracked as FALLBACK-2.

    D4. TEN SPINEMAP ADAPTERS ARE THE REAL INSTANCE. Each assigned
        this.instance = { getValue: () => inp.value } from a fallback()
        that mounted a bare text input. StandardComponentAdapter serves
        nine field types by itself, so the reach was wide.

    D5. THREE OF THE TEN WERE WORSE THAN DEGRADED. multiselectcombo,
        tagger and peoplepicker read through getSelected() and getTags(),
        while the stand-in supplied getValue() only. The type system could
        not see it because the instance is Record<string, Function>. Those
        three discarded every keystroke and answered "" or []. This is the
        clearest evidence for the owner's instruction found in the sweep,
        and it was found by reading the adapters rather than by any gate.

    D6. RESOLUTION IS SHARED, NOT REPEATED TEN TIMES. Four helpers carry
        it: requireLibraryFactory, libraryBuildFailed, mountFactoryWidget
        and readWidgetValue. The rule is then stated once.

    D7. THE WIDGET IS RESOLVED BEFORE THE DOM IS TOUCHED, so a refused
        mount leaves no half-built widget behind in the popover.

    D8. THE ORIGINAL ERROR SURVIVES. Every bare catch is replaced by a
        rethrow carrying cause. The property is assigned rather than passed
        as ErrorOptions, because this build targets ES2020 and the second
        Error argument does not typecheck there.

    D9. THE GATE GAINED THE FOURTH SHAPE. check-fabricated-reads.mjs
        anchored every probe on a return inside a lexical failure context.
        These were assignments, and the failure branch was in the CALLER,
        so all ten walked past it. The check now also flags an assignment
        of a read-bearing object literal inside a failure branch or inside
        a function whose name admits it is a stand-in.

    D10. THE MUTATION PROOF IS REPORTED AS 9 OF 10, NOT 10 OF 10. Run
        against the shipped file the extended gate catches nine.
        SymbolPicker escapes, because it fabricated through this.selected
        rather than through an object literal. Reporting ten would have
        overstated the ratchet.

    D11. NO WINDOW CAST WAS ADDED. The first helper used
        `window as unknown as Record<string, unknown>` and moved three
        ratchets at once: windowCasts 6 to 7, windowAliasDecls 1 to 2 and
        windowAliasUses 1 to 4. WIN-2 had driven those down deliberately.
        All nine globals are declared in components/globals.d.ts, so the
        parameter is typed `keyof Window | ""` and the global reads
        directly.

    D12. FALLBACK-2 IS LISTED AND LEFT. Eight surviving fallbacks are
        recorded by file and line. Each changes what a host sees when a
        dependency is absent, so they are a decision for the owner rather
        than a sweep to be done in the same commit.
  consequences: |
    + A MISSING PICKER NOW FAILS LOUDLY, naming the global and what to
      load, instead of mounting a text box that looks like a picker.
    + THREE FIELD TYPES STOP DISCARDING USER INPUT. That was a live bug in
      the shipped bundle, not a theoretical one.
    + THE FAILURE IS DEBUGGABLE. A construction error keeps its cause.
    + THE GATE SEES A SHAPE IT COULD NOT SEE, and the extension found no
      false positive across 137 sources.
    + 383 LINES DELETED AGAINST 183 ADDED.
    - THIS IS A BREAKING CHANGE FOR ANY HOST that relied on the text-input
      behaviour. A host that loads spinemap.js without the picker bundles
      now gets a thrown error where it previously got an editable field.
      That is the intended behaviour and it needs the CDN integration guide
      to say so.
    - SYMBOLPICKER'S SHAPE STILL ESCAPES CHECK [16]. A fallback that
      fabricates through a field is not yet gated.
    ? THE OTHER EIGHT FALLBACKS ARE UNDECIDED, and the clipboard pair may
      be a genuine capability difference rather than a missing dependency.
  files:
    - "components/spinemap/spinemap.ts"
    - "components/spinemap/spinemap.nofallback.test.ts"
    - "scripts/check-fabricated-reads.mjs"
    - "AGENTS.md"
    - "CODEBASE_FIXES.md"
    - "AGENT_INSIGHTS.md"
    - "TESTING.md"
    - "CHANGELOG.md"
    - "agentknowledge/decisions.yaml"
    - "agentknowledge/history.jsonl"

- id: ADR-185
  title: The full fallback review, where fail-fast exposed four live data-losing defects and cleared eight false positives
  date: 2026-10-16
  status: accepted
  context: |
    After FALLBACK-1 the owner asked for every fallback in the library to
    be reviewed, with fail-fast as the rule, "so it exposes real issues
    faster". The provisional list from the FALLBACK-1 sweep named eleven
    items. That list was both too long and too short.
  decision: |
    D1. EVERY CATCH WAS CLASSIFIED, not grepped. A brace-matching pass
        that strips comments first found 7 rethrows, 149 that log and
        continue, and 61 silent. The first run said 71 silent and was
        wrong: it matched `catch {` inside a comment written minutes
        earlier. A scan over source that includes its own prose is
        measuring the wrong text.

    D2. FAIL-FAST DID WHAT THE OWNER SAID IT WOULD. Four defects were
        live and losing data, and none had a failing test:
        formdialog discarded unsaved edits whenever showConfirmDialog was
        absent, spinemap presented a corrupt stored value as an empty
        field and then overwrote it, markdowneditor rendered raw markdown
        and called fireDisplayReady, and both copy buttons showed a
        success tick without reading execCommand's boolean return.

    D3. THE DEMOS WERE THE PROOF. demo/components/formdialog.html loaded
        formdialog.js and not confirmdialog.js, so its unsaved-changes
        prompt had never once fired. demo/components/spinemap.html
        configured two pickers and loaded neither bundle. Both pages
        looked correct because the fallbacks drew something plausible.

    D4. TOOLBAR'S OWN SUITE WAS THE SAME STORY. It never loaded
        Bootstrap, so every tooltip across 22 passing tests had silently
        never initialised. The tests now stub Tooltip. The component
        staying quiet was what let the suite pass.

    D5. EIGHT ITEMS WERE CLEARED, and the reasons are recorded. The
        distinction that did the work: probing several APIs of ONE
        dependency is normalisation, substituting for a MISSING
        dependency is a fallback. guidedtour's getDriverJs,
        markdowneditor's getHTML path and diagramengine's
        show/render/getElement probing are all the former. sidebar
        returning 0 is an honest empty read, chartpanel's is a
        default-parameter API, and timezonepicker's "--:--:--"
        announces itself.

    D6. A DEMAND IS SCOPED TO THE FEATURE, NOT THE COMPONENT. Toolbar
        counts tooltip triggers before requiring Bootstrap. Requiring it
        from a toolbar that asked for no tooltips would be a different
        bug. In practice every toolbar with tools does require it,
        because buildTool marks every button as a trigger, and that is
        recorded as FALLBACK-9 rather than hidden by the fix.

    D7. TEARDOWN COLLECTS RATHER THAN SWALLOWS. spinemap's nine adapter
        destroys and toolbar's tooltip disposal both ran under
        `catch { }`. Throwing from inside the loop would strand the
        teardown of everything after the failure, so the loops collect
        and report after the last one, with the first failure as cause.
        Each adapter also clears its instance BEFORE calling the widget.

    D8. RIBBONBUILDER WAS DELIBERATELY NOT DONE. Its icon picker falls
        back to a whole second curated picker, and an eager
        initSymbolPicker makes that path unreachable the moment a throw
        is added, so removing the fallback means deleting a working
        feature. That is the owner's call, not a hygiene fix.

    D9. THE TIMELINE LIST IS THE SHARPEST SMALL ONE. Eighteen curated
        zones were returned as the IANA set, so a user searching for
        their own zone was told it does not exist. A short wrong answer
        is worse than no answer.
  consequences: |
    + FOUR LIVE DATA-LOSING DEFECTS ARE FIXED, each found by applying the
      rule rather than by a bug report.
    + TWO DEMO PAGES THAT HAD NEVER WORKED now load what they configure.
    + THE REVIEW IS WRITTEN DOWN WITH ITS NEGATIVES, so the eight cleared
      items do not get re-litigated every sweep.
    + SIX COMMITS, one per family, each with its own revert boundary.
    - BREAKING FOR CONSUMERS IN SEVEN PLACES. A host that relied on any
      removed fallback now gets a thrown error naming what to load.
    - THE DIAGRAMENGINE CEILING ROSE TWICE in one session, 30529 to
      30551 to 30562, both recorded in the raise log.
    ? THREE FINDINGS ARE OPEN AS FALLBACK-9, and the ribbonbuilder one
      needs a product decision before any code moves.
  files:
    - "components/formdialog/formdialog.ts"
    - "components/spinemap/spinemap.ts"
    - "components/markdowneditor/markdowneditor.ts"
    - "components/toolbar/toolbar.ts"
    - "components/guidedtour/guidedtour.ts"
    - "components/errordialog/errordialog.ts"
    - "components/codeeditor/codeeditor.ts"
    - "components/graphcanvas/graphcanvas.ts"
    - "components/timeline/timeline.ts"
    - "components/diagramengine/src/render-engine.ts"
    - "components/diagramengine/src/engine.ts"
    - "scripts/audit-counts.mjs"
    - "CODEBASE_FIXES.md"
    - "CHANGELOG.md"

- id: ADR-186
  title: RibbonBuilder's second curated icon picker is deleted, and the icon button refuses at the point of use
  date: 2026-10-16
  status: accepted
  context: |
    ADR-185 D8 left this one open because removing the fallback deletes a
    working feature, which is a product call. The owner answered it:
    "Yes to FALLBACK-9. No fallbacks. Period."

    The fallback was a whole second picker. When createSymbolPicker was
    absent, the icon field opened a grid of 176 hand-listed Bootstrap
    Icons in eight categories, with its own search box and category bar.
    A designer who searched for anything outside that list was told
    "No icons found", which reads as "this icon does not exist" rather
    than "this picker only knows 176 of them".
  decision: |
    D1. THE CURATED PICKER IS DELETED. ICON_CATEGORIES, getAllIcons,
        buildIconPickerHeader, buildCategoryBar, buildIconPickerGrid,
        createIconCell, the iconPickerEl field and its eight stylesheet
        rules are gone. 334 lines out, 30 in.

    D2. THE REFUSAL IS AT THE POINT OF USE, NOT AT MOUNT. initSymbolPicker
        runs from show(), so throwing there would stop a builder from
        mounting over a picker its user may never open. showIconPicker
        throws instead, naming createSymbolPicker and the bundle. A
        ribbon with no icon field never reaches it.

    D3. A PRESENT-BUT-FAILING FACTORY NO LONGER HIDES. initSymbolPicker
        wrapped the factory call in `catch { logWarn; hide the host }`.
        Left alone, the later throw would have said "is not defined"
        about a factory that is defined and broken, which is a lie about
        the actual failure. The catch is gone.

    D4. THE TWO TEARDOWN SWALLOWS WENT WITH IT. deactivateIconPicker and
        destroySymbolPicker both ran `try { ... } catch { logWarn }`,
        the pattern replaced in spinemap's ten destroys under ADR-185 D7.
        destroySymbolPicker now clears its field before calling the
        widget, so a throwing destroy cannot leave a half-dead instance.

    D5. THE SECTION NUMBER GAP IS DELIBERATE. S3 was the curated icon
        data and the file now runs S1, S2, S4. Section numbers are cited
        from CODEBASE_FIXES and the insight log, so renumbering would
        invalidate references to buy tidiness.
  consequences: |
    + A DESIGNER NOW SEES EVERY ICON OR AN ERROR, never a short list
      presented as the whole set. This is the timeline defect of ADR-185
      D9 in a second place.
    + MOUNTING STILL WORKS WITHOUT THE BUNDLE, so the refusal costs
      nothing to a consumer who never opens the picker.
    + 334 LINES OF UI CODE AND EIGHT SCSS RULES LEFT THE TREE.
      unusedLocals fell 308 to 306 and the baseline is tightened.
    - BREAKING. A host that mounts RibbonBuilder without symbolpicker.js
      and clicks the icon button now gets a thrown error. Every demo in
      the tree already loads the bundle.
    ? THE THROW LIVES IN A CLICK LISTENER, which jsdom does not propagate
      to the caller of click(). The test captures it from the window
      error event, because an uncaught listener error fails a Vitest run
      with every test green. That is the 4cbea9e failure class.
  files:
    - "components/ribbonbuilder/ribbonbuilder.ts"
    - "components/ribbonbuilder/ribbonbuilder.scss"
    - "components/ribbonbuilder/ribbonbuilder.manifest.ts"
    - "components/ribbonbuilder/ribbonbuilder.nofallback.test.ts"
    - "scripts/audit-counts.mjs"
    - "docs/CDN_INTEGRATION_GUIDE.md"

- id: ADR-187
  title: A diagram embed that cannot mount throws, and a render()-only embed carries its own content
  date: 2026-10-16
  status: accepted
  context: |
    FALLBACK-9 item 2 recorded one defect: tryRenderFallback passed the
    literal string "**Embedded content**" to render(). Writing the test
    for it exposed that the refusal could never be seen. invokeFactory
    wrapped the whole mount chain in a catch that logged and drew a
    placeholder, so the new throw was swallowed by the fallback two
    functions above it. The two could not be separated.

    MarkdownRendererHandle is `{ render, toHtml }`. It has no show() and
    no getElement(), so every markdownrenderer embed on every diagram
    went down the render() path and showed those two words.
  decision: |
    D1. RENDER() GETS options.content, OR NOTHING MOUNTS. A render()-only
        component holds no content, so the embed definition is the only
        source. The key is named rather than probed, and a value that is
        not a string throws naming it. An empty string is accepted,
        because empty is an answer, the same exemption refuseRawValue
        makes for a field the user cleared.

    D2. A MISSING FACTORY THROWS. It used to draw a dashed grey box with
        a puzzle icon and the component name. That reads as a deliberate
        part of the diagram, which is worse than an empty space: a broken
        embed looked designed and nobody went looking.

    D3. A THROWING FACTORY PROPAGATES. invokeFactory still logs, and then
        rethrows rather than drawing the same box.

    D4. THE BLAST RADIUS IS ONE EMBED. instantiateEmbed runs from a
        requestAnimationFrame callback, so the throw does not reach the
        renderer and the rest of the diagram still draws. The error
        surfaces as an uncaught one on window, which is loud in a console
        and catchable by a reporter.

    D5. THE EXISTING TEST WAS NAMED FOR THE FALLBACK. "addObject with
        embed renders placeholder when factory missing" asserted only
        that a foreignObject exists, which stays true either way. It now
        waits two frames and asserts the refusal, so it cannot pass for
        the wrong reason.
  consequences: |
    + EVERY MARKDOWNRENDERER EMBED EVER PLACED ON A DIAGRAM was showing
      "Embedded content" instead of its author's text. That is the third
      defect of this shape, after the timeline zones and markdowneditor
      display mode.
    + diagramengineLines FELL 30562 TO 30522, its largest fall and the
      first the raise log records. It fell twice before, after LOG-2 and
      WIN-1, both written up as re-measurements of other work. This one
      is deliberate, so it is recorded as carefully as a raise. The
      commit message on 38f2a44 says "for the first time" and overstates
      it.
    - BREAKING. A diagram whose embed bundle is absent now reports an
      uncaught error per embed instead of drawing a box.
    ? THE REFUSAL ARRIVES OUT OF BAND. A consumer who wants it in-band
      has no hook, because the mount is deferred by design so the
      foreignObject is in the DOM first.
  files:
    - "components/diagramengine/src/render-engine.ts"
    - "components/diagramengine/diagramengine.ts"
    - "components/diagramengine/diagramengine.nofallback.test.ts"
    - "components/diagramengine/diagramengine-core.test.ts"
    - "scripts/audit-counts.mjs"
    - "docs/CDN_INTEGRATION_GUIDE.md"

- id: ADR-188
  title: A toolbar item that omits its required tooltip throws, rather than the component tolerating a contract it declares
  date: 2026-10-16
  status: accepted
  context: |
    FALLBACK-9 item 3 was recorded as a dependency-width problem: toolbar
    sets data-bs-toggle="tooltip" on every tool button whether or not a
    tooltip was given, so any toolbar with tools needs Bootstrap. The
    recorded fix was to make the attribute conditional.

    That fix was wrong under the rule the owner reaffirmed. ToolItem,
    SplitButtonItem and GalleryItem all declare `tooltip: string`, each
    with the comment "Required for accessibility". Making the component
    cope with a missing one builds tolerance for a violated contract,
    which is a fallback wearing a narrowing costume.
  decision: |
    D1. THE TOOLTIP IS REQUIRED, SO A MISSING ONE THROWS. requireTooltip
        runs at the top of buildToolButton, buildSplitButton and
        buildGalleryControl, and names the kind and the id.

    D2. WHITESPACE IS ABSENCE. A tooltip of spaces names nothing, so it
        is treated as missing rather than set.

    D3. THE DEPENDENCY QUESTION ANSWERS ITSELF. Every tool now has a
        tooltip, so every tool is a trigger, so a toolbar with tools
        needs Bootstrap. That is what the FALLBACK-5 throw in
        initTooltips already said, and the two now agree.

    D4. THE OPTIONAL ONES STAY OPTIONAL. Inputs, dropdowns, labels,
        checkboxes, switches, numbers and colour pickers declare
        `tooltip?` and carry their own visible label, so
        applyItemTooltip's `if (tooltip)` is a real optional field and
        not a fallback. It is untouched.

    D5. THE OLD TEST COMMENT WAS THE RECORD OF THE DEFECT. The
        FALLBACK-5 test explained that a toolbar with tools always needs
        Bootstrap "because buildTool sets data-bs-toggle on every button
        whether or not a tooltip was given". That sentence is now false
        and is rewritten, rather than left to mislead the next reader.
  consequences: |
    + AN ICON-ONLY BUTTON CAN NO LONGER BE ANNOUNCED AS "undefined".
      This is the only accessibility defect the sweep found.
    + THE RECORDED FIX IS CORRECTED IN PLACE in CODEBASE_FIXES, so the
      next sweep does not implement the wrong one.
    - BREAKING FOR JAVASCRIPT HOSTS that omitted a tooltip. TypeScript
      hosts were already failing to compile.
    ? ONE DEMO WAS BROKEN BY THE CHANGE AND FIXED: the Toolbar preview in
      component-studio declared three tools with no tooltips.
  files:
    - "components/toolbar/toolbar.ts"
    - "components/toolbar/toolbar.nofallback.test.ts"
    - "demo/studio/component-studio.html"
    - "docs/CDN_INTEGRATION_GUIDE.md"
- id: ADR-189
  title: The six libraries this repository recommends but does not serve get a published SRI hash, not a vendored copy
  date: 2026-10-17
  status: accepted
  context: |
    DEBT-SEC-5 asked whether the dist/lib integrity guarantee should cover
    six third-party libraries that are read from window, named with a CDN
    URL in the documentation, and served by jsdelivr rather than by this
    origin. The entry already carried a recommendation and had left it
    untaken since 2026-10-15. The owner took it on 2026-10-17.

    Vendoring the six would mean six new devDependencies and roughly 6 MB
    more on the CDN, for renderers that are optional by design. It would
    also put this repository on the upgrade treadmill for six projects it
    does not own.

    The entry said six. The published surface is larger. Fourteen distinct
    third-party libraries are recommended across four registries, and
    several are named at two different versions in different files.
  decision: |
    D1. HASH, DO NOT VENDOR. scripts/third-party-sri.json records the
        version, URL, sha384 hash, byte count and closure of each build.
        scripts/sri-manifest.mjs publishes it to dist/third-party-sri.json
        and consumers paste tags that already carry the hash.

    D2. THE HASHES ARE RECORDED, NOT COMPUTED AT BUILD TIME. Fetching nine
        URLs inside the build gate would make CI depend on a third party
        being reachable. A versioned jsdelivr URL is immutable, so the
        hash of a pinned build does not drift. `npm run sri:verify`
        refetches and diffs, and it is deliberately outside the gate.

    D3. KATEX UNIFIES ON 0.16.22. It was named at 0.16.21 in four files
        and 0.16.22 in two, with docs/COMPONENT_REFERENCE.md carrying
        both. A recommended-version change is a compatibility decision
        under DEBT-SEC-7, so it is recorded here rather than left to read
        as cleanup. It is a patch bump inside one minor, and the newer
        number was already what markdownrenderer named.

    D4. CODEMIRROR 6 IS RECORDED AS UNHASHABLE, WITH THE REASON. An
        integrity attribute attaches to a script tag and cannot attach to
        an import specifier inside a module, which scripts/vendor-closure.mjs
        states in its own header. CodeEditor documents fifteen bare ESM
        imports, so SRI is structurally unavailable and not merely absent.

    D5. THE RATCHET IS THREE COUNTS, NOT ONE. tagsMissingSri is a ceiling
        of zero over tags pointing at a recorded build. thirdPartyTagsWithoutSri
        is a ceiling of 76 over every third-party tag with no integrity at
        all. It is the only one of the three that can see a library
        nobody has decided about. countUnpinnedCdnRefs widens from one registry to
        four.

    D6. CROSSORIGIN IS PART OF THE CHECK, NOT STYLE. Without it the
        browser makes an opaque request, cannot read the body to hash it,
        and skips the integrity check rather than failing it. A hash with
        no crossorigin is the most convincing way to have no protection.
  consequences: |
    A consumer who pastes the documented tags gets a verified build. A
    substituted file fails the check, the browser refuses it, the global
    is absent, and the component that needs it throws. SRI is the
    no-fallback rule applied at the network boundary, which is the one
    boundary a runtime check in this repository cannot reach.

    unpinnedCdnRefs moved from 0 to 77, and the 77 is not a regression.
    The previous predicate matched cdn.jsdelivr.net alone. Fourteen
    esm.sh specifiers floating at major @6, and eight unpkg paths with
    no version, were never inside it. DEBT-SEC-6 closed as "held at 0" and
    that zero was partly vacuous. Same family as DEBT-GATE-1, where three
    checks passed because grep aborted, and DEBT-DUI-5, where a
    measurement used the wrong predicate.

    All 77 are CodeMirror, which is also the one library that cannot be
    hashed. The unpinned surface and the unhashable surface are the same
    library. Pinning the fifteen is a separate decision, because they
    have to interoperate at the versions chosen.

    Eight libraries remain unhashed and are recorded as DEBT-SEC-8, each
    needing a version or registry answer rather than a lint pass.
    DOMPurify leads that list. This repository vendors 3.4.16 with a
    hash and calls it the highest-value asset to remove third-party
    trust from. Eight references across seven files still send consumers
    to an unhashed 3.2.4 on unpkg, and two more to an unhashed 3.4.16 on
    jsdelivr. Nothing outside the integration guide points at the
    verified copy already served.

    A CEILING CANNOT SEE A PREDICATE NARROWING. Reverting the registry
    widening takes unpinnedCdnRefs from 77 to 0 and thirdPartyTagsWithoutSri
    from 76 to 28, and both read as improvement. Three unit cases catch
    it, which is why the registries are pinned in tests and not only in a
    baseline.

- id: ADR-190
  title: Documentation points at the vendored copy when this origin already serves the library
  date: 2026-10-17
  status: accepted
  context: |
    DEBT-SEC-8 listed eight libraries recommended without an integrity
    hash, and read as eight separate version or registry questions. It
    was wrong about four of them.

    dist/lib-manifest.json serves seven assets, not the four ADR-149
    recorded: dompurify, maxgraph, signalr, cytoscape, chart.js, vditor
    and font-awesome. Nobody widened the entry when the manifest grew.
    So dompurify, vditor, chart.js and font-awesome are not awaiting a
    decision. Each is already vendored, hashed and served from /lib/,
    while the documentation sends consumers to a public CDN, and in
    three of the four cases to an OLDER version.

    DOMPurify was the sharpest case. scripts/vendor-closure.mjs names it
    as the highest-value asset to remove third-party trust from, because
    a substituted sanitizer becomes the attack. This origin serves
    3.4.16. Eight references across seven files sent consumers to 3.2.4
    on unpkg, which docs/CDN_INTEGRATION_GUIDE.md itself records as
    carrying 19 open advisories including cross-site-scripting bypasses.
    The guide warned readers off the version seven other files handed
    them.
  decision: |
    D1. WHEN THIS ORIGIN SERVES IT, THE DOCUMENTATION POINTS HERE. Not at
        a public CDN with a transcribed third-party hash. The bytes are
        already under custody and structure check [10] already re-pairs
        them with their published hash every run.

    D2. THE HASH IS TRANSCRIBED INTO THE SNIPPET, NOT PLACEHOLDERED.
        docs/CDN_INTEGRATION_GUIDE.md uses a placeholder because it
        teaches reading the manifest at runtime. A component README is a
        copy-paste snippet, so it carries the literal hash and
        crossorigin="anonymous". The URL is immutable, so the pair
        cannot go stale, and a wrong hash fails loudly in the browser.

    D3. HOST IS static.knobby.io. It is the only host that appears in a
        documented /lib/ URL, and it is what CDN_CONTRACT.md and the
        integration guide already use. The workers.dev name appears 66
        times in the documentation but never for /lib/.

    D4. DEMO PAGES USE THE RELATIVE PATH, WITH NO INTEGRITY ATTRIBUTE.
        scripts/copy-docs.sh rewrites ../../dist/ to ../../ on deploy, so
        ../../dist/lib/dompurify-3.4.16.js resolves to /lib/... on the
        CDN and to the local build in a checkout. Same origin, so SRI
        would add nothing, and every other tag on those pages is already
        a relative path.

    D5. SCOPE WAS DOMPURIFY AND FONT-AWESOME ONLY. vditor and chart.js
        are the same defect and the same one-line fix, found during this
        change rather than approved before it. Finding that a fix is
        cheaper than recorded is not authority to widen the change.
        chart.js has been offered three times without an answer.

    D6. MATHLIVE WAS DROPPED FROM THE SLICE. It was listed as hashable in
        one line. The documented URL 404s: version 0.107.3 was never
        published, and the asset sits at the package root rather than
        under dist/. Picking a real version is a decision about an
        untested optional integration.

    D7. THE PAIRING IS ASSERTED IN BOTH DIRECTIONS. thirdPartyTagsWithoutSri
        counts tags carrying no integrity at all, so it is blind to a tag
        carrying the WRONG one. scripts/check-closure.mjs now also
        asserts that a tag bearing a published hash points at the URL
        that hash was computed from.
  consequences: |
    Eleven tags across eight files now resolve to bytes this repository
    builds, hashes and serves. thirdPartyTagsWithoutSri drops from 76 to
    65 and the ceiling moves with it.

    A CEILING ON ATTRIBUTE PRESENCE CANNOT SEE ATTRIBUTE CORRECTNESS.
    Repointing a fixed tag back to unpkg while leaving its hash attached
    left the count unchanged at 65, because the tag still has an
    integrity attribute. The browser would reject it, which is correct,
    but no gate here saw it. That is what D7 closes, and both directions
    are mutation-proved.

    The fixed tags now carry a static.knobby.io host, which is outside
    CDN_HOSTS in scripts/audit-counts.mjs. The audit no longer sees
    them at all. That is right for own-origin assets and is why the new
    assertion lives in the closure gate, which already reads the
    manifest, rather than in the audit, which does not.

    A LIBRARY CAN BE VENDORED AND STILL BE UNDOCUMENTED AS VENDORED. The
    gap here was never the hash. It was that lib-manifest.json grew from
    four assets to seven and no document followed. The remaining two,
    vditor at fifteen references and chart.js at two, are the same gap
    and sit one yes away.

- id: ADR-191
  title: The rest of DEBT-SEC-8's vendored rows, and MathLive pinned at 0.111.1
  date: 2026-10-17
  status: accepted
  context: |
    ADR-190 fixed two of the four rows where this origin already serves the
    library. The owner approved the remaining two, vditor and chart.js, and
    chose 0.111.1 for MathLive.

    MathLive was the one row needing a real answer. The documented URL,
    mathlive@0.107.3/dist/mathlive.min.js, returns 52 bytes saying the
    release does not exist. That version was never published, the 0.107
    line stops at 0.107.1, and the asset sits at the package root rather
    than under dist/. The URL was wrong twice over and had never resolved.
  decision: |
    D1. MATHLIVE IS PINNED AT 0.111.1 AND HASHED WHERE IT STANDS. This
        origin does not serve it, so it joins scripts/third-party-sri.json
        beside marked and katex rather than lib-manifest.json. The
        component needs only the <math-field> custom element, which every
        published version registers, and there is no installed version to
        match, so a superseded line had no API argument behind it.

    D2. MATHLIVE'S FONTS ARE A STATED RESIDUAL, NOT A GAP. MathfieldElement
        reads fontsDirectory relative to the script URL and fetches font
        files that cannot carry an integrity attribute. The closure field
        says so, in the same words katex-css uses for its 60 @font-face
        files. A substituted font renders wrong glyphs and does not run.

    D3. VDITOR'S ENTRY IS HASHED AND ITS TREE IS NOT, AND THE README NOW
        SAYS WHY. vditor lazily injects its markdown engine, icon set,
        language pack and optional renderers, defaulting to a hardcoded
        unpkg URL. MarkdownEditor already overrides that with vditor's cdn
        option, resolved from the src of its own script tag. A consumer who
        self-hosts the component therefore makes vditor look under THEIR
        origin for /lib/vditor-3.11.2/. That is now stated rather than
        discovered.

    D4. VDITOR'S index.css CARRIES NO HASH. It is served from /lib/ but is
        not in lib-manifest.json, so there is nothing to transcribe.
        Computing one here would be a hash with no custody behind it,
        which is what the manifest exists to prevent. Recorded as residue.

    D5. CHARTPANEL OFFERS THE HASHED VERSIONED URL FIRST. The unversioned
        /vendor/chart.js/ copy stays as a second option, labelled as the
        same 4.5.1 bytes at a path that carries no version and therefore
        cannot be hashed.
  consequences: |
    Thirty more references moved. thirdPartyTagsWithoutSri falls 65 to 35,
    and the pairing gate in scripts/check-closure.mjs went from 9 inspected
    tags to 21. Four mutations run against the new tags, all caught: a
    vditor stylesheet reverted to unpkg moved the ceiling, a vditor script
    and a chart.js script reverted with their hashes left attached were
    caught by the pairing gate, and crossorigin stripped from the MathLive
    tag moved tagsMissingSri to 1.

    DEBT-SEC-7's chart.js row closes with this. bootstrap and
    bootstrap-icons stay open there, because this origin does not serve
    them and the version choice is a real compatibility decision.

    THE REMAINING 35 ARE MOSTLY NOT FIXABLE BY A SWEEP. Ten sit in dated
    specs/*.prd.md planning documents that are a historical record. The
    live remainder is driver.js, which needs one version picked, and
    bootstrap with bootstrap-icons, which are DEBT-SEC-7.

    components/conversation/README.md documents vditor's script and not
    its stylesheet. Found while fixing the script tag and left alone,
    because adding a missing dependency to a quick-start block is a
    different change from repointing an existing one.

- id: ADR-192
  title: ERR-1's census is taken by calling every factory, and its ceiling lives in a test
  date: 2026-10-17
  status: accepted
  context: |
    ERR-1 said "10 of 15 sampled factory functions have no container or
    option validation", citing LITERATE_ERRORS.md. Three of those four
    claims were wrong, and checking them needed a new instrument.

    LITERATE_ERRORS.md is about user-facing ErrorDialog copy. The rule is
    in AGENTS.md, stated as a table: "Container not found -> throw a
    literate error", against "return a null object".

    A static read cannot settle the question. The factories are thin.
    createDatePicker forwards to a constructor, createColorPicker forwards
    to show(), and whatever happens to a missing container happens two hops
    away. The first attempt read the factory bodies and reported 2 of 46
    validating, which was wrong in both directions.
  decision: |
    D1. THE CENSUS CALLS EACH FACTORY RATHER THAN READING IT. Twice: once
        with a container that exists, which proves the call reached the
        component, and once with one that does not. The verdict is what
        the component did, which is what the rule is about and what a
        consumer meets.

    D2. THE CEILING IS A TEST, NOT A LINE IN audit-counts.mjs. Every
        ratchet there reads source text and this is not readable from
        text. SILENT_ON_MISSING_CONTAINER lives in
        scripts/factory-census.test.ts, which has a DOM.

    D3. IT IS A CEILING ON FACTORIES THAT STAY QUIET, NOT A FLOOR ON ONES
        THAT THROW. A floor cannot see a new unvalidated factory added
        beside the old ones.

    D4. A FACTORY THAT REFUSES A MISSING DEPENDENCY FIRST IS COUNTED
        APART. It never reached the container, so counting it as passing
        would be the vacuous kind of green this repository keeps finding.
        Two factories are in that state and they have their own small
        ceiling.

    D5. THE OPTIONS STUB FILLS REQUIRED FIELDS AND LEAVES CALLBACKS OUT.
        Calling with {} makes components with required options throw
        before they look at the container, hiding the verdict behind an
        unrelated one. A callback is left absent on purpose, because a
        component that needs one should say so.

    D6. REQUIRED-OPTION VALIDATION IS NOT IN THIS COUNT. ERR-1 conflated
        it with container validation. 52 of the 128 published factories
        take options only, so the container rule cannot apply to them.
        That measurement needs a different instrument.
  consequences: |
    65 of 74 published factories with a reachable verdict answer a missing
    container without throwing. 51 log a warning or an error and return a
    handle. 14 do nothing at all. 9 throw.

    ERR-1 SAID 10 OF 15 AND NAMED TEN COMPONENTS. Five are confirmed:
    colorpicker, datepicker, gauge, tabbedpanel, skeletonloader. Four take
    options only, so "validate that the container element exists" cannot
    apply: timeline, logconsole, sidebar, toolbar. One, toast, publishes no
    create* factory at all.

    THIS IS THE FALLBACK REVIEW ON A SHAPE THE SWEEP DID NOT MATCH.
    colorpicker.show() logs "Container not found" and returns. That is a
    loud failure converted to a quiet wrong answer, which is the owner's
    definition. FALLBACK-1 through 9 keyed on catch, on a method named
    fallback(), and on ??. `if (!container) { return; }` matches none of
    them. boxlayout is the purest form: `if (el) { layout.show(el); }` with
    no else, no log, and a handle returned for a component never mounted.

    A STATIC READ OF A THIN WRAPPER MEASURES THE WRAPPER. The parameter
    parser needed its own tests, because splitting a parameter list on
    every comma read `Omit<GaugeOptions, "shape">` as two parameters and
    moved the container index for all four gauge factories, which the
    census then reported as a finding rather than as its own bug.

- id: ADR-193
  title: Every factory that takes a container now throws when it is not there
  date: 2026-10-17
  status: accepted
  context: |
    ADR-192 measured ERR-1 by calling every published factory. 65 of 74
    answered a missing container without throwing: 51 logged and returned
    a handle, 14 did nothing at all. The owner approved fixing all of
    them, the fourteen silent ones first, and said not to weigh consumer
    breakage because there are no consumers yet.
  decision: |
    D1. THE REFUSAL NAMES THE CONTAINER AND THE REMEDY. The wording is
        FALLBACK-9's: what was not found, then what to do. The census
        asserts both, because a ceiling can count refusals and cannot
        tell a literate one from `throw new Error("failed")`.

    D2. A COMPONENT THAT RESOLVED TO document.body REFUSES INSTEAD. ribbon
        and tabbedpanel answered `el || document.body`, and docklayout,
        fileupload and gauge said "falling back to document.body" in the
        log text itself. Mounting somewhere the caller did not name is
        worse than not mounting, because it looks like it worked.

    D3. THE LOG BEFORE THE THROW IS REMOVED, NOT KEPT. The refusal carries
        the whole message. Logging it first prints it twice, which is the
        duplication FALLBACK-1 to 9 took out. This orphans the logWarn or
        logError helper in 23 components and unusedLocals rises 306 to
        329 as a result. The helpers are the LOG-4a preamble and exist
        whether or not a component calls them.

    D4. GRADIENTPICKER'S DEFERRED CHILD CHECKS isConnected. It builds the
        angle control, assigns an id and defers the AnglePicker factory to
        the next frame, and that factory resolves BY ID. A picker that was
        never mounted has no such element. Returning early there is not a
        fallback: nobody asked for an angle control on a picker that is
        not on the page.

    D5. MAGNIFIER'S CONTAINER IS VALIDATED EVEN THOUGH IT IS NOT A MOUNT
        POINT. The lens appends to document.body and the id was stored
        and never read again. A parameter accepted and discarded is its
        own quiet lie, and two of its own test files had been passing an
        options object there for as long as they existed.

    D6. THE 23 TESTS THAT ASSERTED THE DEFECT ARE REWRITTEN, NOT DELETED.
        Each now asserts the refusal and keeps its place in the file.
  consequences: |
    SILENT_ON_MISSING_CONTAINER reaches 0 and stays there. 74 of 76
    published container-taking factories refuse. The other two refuse a
    missing dependency before reaching the container.

    A FAIL-FAST CHANGE IS WORTH WHAT IT EXPOSES, AND THIS ONE EXPOSED
    FOUR THINGS. 23 of this repository's own tests had written the
    forbidden behaviour into the contract and all of them passed.
    runtime/integration.test.ts had never mounted its TreeView, because
    the harness passed the host element where a string id belongs with
    `as never` hiding it from the compiler, and the test asserted the
    lifecycle flag rather than the DOM. Two magnifier fixtures called the
    factory with the wrong signature. GradientPicker's angle control
    silently never appeared on an unmounted picker.

    Every one of those was invisible while the failure was quiet. None of
    them needed new tooling to find once the components said no.

    diagramengineLines rises 30522 to 30523 for one line of remedy text,
    the seventh recorded raise. unusedLocals rises 306 to 329, recorded
    against UNUSED-1 rather than absorbed.

- id: ADR-194
  title: A container is a parameter for 76 factories and an options field for 31
  date: 2026-10-17
  status: accepted
  context: |
    ADR-193 closed ERR-1 at SILENT_ON_MISSING_CONTAINER = 0. The census
    located a container by scanning PARAMETER NAMES, and
    `createLatexEditor(opts)` carries its container as `opts.container`.
    31 published factories do the same. All 31 were filtered out by
    `containerIndex >= 0` before the probe ran, so the zero was measured
    over 76 of the 107 factories that take a container at all.

    The zero was found by reading `latexeditor.ts` for an unrelated
    finding and seeing `logWarn("Container not found:", opts.container)`
    in a factory the census had reported as clean.
  decision: |
    D1. THE CENSUS LOCATES A CONTAINER IN EITHER PLACE, and the probe
        writes to whichever one the factory declares. `interfaceFields`
        is factored out of `stubFromInterface` and follows `extends`, so
        a container on a base interface is found too.

    D2. OPAQUE IS A VERDICT OF ITS OWN. Seven factories did
        `options.container.appendChild(...)` on a required non-nullable
        field. With null that throws "Cannot read properties of null",
        which names the line that broke rather than the thing the caller
        got wrong, and the probe had been filing it as SILENT. It is a
        refusal, and it is not the refusal the rule asks for.

    D3. THE GUARD GOES AT THE DOOR, not at the appendChild. ChartPanel
        also hands the container to a ResizeObserver, and one guard in
        the factory covers every later use.

    D4. TYPESCRIPT SAYING `HTMLElement` IS NOT A REASON TO SKIP THE
        GUARD. `document.getElementById("app")` returns
        `HTMLElement | null`, the IIFE bundles ship to JavaScript
        consumers, and that is the canonical way the null arrives.

    D5. HOVERCARD SPLITS NULL FROM UNDEFINED. `?? document.body`
        collapsed two different things. An omitted container is a caller
        who said nothing, and the README documents document.body for
        that, so it stays a default. A null container is a caller who
        resolved one and did not get it, and that throws.

        THE FIRST ATTEMPT AT THIS SPLIT COLLAPSED A DIFFERENT PAIR. It
        tested key presence, `"container" in options`, to avoid the
        TS2367 that `=== null` raises against `HTMLElement | undefined`.
        That throws on `{ container: undefined }`, which is what
        `{ ...defaults, container: cfg.container }` produces and is the
        ordinary way to compose options. `Object.is(options?.container,
        null)` takes `any` on both sides and needs no cast. The census
        probes null only, so it could not see the difference, and three
        cases in hovercard.test.ts now pin all three states apart.

    D6. THE WORDING TESTS COLLECT RATHER THAN ASSERT ONE AT A TIME. A
        gate that stops at the first name makes you re-run it once per
        offender, and this census found ten at once.

    D7. emptyFor LEARNS Date. createTimeline requires start and end, and
        `new Date(undefined)` made both calls throw identically, which
        read as "verdict unreachable". Teaching the stub shrinks the
        blind spot instead of raising the ceiling.
  consequences: |
    The ceiling is 0 again, now over 107 rather than 76. 105 refuse and
    2 refuse a missing dependency first. Four mutations were caught:
    dropping a guard, removing a remedy, blinding the scan to option-borne
    containers, and reverting the latexeditor refusal.

    A CEILING CANNOT SEE WHAT ITS PREDICATE EXCLUDES, AND A ZERO OVER THE
    WRONG SET READS EXACTLY LIKE A ZERO OVER THE RIGHT ONE. This is the
    third member of the family, after "a ceiling cannot see an absence"
    and "a ceiling cannot see a predicate narrowing". The first two were
    about what the measurement counts. This one is about who it counts,
    and it is the more expensive mistake, because the number looks
    finished.

    The comment above SILENT_ON_MISSING_CONTAINER now records that this
    particular zero has been wrong once, so the next reader weighs it
    against its company rather than on its own.

    unusedLocals rises 329 to 330. visualtableeditor logged the fault and
    then threw it, and removing the duplicate log orphaned logError.

- id: ADR-195
  title: LatexEditor refuses visual mode, because visual mode does not exist
  date: 2026-10-17
  status: accepted
  context: |
    FALLBACK-10 was recorded as a silent downgrade: `editMode: "visual"`
    with MathLive absent gave source mode and a console warning. The
    downgrade was real and the question behind it was wrong. Nothing in
    latexeditor.ts creates a `math-field`. renderEditorArea builds a
    textarea on every path, getMathMLInternal returns "" under a comment
    reading "stub until MathLive Phase 4", and visual mode only ever
    changed a string on the state object and which button carried the
    `active` class.
  decision: |
    D1. THE MESSAGE NAMES THE ABSENT FEATURE, NOT THE ABSENT LIBRARY.
        "MathLive not loaded" named a remedy that does not work: a
        consumer who loaded MathLive got a textarea with the Visual
        button lit. A literate refusal has to be literate about the
        right fault.

    D2. ONE FAULT, FOUR DOORS. The factory and setEditMode throw. The
        toolbar button is disabled unconditionally and says why. The
        Ctrl+Shift+M shortcut refuses in the log.

    D3. THE TWO USER-FACING DOORS DO NOT THROW, because a person cannot
        catch a throw. Nothing is substituted either way, and that is the
        distinction that matters: a refusal that says so is not a
        fallback.

    D4. THE "visual" MEMBER STAYS IN THE TYPE UNION. The stub says Phase
        4, so the feature is planned. A runtime refusal is fail-fast.
        Deleting a planned API is a roadmap decision and not one to take
        while fixing a fallback.

    D5. getMathML KEEPS RETURNING "". It is the same absence, and
        getValue composes it, so a throw there breaks the primary
        accessor for every caller. Recorded, not changed unasked.
  consequences: |
    FIVE TESTS ASSERTED THE ABSENT FEATURE AND ALL FIVE PASSED. One was
    named setEditMode_ToVisual_CreatesMathField: it queried for a
    math-field, put the result in an unused variable under the comment
    "May or may not create depending on implementation", and asserted the
    mode flag instead. Another asserted `typeof mathml === "string"`,
    true of "". The keyboard case asserted toBeDefined(), true of both
    answers. A beforeEach mocked MathLive, and no code path consults it.

    A TEST THAT NAMES A MECHANISM AND ASSERTS A FLAG IS THE SAME DEFECT
    AS A FACTORY THAT LOGS AND RETURNS A HANDLE. Both report success for
    something that did not happen, and both were written by someone
    making the suite green rather than making the claim true. The ERR-1
    sweep found 23 of these. The name is the tell, and here the name was
    the most accurate thing in the file.

    The README said the default was "visual" while the code defaulted to
    source, and described the component as having two editing modes. Both
    are corrected and the MathLive dependency row reads Unused.

- id: ADR-196
  title: Two ceilings on tests that cannot fail, and the twenty-one with no assertion at all
  date: 2026-10-17
  status: accepted
  context: |
    Twice in one session the defect was in the suite rather than in the
    code, and both times it was found by accident while fixing
    something else. ERR-1 turned 65 quiet factories into throws and
    broke 25 tests, 23 of which had written the forbidden behaviour
    into the contract and had been passing on every run. FALLBACK-10
    found five more asserting a feature the component does not build.

    Measuring the family found 21 test blocks with no `expect()` at all
    and 341 whose every assertion passes for any value that is not
    null, out of 4896.
  decision: |
    D1. TWO CEILINGS, NOT ONE. `testsWithoutAssertion` is unarguable
        and went straight to 0. `testsThatCannotFail` is a backlog at
        341, burned down by whoever next touches the file. Merging
        them would have hidden a clean zero inside a large number.

    D2. THE PREDICATE IS NARROW ON PURPOSE. Four matchers:
        toBeDefined, a bare not.toThrow, toBeTruthy, and
        expect(typeof x). `.not.toBeNull()` on a queried element is a
        real check and `.toBeInstanceOf(HTMLElement)` is weak rather
        than empty. Counting those adds 215 members and every one is
        an argument. A number nobody argues with gets acted on.

    D3. THE SUBJECT DECIDES, NOT THE MATCHER.
        `expect(root.querySelector(".x")).toBeTruthy()` makes exactly
        the claim `.not.toBeNull()` makes, so an existence matcher
        with a DOM-query subject is exempt. Twelve blocks turn on this,
        and without the rule the predicate contradicts itself.

    D4. THE PARSER BALANCES BRACES AND KNOWS ABOUT STRINGS. An
        indentation-anchored regex ends a block at the first closing
        brace in the right column, and a naive balance counts the
        brace inside `"\\invalid{"`. Both were real: the first lost
        every nested assertion, the second lost eight whole blocks.

    D5. THE COVERAGE ASSERTION IS DERIVED, NOT WRITTEN DOWN. The
        companion test compares parsed blocks against declarations
        counted another way, per file. A hardcoded total would need
        editing every time anyone adds a test, and the edit that
        silences it looks exactly like the edit that keeps it honest.

    D6. THE TWENTY-ONE ARE FIXED BY HAND, ONE AT A TIME. The 23 ERR-1
        tests took a transform because the fix was mechanical. Here
        each one is a question about what the component should do.
  consequences: |
    testsWithoutAssertion 21 to 0, mutation-proved in both directions.
    testsThatCannotFail recorded at 341. 5194 tests pass.

    WRITING THE TWENTY-ONE ASSERTIONS FOUND ONE DEFECT AND READ FOUR
    CONTRACTS NO TEST HAD STATED. DEBT-COLOR-1: ColorPicker holds its
    colour as HSL with saturation and lightness rounded to whole
    percents, so setValue("#AABBCC") reads back as #A9BACB. Pinned
    rather than fixed, because the fix is a change to the colour model.

    The four contracts: setReadOnly removes the delete affordance and
    keeps navigation, so the first assertion written for it was wrong
    and the component was right. escape_FromGroupLevel_ShowsTabKeytips
    never pressed Escape. onChange_FiresOnConfigMutation hedged "may
    fire" about an unconditional call. setValue_FiresOnChange_When
    UserTriggered only ever called setValue, which stays quiet by
    design, so the user trigger in its name was never exercised.

    THIS GATE WOULD NOT HAVE CAUGHT THE 23 ERR-1 TESTS, and saying so
    is part of recording it. They asserted toHaveBeenCalled() against a
    contract that was wrong, which is a real assertion of the wrong
    thing, and only running the code finds that. Two families: a wrong
    contract honestly asserted, and no contract asserted at all. A text
    scan can see the second. ADR-192's census is what sees the first.

- id: ADR-197
  title: Measure the option half of the factory rule by omitting one field at a time
  date: 2026-10-17
  status: accepted
  context: |
    AGENTS.md states two rows in one table. "Container not found ->
    throw a literate error" reached zero under ADR-193 and ADR-194.
    "An option is missing -> throw a literate error, not apply a silent
    default" had never been measured. ERR-1 conflated the two from the
    start: its entry said "no container OR OPTION validation" and every
    number it carried was about containers.
  decision: |
    D1. REQUIRED MEANS THE INTERFACE SAYS SO. A field declared `?` is
        optional by construction and a default for it is the point of
        the option. A field declared without `?` is one the caller must
        supply.

    D2. OMIT ONE FIELD AT A TIME, from an otherwise complete stub.
        Calling with `{}` makes the first guard fire and says nothing
        about the other seven options.

    D3. A COMPONENT THAT REJECTS AN EMPTY ARRAY HAS VALIDATED THE
        FIELD. The stub supplies `[]` and Stepper answers "steps are
        required". That is stricter than a presence check, not weaker.

    D4. A CRASH THAT NAMES THE FIELD IS NOT A REFUSAL.
        `TypeError: options.roots is not iterable` contains "roots" and
        carries no remedy, because it is the component reaching for a
        value one frame later. OPAQUE, as in ADR-194.

    D5. A PARAMETER DEFAULT BELONGS TO THE VALUE, NOT THE TYPE.
        `options: Omit<ActionItemsOptions, "container"> = {}` kept its
        ` = {}`, the Omit match is anchored at the end, and the factory
        was blamed for an option its own signature removes.
  consequences: |
    67 of 104 declared required options were not refused when absent:
    40 silent, 27 crashing. 5 refused and 2 were unreachable.

    FIVE NUMBERS CAME OUT OF THIS PROBE BEFORE THE FIRST FIX, AND EVERY
    CORRECTION MADE IT STRICTER ABOUT WHAT IT WAS ALLOWED TO BLAME: 44,
    40, 67, 66. An instrument that is still moving has not earned a
    verdict, and each move here removed a component from the accused
    list rather than adding one.

    emptyFor learned string-literal unions and their named aliases,
    which brought GaugeShape and ChartPanelKind into reach.
    interfaceFields learned `extends Omit<X, "a" | "b">` and keeps only
    the nearest declaration of a restated field. 5 of 79 probed fields
    stay beyond the stub, three callbacks and two named object types,
    and are excluded rather than guessed at.

- id: ADR-198
  title: Every factory refuses a required option that is not there
  date: 2026-10-18
  status: accepted
  context: |
    ADR-197 measured 66 required options not refused when absent, in
    two populations that want different handling: 27 that crash a frame
    later, and 39 that work without the field.
  decision: |
    D1. TWO SLICES, BECAUSE THE SECOND IS NOT MECHANICAL. A component
        that already dies on `options.roots is not iterable` cannot
        have a caller who omits the field, so the 27 went in one pass
        and no test broke. The 39 work without the field, which is the
        whole problem, and each needed a decision.

    D2. THE DISCRIMINATOR IS THE README'S DEFAULT COLUMN. A silent
        default the documentation promises means the interface is
        missing a `?`, and marking the field optional is the honest
        fix rather than adding a throw. A default nobody documented is
        the defect the rule is about. All 39 turned out to be the
        second kind.

    D3. `=== undefined`, NOT `!options.x`. Absent is what the rule is
        about. An empty array, a zero and an empty string are present,
        and contextmenu.x of 0 is a legitimate coordinate.

    D4. createWorkspaceSwitcher GUARDS THE PAIR. It accepts either
        shape and reads `current.tenants ?? legacy.workspaces`, so
        guarding one name would reject a caller who used the other,
        and delegating would answer a WorkspaceSwitcher caller with a
        message about tenants.

    D5. MOUNT FIXTURES GO IN `<name>.conformance.ts`, not in the
        manifest. defaultOptions is published to consumers, and the
        fleet gate has its own check forbidding placeholder content
        there.
  consequences: |
    SILENT_DEFAULT_FOR_REQUIRED_OPTION went 67, 66, 39, 0. 72 of 73
    refuse and 1 refuses a missing dependency first. Mutation-proved.

    THE DISCRIMINATOR'S FIRST ANSWER WAS WRONG, AND THE READER WAS AT
    FAULT RATHER THAN THE DOCUMENTATION. A first pass reported five
    fields documenting defaults, `boxlayout.direction` as "vertical"
    and `gauge.shape` as "ring". Those strings are fragments of the
    TYPE cell: a Markdown table splits on `|`, a TypeScript union in a
    table escapes its pipes as `\|`, and splitting naively cuts through
    `"horizontal" \| "vertical"` and shifts every later cell left.
    Checking the code before acting on it found no default applied
    anywhere, and `gauge.shape` declared "Required" in its own comment.
    No README needed changing. A tool that reads documentation needs
    the same scepticism as a tool that reads code, and the check is the
    same one: confirm against the thing being described.

    Ten components needed a mount fixture, because the fleet
    conformance gate had been building them with `{}` and nothing had
    ever said so.

    DEBT-MSC-1 found on the way: createMultiselectCombo with an empty
    item list threw "Cannot set properties of undefined". buildRoot
    assigned the dropdown before the live region, and with no items the
    dropdown reaches renderNoResults, which announces. The lines are
    swapped. `private liveRegionEl!: HTMLElement` hid it, the third
    type assertion in this tracker to conceal a real defect.

- id: ADR-199
  title: DEBT-SEC-7 closed, and the recommended driver.js version had never existed
  date: 2026-10-18
  status: accepted
  context: |
    DEBT-SEC-7 recorded four rows of "documented CDN versions drift
    from what this repository builds". chart.js closed under ADR-191.
    bootstrap, bootstrap-icons and marked remained, plus driver.js
    carried over from DEBT-SEC-8 as a 1.4.0-against-1.4.1 split.
  decision: |
    D1. THE BOOTSTRAP FIX REMOVES THE CATEGORY, NOT THE INSTANCE. Ten
        component READMEs already load css/custom.css from this origin
        and six load icons/bootstrap-icons.css. Exactly two named a
        jsdelivr version. Both now use the majority pattern, and a path
        with no version in it cannot drift. custom.css IS Bootstrap
        with the theme compiled in, so it replaces bootstrap.min.css
        rather than sitting beside it.

    D2. MARKED WAS NEVER A DRIFT. 18.0.12 is a devDependency used by
        scripts/generate-docs.js. This package declares zero runtime
        dependencies, markdownrenderer probes window.marked rather
        than importing it, and 15.0.7 is what consumers are told to
        load and what third-party-sri.json hashes. The row compared
        two different populations.

    D3. DRIVER.JS GOES TO 1.4.0, THE VERSION THAT EXISTS. The README
        named 1.4.1 for both assets and 1.4.1 was never published: the
        1.4.x line stops at 1.4.0 and both URLs return 404. The three
        demo pages were already on 1.4.0, so the repository disagreed
        with itself and the demos were right. Latest is 1.10.1, and
        moving there is a compatibility decision for a consumer-facing
        recommendation rather than part of fixing a dead link.

    D4. THE PAIRING CHECK READS BOTH MANIFESTS. It covered only
        dist/lib-manifest.json, the assets this origin serves, so a
        documented tag bearing a third-party hash could name any URL
        at all.
  consequences: |
    thirdPartyTagsWithoutSri 35 -> 17. The remaining 17 are two
    populations and neither is a slice: ten in dated specs/*.prd.md
    historical records, and CodeMirror's bare ESM specifiers, which
    cannot carry an integrity attribute because the attribute belongs
    to a script tag and these are import statements inside a module.

    THIRD INSTANCE OF A DOCUMENTED CDN URL THAT HAS NEVER RESOLVED,
    after bootstrap@5/css/bootstrap.min.css under DEBT-SEC-6 and
    mathlive@0.107.3/dist/ under DEBT-SEC-8. The pattern is a version
    number written from memory or incremented by hand, never fetched.

    AND THE GATE COULD NOT SEE IT. Pointing a documented tag back at
    the never-published 1.4.1 passed every check. `npm run sri:verify`
    fetches the MANIFEST's urls, which are correct by construction,
    and the pairing assertion added under ADR-190 covered only the
    vendored manifest. Reading both takes the pairing coverage from 21
    documented tags to 64, and the mutation is caught.

    The lesson generalises past SRI: a verifier that reads the same
    source the artifact was generated from confirms the generator, not
    the documentation. The thing a consumer copies is the tag.

- id: ADR-200
  title: A capability the caller named refuses when it is absent, and one it did not is composed from what is there
  date: 2026-10-18
  status: accepted
  context: |
    CodeEditor had thirteen `hasCMGlobal(name)` guards with no else
    and one unguarded member access, reached from nine public methods.
    `undo()` returned normally having done nothing. DocViewer rendered
    raw markdown as plain text when MarkdownRenderer was absent.

    Both are AGENTS.md's fourth row: a capability that is unavailable
    throws or refuses the one feature loudly, and does not render a
    reduced version. The earlier fallback sweeps missed them because
    FALLBACK-1 to 9 keyed on `catch`, `fallback()` and `??`, and this
    shape is `if (present) { do it }`.
  decision: |
    D1. THE DISCRIMINATOR IS WHETHER THE CALLER NAMED THE THING.
        `undo()` is a request and `bracketMatching` is not. Nine
        `tryPush` addons are deliberately left composing from what the
        page published. `options.lineNumbers` and `options.onSave` are
        named, so an absent `lineNumbers` or `keymap` refuses.

    D2. THE MESSAGE NAMES THE NPM MODULE, not just the global.
        CodeMirror 6 arrives as fifteen separate ESM specifiers, so
        "undo is unavailable" tells a reader nothing they did not just
        observe. "@codemirror/commands was not loaded" is actionable.

    D3. TWO SILENT EXITS, TWO MESSAGES. An unmounted view already
        refused visibly through showMissingDependencyError, so that
        refusal points at the notice in the container. A mounted view
        with a module missing is the dangerous one, because the editor
        looks right, and that refusal names the module.

    D4. readOnly STILL RETURNS QUIETLY. The caller configured it, and
        refusing it would be refusing their own setting.

    D5. THE ANNOUNCE ORDER MATTERS MORE THAN THE THROW.
        setDiagnostics discarded the list and then announced
        "3 diagnostics" to the live region. A screen reader was told
        about diagnostics that had just been dropped, which is the
        Toolbar tooltip defect of FALLBACK-9 in a different component.

    D6. DOCVIEWER THROWS RATHER THAN SHOWING RAW MARKDOWN. Plain text
        with pre-wrap is indistinguishable from badly written
        documentation, so the reader cannot tell a dependency failed.
  consequences: |
    Fourteen sites in CodeEditor and one in DocViewer. testsThatCannotFail
    341 -> 335. Three mutations caught.

    NOTHING IN THE SUITE HAD EVER MOUNTED CODEEDITOR WITH CODEMIRROR
    PRESENT. All 33 tests ran against an editor displaying a
    missing-dependency notice, which is why `_DoesNotThrow` was the
    natural assertion eight times, and why the module-absent half was
    unreachable. A minimal mock now mounts it, guarded by
    `theMockActuallyMounts` so it cannot become the LaTeX editor's
    MathLive mock, which mocked a global no code path consulted. THE
    MOCK FOUND THE FOURTEENTH SITE ON ITS FIRST RUN: an unguarded
    `EV.updateListener.of(...)` that carries onChange, onFocus and
    onBlur and died with "Cannot read properties of undefined".

    DOCVIEWER'S README DOCUMENTED A DEPENDENCY THE COMPONENT DOES NOT
    HAVE. It told consumers to load Vditor in two tags, called the
    output "Vditor-rendered" in its Overview, and listed Vditor as
    falling back to plain text. There is not one reference to Vditor in
    docviewer.ts, and the real dependency was named nowhere. Fixing the
    throw without fixing the README would have stranded a consumer who
    followed it.

    DEBT-GATE-2 recorded rather than fixed: structure check [16] reads
    the THEN branch of an `if (!x)` and cannot see
    `if (x) { return real } return stand-in`, which is the form
    getSelection used. 235 bare `return ""` / `[]` / `0` / `null`
    statements exist across component sources and most are legitimate,
    so the work is classifying them rather than flipping a predicate.

- id: ADR-201
  title: The guard decides whether a stand-in is a lie, not the literal
  date: 2026-10-18
  status: accepted
  context: |
    DEBT-COLOR-1 recorded that setValue("#AABBCC") read back as
    #A9BACB. DEBT-GATE-2 recorded that structure check [16] cannot see
    `if (x) { return real } return stand-in`, the form CodeEditor's
    getSelection used, and estimated 235 candidates.
  decision: |
    D1. rgbToHsl STOPS ROUNDING. Measured over 60,000 colours, the
        rounded round trip drifts for 84.8% of them with a worst
        channel delta of 3, and the unrounded one is exact for all of
        them. Nothing downstream wanted the rounding: the readouts
        round where they are built, the hsl() output rounds as it
        formats, and a slider value is whole by construction. A
        deletion, not a second field holding exact RGB.

    D2. THE 235 WAS THE WRONG POPULATION. Narrowed to reader-named
        functions returning a non-honest literal inside a failure
        branch, it is 38.

    D3. THE GUARD DECIDES, NOT THE LITERAL. Of the 38, 33 guard on
        DATA and are honest: `resolveGap()` answering "0" when no gap
        is set is true. 5 guard on INFRASTRUCTURE, where the backing
        object is absent and the reader cannot answer at all. Both are
        `return "<literal>"` in a failure branch, and only the second
        is a fabrication.

    D4. THE PREDICATE READS THE LAST PATH SEGMENT. The first version
        read the first, saw `renderer` in `renderer.className`, and
        reported a default CSS class as a fabricated read.

    D5. THE FIFTH SHAPE COVERS BOTH DIRECTIONS. An absence guard's
        then-branch and the fall-through of a presence test are the
        same defect written two ways.
  consequences: |
    Four live defects: codeeditor.getValue() on cmView,
    markdowneditor.getHTML() on vditor, ribbon.getControlValue() on an
    unknown control id, and spinemap's NativeInputAdapter.getValue()
    called before mount(). That last is the eleventh adapter of the
    shape FALLBACK-9 swept, and it survived because it returns a
    scalar rather than an object literal with read methods.

    CODEEDITOR.getValue() IS THE ONE THAT STINGS. ADR-200 closed
    thirteen sibling refusals in that same file an hour earlier and
    missed this one, because it is the inverted form and I was reading
    for `if (hasCMGlobal(...))`. A sweep finds the shapes it was
    written to match, again.

    The CodeMirror mock moved to components/codeeditor/codeeditor.cm-mock.ts
    so the nofallback clipboard tests can use it. Those tests wanted a
    WORKING editor and a broken clipboard, and once getValue() began
    refusing an unmounted editor they were passing on the wrong
    refusal.

    Three mutations on the gate: both guard forms caught, and a
    data-guarded reader renamed to look like the others correctly left
    alone, which is the check that the predicate is about the guard
    and not the name.

- id: ADR-202
  title: MarkdownRenderer was the root of the substitution family, and a floor for deleted tests
  date: 2026-10-18
  status: accepted
  context: |
    Triaging DEBT-TEST-1b by claim type rather than by file size, the
    `expect(typeof x)` group was predicted to have the highest yield.
    It did: `withoutMarked_ReturnsFallbackHandle` led to
    createMarkdownRenderer returning buildFallbackHandle().
  decision: |
    D1. createMarkdownRenderer THROWS WHEN marked IS ABSENT. The
        fallback handle rendered raw markdown as pre-wrap text and
        escaped rather than rendered in toHtml.

    D2. THIS IS THE ROOT AND THE FOUR EARLIER FIXES WERE BRANCHES.
        DocViewer, two diagramengine paths and helpdrawer each guard
        on window.createMarkdownRenderer being ABSENT. This branch
        fires when the component is present and `marked` is not, and
        produces the same output a layer deeper, so none of those four
        covered it.

    D3. THREE HOLES IN check-fabricated-reads, ALL CLOSED. READ_NAMES
        is a hardcoded allowlist missing `toHtml`. The object-literal
        probe needs a failureContext and this return is the whole
        function body, because the CALLER took the branch. The
        stand-in-NAME rule applied only to assignments. The third is
        widened narrowly: a stand-in builder returning a DOM element
        is a view, reviewed under ADR-148, so only a returned object
        with READ METHODS counts.

    D4. `expect(typeof x)` LEAVES THE VACUOUS PREDICATE. `typeof
        undefined` is "undefined", so the assertion fails for a
        missing value and never met the stated definition. It is too
        LOOSE for its test's claim, which is a real and different
        fault. 335 -> 285 is a correction.

    D5. A FLOOR ON testBlocks. Every gate in this area is a ceiling,
        and a mass deletion only makes a ceiling happier.

    D6. `.mock.ts` JOINS `.test.ts` IN sourceFiles(). The window
        ratchets keep untyped window access out of SHIPPED code, and a
        mock is not shipped.
  consequences: |
    I DELETED 23 TESTS BY ACCIDENT AND NOTHING NOTICED. A slice
    boundary matched a closing brace further down
    markdownrenderer.test.ts and took the whole XSS suite with it:
    stripsScriptTags, stripsJavascriptUrls, stripsOnclickHandlers and
    fourteen more. Every gate passed. The suite reported 5191 passed
    in green and nothing said 5214 had passed twenty minutes earlier.
    Found by noticing the total looked wrong, which is not a method.
    testBlocks is now a floor at 4930, mutation-proved.

    AND CI WENT RED ON e2baddd WHILE I REPORTED GREEN. Three window
    ratchets rose. Every gate scans `git ls-files`, the new mock was
    untracked when I ran them locally, and an untracked file is
    invisible to all of them. Running the checks before `git add`
    gives a false pass. That is the same family as ADR-199's verifier
    reading the manifest instead of the tag: ask what source the check
    reads, and whether your change is in it yet.

    DEBT-TEST-1b is 284 and classified rather than closed: 116
    idempotency, 73 where the name states a change, 9 on an absent
    dependency, 86 handle checks. The 9 are the highest yield left.

- id: ADR-203
  title: A classification is an instrument, and the suite that never mounted its dependency is where the defects are
  date: 2026-10-18
  status: accepted
  context: |
    DEBT-TEST-1b had been split into four shapes the day before, and
    one bucket of nine was labelled the highest yield per item left.
    Going to work on those nine, the classifier that produced the
    split could not be found: it had been run from a scratch file and
    never committed. The table in CODEBASE_FIXES.md and
    scripts/audit-counts.mjs was a claim about the repository that the
    repository could no longer check. Recovering the set took four
    scripts. One heuristic returned 123 blocks and another returned
    one, and the set that summed to nine appeared only after the shape
    was guessed and then tested against the recorded count.
  decision: |
    D1. THE SHAPE SPLIT IS A COMMITTED MODE OF THE CENSUS.
        `node scripts/test-assertions.mjs --shapes` regenerates the
        table. census() now carries each block's body, because the
        split needs it. Four cases in the companion file pin the one
        decision the split rests on: which bucket claims a block when
        two rules match.

    D2. WITHHOLDING IS DETECTED PER FILE, SO IDEMPOTENCY IS TESTED
        FIRST. A suite states an absent dependency once in its setup,
        so the signal is file-level. Ordered the other way, a file
        that deletes a global in teardown claims every
        destroy_CalledTwice inside it, and the bucket reported 17
        where 6 is right. The name is the fact, the file is the
        hypothesis.

    D3. setToolState({ label }) UPDATES A type:"label" ITEM.
        applyToolStateToDOM wrote into `.toolbar-tool-label`, which a
        button renders. A label item renders `.toolbar-label-text`, so
        the write silently did nothing to every label item in the
        library. The live config is kept truthful too, because a label
        item is read back through `text`. `text` joins
        ToolbarItemFields so the generic paths can reach it.

    D4. GRAPHTOOLBAR'S SUITE MOUNTS THE REAL TOOLBAR. It imports
        ../toolbar/toolbar for the globals and stubs only Bootstrap's
        Tooltip, which is a third-party bundle rather than a component
        of this library.
  consequences: |
    THE NINE WERE NOT THE HIGHEST YIELD. Six were positive controls in
    *.nofallback.test.ts suites, where .not.toThrow() is the correct
    shape for the claim and the missing half is "assert the mount
    produced something" rather than a refusal. Two were CodeEditor
    survivors of ADR-200. One was a duplicate of the block above it
    under a name describing a case it never reached. All nine closed,
    testsThatCannotFail 284 -> 267.

    THE YIELD CAME FROM A FILE THE CLASSIFIER NEVER POINTED AT.
    GraphToolbar's suite mounted a stand-in Toolbar whose setToolState
    had an empty body, so eight of its nine blocks could not fail and
    all eight looked like ordinary idempotency to any name-based rule.
    Mounting the real Toolbar found D3. GraphToolbar's zoom reading
    had been frozen at its build-time value for the life of the
    toolbar, and the PRD's section 8.2 acceptance had never been true.
    Nine blocks became fifteen, three of which fail if D3 is reverted.

    A CLASSIFIER SORTS BY THE SHAPE OF THE TEST, AND A DEFECT LIVES IN
    THE RELATIONSHIP BETWEEN A TEST AND ITS DEPENDENCY. ADR-200 for
    CodeEditor and CodeMirror, ADR-203 for GraphToolbar and Toolbar:
    the same finding twice in two days. Rank suites by stand-in, not
    by matcher.

    THREE DOCUMENTS TOLD INTEGRATORS TO WIRE setZoomLabel WRONG. The
    README and the reference generated from it called graph.getZoom(),
    which GraphCanvas does not have, and fed a scale factor into a
    parameter the PRD documents as a percentage. COMPONENTS.md passed
    graph.zoomIn(), which returns void, so the label would have read
    an em dash. The demo pages were right all along.

    RECORDED RATHER THAN TAKEN. DEBT-CE-1: toggleWordWrap() presses
    its button when CodeMirror is absent and nothing wrapped, which is
    a behaviour change rather than a test fix. DEBT-TB-1: a Toolbar
    label item cannot be an ARIA live region, which the GraphToolbar
    PRD says the zoom reading is.

    DEBT-TEST-1b is 267 and regenerable: 110 idempotency, 66 where the
    name states a change, 6 on an absent dependency, 85 handle checks.
    Each of the 6 states a change in its name.

- id: ADR-204
  title: Rank suites by what they stand in for, and the fallback that hid behind three stand-ins
  date: 2026-10-18
  status: accepted
  context: |
    ADR-203 closed with a sentence it could not act on: rank suites by
    stand-in, not by matcher. Two defects in two days had come from
    the same place, a suite that had never mounted its real
    dependency, and neither was reachable from the shape classifier
    that was steering the work. The instruction existed. The census
    did not, so "which suites are those" was still a question nobody
    could answer without reading 162 files.

    DEBT-CE-1 and DEBT-TB-1 were left open the same day, each recorded
    as a behaviour change rather than a test fix.
  decision: |
    D1. THE STAND-IN CENSUS IS A COMMITTED MODE OF THE SAME SCRIPT.
        `node scripts/test-assertions.mjs --stand-ins` lists every
        test file that writes a global another component in this
        repository owns without importing that component. Ownership
        comes from extractGlobals, the reader check [19] already
        grades the published reference with, rather than a third copy
        of the `window.x =` forms. Five cases pin it, and the
        regression case is the pre-fix GraphToolbar suite.

    D2. A THIRD-PARTY BUNDLE IS THE STUB BOUNDARY. Bootstrap, marked
        and CodeMirror own no source here, so they never appear in
        the census and stubbing one stays correct. A sibling
        component can be imported, so standing in for one is a choice
        that needs a reason.

    D3. A STUB IS STILL RIGHT WHEN THE CLAIM IS ABOUT THE CALLER.
        Six of the eleven remain, and all six are correct. Four
        withhold the factory because the claim under test is that the
        host refuses. Two record what the host passed, which a real
        component cannot report.

    D4. toggleWordWrap() AND toggleLineNumbers() REFUSE WITHOUT A
        VIEW, AND THE REFUSAL COMES FIRST. A toggle that refuses and
        still inverts its own flag is worse than one that does
        nothing, because the next call undoes a change that never
        happened. pushCMLineWrapping requires EditorView.lineWrapping
        rather than testing it, matching pushCMLineNumbers.

    D5. A TOOLBAR LABEL ANNOUNCES BY ASKING. ToolLabelItem gains
        `live?: "polite" | "assertive"`, opt-in because most labels
        are static captions. The attributes go on the wrapper, which
        is the element that survives while the text node is replaced.

    D6. showInlineToolbar REFUSES WHEN THE COMPONENT IS ABSENT, AND
        RETHROWS WITH cause WHEN THE FACTORY FAILS. Three components
        carry the ADR-128 pattern and all three warned and continued.
  consequences: |
    ELEVEN STAND-INS, AND FIVE WERE WORTH CONVERTING. Timeline,
    ActionItems and RelationshipManager each tested their ADR-128
    toolbar against a fake that rendered no button. Timeline invoked
    item.onClick?.() on the captured object with no arguments, and the
    real toolbar passes two. RelationshipManager asserted an attribute
    its own fake had set. ActionItems read the argument list rather
    than the rendered toolbar. Deleting the click dispatch inside
    InlineToolbar now turns all three red, and could not have before.

    FALLBACK-14 WAS FOUND BY THE CONVERSION AND BY NOTHING ELSE.
    Each suite installed its own factory in beforeEach, so the absent
    branch was reachable only by deleting what the suite had just
    written, and the three tests that did so were named WarnsAndSkips,
    LogsWarnNoThrow and "warns, no throw, no slot". Each stated the
    defect as the contract and had passed on every run since ADR-128.
    A TEST NAMED AFTER THE BEHAVIOUR IT OBSERVES CANNOT DISAGREE WITH
    IT.

    DOCVIEWER NOW STUBS marked INSTEAD OF THE RENDERER. Its markdown
    path ran against four lines of its own suite, in the component
    FALLBACK-13 lived inside. Mounting the real MarkdownRenderer made
    two absences distinguishable for the first time, so the single
    refusal test split in two: one withholds the component and one
    withholds the bundle.

    THE PRD PARAGRAPH WAS FALSE IN TWO INDEPENDENT WAYS. Section 8.2
    of the GraphToolbar PRD said the text updates and a screen reader
    announces it. ADR-203 made the first half true and D5 makes the
    second. Fixing one is what exposed the other.

    A DEFERRAL IS NOT A CONDITION UNTIL SOMEONE RE-TAKES IT. DEBT-TS-1
    was re-checked and has not moved: the consuming app still calls
    the deprecated surface on the same six lines. The answer is
    written down even though it did not change.

    5245 tests across 162 files, 32 of 32 structure checks, every
    ratchet at its line. testBlocks floor 4942 -> 4963,
    testsThatCannotFail unchanged at 267. Seven mutations caught.

- id: ADR-205
  title: The demo pages had never been opened, and the bucket of 66 was mostly missing preconditions
  date: 2026-10-19
  status: accepted
  context: |
    Two separate pieces of work, asked for in one go.

    First: 129 demo pages shipped and eight had ever been loaded in a
    browser by anything in this repository. Structure checks [4] and
    [5] look like coverage of those pages and ask only whether files
    exist on disk. DEBT-DE-1 and ADR-199 are both on the record as
    what that distinction costs.

    Second: DEBT-TEST-1b's namesAChange bucket stood at 66, and the
    note in audit-counts.mjs had said for a day that this is where to
    go next.
  decision: |
    D1. EVERY TRACKED DEMO PAGE LOADS CLEAN, AND A GATE SAYS SO.
        `npm run test:demos` fails a page on a non-200, an uncaught
        error, a console error, a failed request, or a component of
        the same name that did not register its global. Pages are
        enumerated with `git ls-files`, because enumerating `dist`
        would hide a page the copy step dropped.

    D2. IT IS LOCAL AND NOT WIRED INTO CI. CI runs no browser, and
        codeeditor.html imports CodeMirror from esm.sh, so one page
        of 129 needs the network. Wiring it up is a decision about CI
        time and network flake, not an omission.

    D3. MARKDOWNEDITOR TRACKS VDITOR READINESS, NOT VDITOR EXISTENCE.
        `if (this.vditor)` reads as a readiness check and is an
        existence check: the instance exists the moment the
        constructor returns and cannot answer getValue() until its
        `after` hook has run. A theme change that arrives mid-load is
        deferred and applied in `after` rather than dropped, and a
        re-init hands the document to the next instance through the
        same hook rather than calling setValue on a constructor's
        return value.

    D4. DYNAMICFORMSWITCHER ATTACHES THE HOST ON ALL FOUR PATHS.
        Auto-discovery did this and `mount`, a registered provider
        and `type: "custom"` did not, so a caller reaching for any
        component of this library from inside one of them was handed
        a container the document does not contain.

    D5. THE DIAGRAMENGINE EMBED PROBE GAINS STRATEGY 0. A factory
        that takes a container ID may mount itself, and then there is
        nothing for show/render/getElement to do. The container's
        children are counted before the factory runs.

    D6. THE SHAPE BUCKETS ARE LISTABLE, FROM THE SAME CLASSIFIER.
        `--shapes --shape namesAChange` lists one bucket's members.
        `shapeOf` is the single rule the tally and the listing share,
        because a second rule that agrees with the first by
        inspection is what ADR-203 was written about.

    D7. THE 31 WERE WORKED BY CLUSTER, NOT BY FILE SIZE. A cluster
        shares a component, so setup written for the first block pays
        for the rest.
  consequences: |
    FOUR OF 129 PAGES FAILED AND ALL FOUR WERE REAL. MarkdownEditor
    threw four uncaught TypeErrors per load. DynamicFormSwitcher
    handed out a detached host. DiagramEngine threw on an embed that
    had already succeeded. DockLayout mounts slots from its
    constructor, before the grid is in the document, which is fixed
    in the demo page and recorded as DEBT-DL-1 because the obvious
    repair fixes one route of two.

    EVERY ONE OF THOSE IS A COMPONENT DEFECT FOUND BY OPENING A PAGE.
    None was reachable from a unit suite, and three of the four were
    in components whose suites are green.

    THE BUCKET OF 66 WAS MOSTLY MISSING PRECONDITIONS. 66 -> 35, and
    the recurring find was not a weak assertion but a test that could
    not have failed whatever it asserted. Ruler's five each called a
    method whose only effect is a render, with no 2D context in the
    environment. scrollToPageFrame fits the viewport to a bounding
    rect jsdom reports as zeros. HoverCard's two called a
    two-argument show with one argument. groupedItems_RenderCorrectly
    never showed the component. Each rewrite is half assertion and
    half setup, and the setup is the half that was missing.

    ONE DEFECT CAME OUT OF THE 31 AND IS RECORDED. DEBT-STI-1:
    attaching with an explicit adapter type the element cannot
    satisfy throws inside the input handler rather than refusing at
    attach, and jsdom's listener boundary swallows it.

    TWO BLOCKS WERE DELETED RATHER THAN REWRITTEN, each being the
    test below it with the assertion removed. The testBlocks floor
    held at 4963 by arithmetic rather than by catching anything,
    which is stated where the next reader will see it.

    5248 tests across 162 files, 130 of 130 demo pages, 32 of 32
    structure checks. testsThatCannotFail 267 -> 236,
    diagramengineLines 30523 -> 30546 as the eighth recorded raise.
    Twenty mutations caught across the pass, and one escape stated in
    the test that cannot see it.

- id: ADR-206
  title: Two recorded defects taken, and a blocker that was wrong rather than stale
  date: 2026-10-20
  status: accepted
  context: |
    Three items, all of them already written down. DEBT-DL-1 and
    DEBT-STI-1 were found on 2026-10-19 and recorded rather than taken,
    because each was a behaviour change. `graphminimap` had sat EXEMPT
    from the fleet conformance gate since 2026-08-03 with a blocker
    naming a 2D context.

    ADR-160 re-measured all sixteen blockers on 2026-10-10 and eleven
    did not survive. This one did.
  decision: |
    D1. DOCKLAYOUT QUEUES A SLOT MOUNT UNTIL THE GRID IS IN THE
        DOCUMENT, and does it at `mountComponent`, which is the single
        place all five slot setters funnel through. The queue is keyed
        by cell, and `clearCell` drops the entry so a cleared slot does
        not mount anyway.

    D2. SMARTTEXTINPUT REFUSES AN ADAPTER TYPE THE ELEMENT CANNOT
        SATISFY, at `attach`, while the caller is still on the stack.
        `detectAdapterType` already refused an element it could not
        place; this is the same refusal for the branch that skips
        detection.

    D3. GRAPHMINIMAP JOINS THE FLEET GATE. The manifest is the
        ChartPanel form — options-only, `containerOption: "container"`
        — and the conformance glue supplies a `GraphCanvasHandle`
        stub. The component's source is unchanged.
  consequences: |
    THE OBVIOUS DOCKLAYOUT FIX WAS THE WRONG ONE AND THE ENTRY SAID SO.
    Moving `mountInitialSlots()` into `show()` repairs the constructor
    route and leaves `setToolbar()`-before-`show()` exactly as broken.
    Fixing it at the boundary covers both, and the test for the second
    route is the one that would have failed under the obvious fix. Same
    shape as ADR-205 D4, where DynamicFormSwitcher made a guarantee on
    one resolution path of four.

    A MUTATION SHOWED ONE GUARD UNPROVEN AND A SECOND TEST WAS ADDED
    RATHER THAN A COMMENT WRITTEN. Removing `clearCell`'s queue delete
    failed nothing, because a Map key already dedupes a REPLACED slot.
    The case the delete exists for is a CLEARED slot, where nothing
    overwrites the entry, and that now has its own test.

    THE GRAPHMINIMAP BLOCKER WAS WRONG ON BOTH HALVES, NOT STALE. The
    minimap paints no 2D context — it renders SVG and the file contains
    no getContext call. And `graphCanvas` is typed as a six-method
    structural interface the file documents as minimal, so a plain
    object satisfies it. ADR-160 re-read sixteen sentences and this one
    read plausibly, which is why it survived. RE-MEASURING A DEFERRAL
    MEANS RE-READING THE CODE IT DESCRIBES, NOT THE SENTENCE.

    THE FIRST DRAFT OF THE CONFORMANCE GLUE CARRIED ITS OWN WRONG
    CLAIM. It said two fixture nodes were needed for the renders-content
    check, and a mutation showed the gate passes with an empty node
    list, because the minimap renders its frame either way. The comment
    now states what was measured. The same correction PermissionMatrix's
    glue already carried, arrived at the same way.

    DEBT-DUI-4 goes 4 -> 3. 5257 tests across 162 files, 130 of 130 demo
    pages, 32 of 32 structure checks, testBlocks floor 4963 -> 4970.
    Six mutations caught and two escapes closed by new tests rather than
    by softened comments.

- id: ADR-207
  title: Settled is a third marker, and the obvious extraction is often the one strict forbids
  date: 2026-10-20
  status: accepted
  context: |
    Two asks. First, seven tracker entries had sat under `- [ ]` for
    months while meaning the opposite of what the checkbox says: they
    record decisions to leave something alone. Second, the volume
    items — counts rather than questions — had been sequenced last on
    the grounds of low defect yield, which is a reason to order them
    and not a reason to skip them.
  decision: |
    D1. CODEBASE_FIXES.md HAS THREE MARKERS. `- [ ]` is open work,
        `- [x]` is done, and `- [=]` is SETTLED: a decision with a
        reopen condition. Each settled entry carries a quoted block
        saying how it was settled, what a future session must not do,
        and what would reopen it. Nothing parses these markers, so the
        change is for readers.

    D2. ANY-3 CLOSES BY RESTATING THE SHAPE LOCALLY. Of the three
        routes the entry listed, two are decisions about the whole
        fleet and the third is what the `any` already stood for. The
        local interfaces describe only the fields this component sets.

    D3. A PUBLIC SETTER THAT NARROWS A STRING CHECKS AT RUN TIME.
        `type as any` into a nine-member union let an unrecognised
        aggregate be stored and then compute nothing.

    D4. AN UNCONDITIONAL STARTING VALUE GOES ON THE FIELD. TreeGrid's
        constructor was 60 lines and 45 of them depended on nothing.
  consequences: |
    THE SETTLED MARKER IS A FIX FOR AN ENCODING ERROR, NOT A FILING
    ONE. An unchecked box reads as "somebody should do this" and every
    one of these meant "do not". DEBT-WEB-2 is the clearest: it records
    a colour choice the user made deliberately and exists so nobody
    corrects it. Filing a standing decision under an open-work marker
    invites exactly the edit the entry was written to prevent.

    ALL 14 OVERSIZED FUNCTIONS ARE NOW AT OR UNDER 30 LINES, and the
    March counts were accurate — every one had grown slightly, which is
    what a list with no gate behind it does.

    THE OBVIOUS EXTRACTION WAS THE ONE `strict` FORBIDS. Moving
    TreeGrid's 45 field assignments into an `initState()` helper fails
    `strictPropertyInitialization`, because TypeScript does not follow
    assignment into a called method. Taking it would have meant 40
    definite-assignment assertions: the type system told to stop
    checking a class it was checking correctly. Declaration
    initialisers are where those values belong, and the constructor
    drops to what actually reads `options`.

    NOT ONE TEST WAS EDITED FOR ANY OF THE 14. An extraction that needs
    a test changed is not an extraction.

    ANY-3 CLOSES AT ZERO on both ratchets, and the two casts were the
    half worth doing: an unrecognised aggregate kind was stored and
    silently computed nothing, so the footer rendered and was always
    empty. Three tests, one mutation-proven.

    5260 tests across 162 files, 32 of 32 structure checks, testBlocks
    floor 4970 -> 4973. Open tracker items 19 -> 8, of which 7 moved to
    SETTLED rather than being worked.

- id: ADR-208
  title: Classify an override by what it overrides, not by whether a comment sits near it
  date: 2026-10-20
  status: accepted
  context: |
    IMP-1 deferred 29 `!important` declarations in 8 component
    stylesheets. The owner asked whether markdowneditor and chartpanel
    were overriding external components before the entry called the
    declarations unnecessary. They were. Checking that question pulled
    the whole classification apart, and then the rule behind it.
  decision: |
    D1. CODING_STYLE.md NOW NAMES FIVE EXCEPTIONS, BECAUSE THE RULE IT
        HAD WAS UNSATISFIABLE. It said "Never use `!important` in
        component SCSS ... The only exception is utility classes in the
        theme itself". Thirteen declarations in this repository cannot be
        written any other way. Six override Bootstrap utilities, which
        Bootstrap emits with `!important` already, and six override an
        inline style that differs, which no selector outranks. Three more
        can only be `!important` or deleted, because there the inline
        value equals the rule and a plain version would be permanently
        shadowed. A standard that forbids the only possible spelling is a
        standard that gets ignored.

    D2. THE TRACKER CITED A RULE THAT WAS NEVER WRITTEN. The entry's
        first line read "Per CODING_STYLE.md, `!important` should only be
        used when overriding third-party styles or for accessibility
        critical rules". CODING_STYLE.md granted neither exemption. IMP-2
        was settled and IMP-3 was closed against invented text, and
        IMP-1's 29 was the residue. A paraphrase of a standard is not the
        standard, and this one drifted far enough to invert the rule.

    D3. SORT BY TARGET, NOT BY COMMENT PROXIMITY. The old split asked
        whether a comment sat near the declaration. A comment documents a
        justification and is not one. Sorted by what each declaration
        overrides, the 54 fall into five buckets and only 5 are in-house
        specificity bugs. markdowneditor read as 11 offenders when all 17
        of its declarations are the same Vditor override.

    D4. AN INLINE STYLE IS A SEPARATE CATEGORY, AND THE ENTRY'S OWN
        ADVICE IGNORED IT. The entry suggested fixing stacklayout with
        `.stacklayout-panel.stacklayout-panel-collapsed`. No selector at
        any specificity beats an inline declaration, and
        `stacklayout.ts:420-422` sets the flex longhands inline on the
        same element that carries the class. The pattern repeats in
        splitlayout, ribbonbuilder, chartpanel and treegrid, whose drag
        rule beats the inline `cursor: pointer` on sortable headers.
        Checking it needs the component's TypeScript, not its stylesheet.
        Checking WHETHER THE INLINE DISAGREES is a second step: in
        stacklayout and splitlayout it does not, so those rules are
        `!important` or deleted rather than `!important` or broken.

    D5. THE VARIABLE LAYER IS THE ROUTE FOR BOOTSTRAP, AND ITS BOUNDARY
        IS THE THIRD-PARTY STYLESHEET. `custom.scss` imports
        `_variables.scss` before Bootstrap, the compiled output carries
        `--bs-border-radius:4px`, and not one of the 54 is a Bootstrap
        component token restated in a component file. Vditor and
        Driver.js ship their own CSS and never see those variables, which
        is why every radius override in the set is on a `.vditor*`
        selector.

    D6. `scssImportantComponents` IS A CEILING AND NOT A DEFECT COUNT.
        47 of its 54 are permitted. A fall in the number is not progress
        and no count in `audit-counts.mjs` isolates the 7, because the
        split depends on inline styles set from TypeScript.
  consequences: |
    IMP-1 goes from a stated 29 in 8 files to 5 in 2 files, with no code
    changed and no ratchet moved. graphcanvas's 4 are checkable today
    through `getComputedStyle(rect).stroke` in Playwright, so the
    "unverifiable without screenshots" deferral never applied to the
    largest part of the real target. The missing visual suite still
    blocks the rest.

    Two dead lint directives surfaced: `ribbonbuilder.scss:417` and
    `:429` disable a stylelint rule, and stylelint is in neither
    `package.json` nor any config file.

    Fourth deferral this month whose premise did not survive being read,
    after DEBT-SEC-3, graphminimap's 2D context and this entry's own
    missing visual suite. The first three were caught by re-measurement.
    This one was caught by the owner asking a question the count was
    never built to answer.

- id: ADR-209
  title: A computed value is checkable, so the visual deferral never covered what it claimed
  date: 2026-10-20
  status: accepted
  context: |
    ADR-208 left IMP-1 at 5 declarations in 2 files and repeated the
    standing deferral: removing the keyword changes specificity,
    specificity changes are visual, and this repository has no
    visual-regression suite. ADR-208 also introduced a requirement in
    CODING_STYLE.md that every permitted use carry a comment naming its
    case, with about 40 declarations not carrying one and nothing
    checking it.
  decision: |
    D1. `getComputedStyle` REPLACES THE SCREENSHOT SUITE FOR THIS CLASS
        OF WORK. "Specificity changes are visual" is true of colour and
        spacing judgements and false of a computed value. The cascade
        resolves to a number or a colour, and that is the only thing a
        specificity change can alter. Five Playwright assertions in
        `tests/important-removal.spec.ts` pin what each removed keyword
        used to force. The deferral was never about verifiability. It was
        about nobody having looked for the cheaper check.

    D2. EVERY ONE OF THE FIVE WAS BEATING NOTHING. graphcanvas's 4 were
        claimed to be losing to `.gc-node:hover rect` at (0,2,1). That
        rule sets `stroke-width` to the same 2.5 and sets no `stroke`,
        and the only other source is a presentation attribute that loses
        to any CSS rule. ribbon's 1 duplicated an inline `display: flex`
        set by `ribbon.ts:2647` on content appended to `rootEl`, where
        the hide rule no longer matches.

    D3. TREEVIEW NEEDED NO SPECIFICITY CHANGE AT ALL, AND A MUTATION IS
        HOW WE KNOW. An element compound was written first, on the
        reasoning that (0,1,1) beats `.form-control-sm` at (0,1,0).
        Reverting it changed no computed value, because this stylesheet
        loads after Bootstrap and source order already settled the tie.
        The compound came out. A specificity argument that is never
        tested is a guess with notation on it.

    D4. A REQUIREMENT WITHOUT A COUNT IS A SENTENCE. The comment rule
        introduced in ADR-208 is now `scssImportantUncommented` with a
        ceiling of zero, and all 44 remaining declarations carry an
        `important-case: N` tag. The helper is exported and pinned by
        seven tests, including the Allman case, and a mutation that
        narrows its search from the block to the line fails four of them.

    D5. A DEAD DECLARATION IS DELETED AND ITS INTENT IS RECORDED, NOT
        GUESSED. `height: 22px` on the rename input never applied,
        because `.form-control-sm` sets `min-height` and `min-height`
        beats `height`. Restoring the intent means setting `min-height`
        too, which changes how renaming looks in every tree. DEBT-TV-1
        holds the question and the test pins the 29.7188px the field
        actually renders at.
  consequences: |
    IMP-1 closes at zero. 54 declarations became 44, `scssImportant` fell
    108 to 103 and `scssImportantComponents` 50 to 45, and the two
    ratchets now sit beside a third that holds the documentation rule.

    One new defect, DEBT-TV-1, found while removing a keyword rather than
    by looking for it.

    5270 unit tests in 162 files, 5 Playwright assertions, 32 of 32
    structure checks, testBlocks floor 4976 to 4983.

- id: ADR-210
  title: A connection hint is not a subresource, and a module specifier is not a tag
  date: 2026-10-20
  status: accepted
  context: |
    DEBT-SEC-8 held at 17 third-party tags with no integrity hash, with a
    stated floor of 10 because ten sit in dated planning documents. The
    owner asked for the remaining tech debt to be worked through starting
    here, leaving PAT-1 until last.
  decision: |
    D1. `cdnTagsIn` SKIPS `preconnect` AND `dns-prefetch`. Both open a
        connection and fetch no bytes, so there is no body to hash and the
        HTML spec defines no `integrity` for either. SEVEN OF DEBT-SEC-8's
        SEVENTEEN WERE THESE, and the only way to clear one was to delete
        a performance hint. `preload` and `modulepreload` stay counted,
        because both fetch and both accept `integrity`.

    D2. DEBT-SEC-8 CLOSES AT ITS OWN FLOOR. 17 to 10, and the entry had
        already written "do not chase it below 10" because the remaining
        ten are `specs/*.prd.md` history. The file set is NOT narrowed to
        reach zero, because `unpinnedCdnRefs` shares it and that ceiling
        was not measured for this change. It did not move.

    D3. TWO DEAD PRECONNECTS ARE DELETED. `conversation` and
        `markdowneditor` pointed at `unpkg.com` and loaded nothing from it
        after ADR-190 and ADR-199 moved dompurify and vditor to `/lib/`. A
        hint to a host you no longer use costs a connection and tells that
        host a visitor arrived.

    D4. THE ES-MODULE SPECIFIERS GET THEIR OWN CEILING, DEBT-SEC-9. 67
        across five files, 14 distinct packages, all CodeMirror from
        esm.sh. `thirdPartyTagsWithoutSri` matches TAGS and a specifier is
        not a tag, so this population was invisible to every gate while
        being described accurately in prose by both DEBT-SEC-8 and the
        `unhashable` key in `scripts/third-party-sri.json`. The
        description was right and nothing re-derived it, which is the
        fourth time a count here has been named for one population and
        measured another.

    D5. THE CEILING HOLDS RATHER THAN DRIVES TO ZERO, AND THE REASON IS
        STATED PRECISELY. `import()` takes no integrity argument and a
        static specifier has no attributes. Import maps DO define an
        `integrity` key, so this is a support problem rather than an
        impossibility, and the entry says so instead of saying "cannot".

    D6. VENDORING IS NOT DECIDED HERE. Fourteen CodeMirror packages into
        `dist/lib` would remove the CDN, the unhashed load and the
        floating `@6` in one move, at a real bundle cost for a component
        many consumers will not use. That is a product decision.
  consequences: |
    DEBT-SEC-8 closes. DEBT-SEC-9 opens holding 67.
    `thirdPartyTagsWithoutSri` 17 to 10, `unpinnedCdnRefs` unmoved at 77,
    `tagsMissingSri` still 0.

    Thirteen new tests across the two counters. A mutation removing the
    connection-hint filter fails three, and a mutation dropping the
    import-operator guard fails one.

    The stated figure in DEBT-SEC-8 and in the `unhashable` key said
    fifteen specifiers. There are fourteen distinct.

    NO SHIPPED COMPONENT LOADS FROM A CDN AT RUNTIME, verified across
    every `components/*/*.ts`. The exposure is in what this repository
    demonstrates and documents.

- id: ADR-211
  title: The fix was never to hash a specifier, it was to stop having specifiers
  date: 2026-10-20
  status: accepted
  context: |
    ADR-210 opened DEBT-SEC-9 holding 67 third-party ES-module specifiers
    and recorded vendoring as a product decision for the owner. The owner
    chose to vendor, in these words: "With AI agents, anything and
    everything exploitable is going to get exploited. Since we build
    enterprise and personal management software, it is best to do our
    best/maximal on security to lock things down versus leave things open
    just because we believe it is safe."
  decision: |
    D1. CODEMIRROR 6 IS VENDORED. Fourteen packages, one esbuild IIFE,
        640 KB, 28 inputs, 0 external. The closure is asserted from
        esbuild's metafile, so the build refuses to publish an artifact
        that still resolves anything at run time.

    D2. THE BUNDLE PUBLISHES BARE GLOBALS, NOT A NAMESPACE. Every other
        vendored asset publishes one name. CodeEditor probes about thirty
        bare names, so a namespace would have left every consumer writing
        the thirty lines of glue the CDN version needed. That glue was 14
        of the 67, in a README consumers copy. Hashed-and-verbose would
        have missed the point.

    D3. THE README'S GLUE WAS BROKEN, AND HAD BEEN. It assigned the bare
        name `history`. `window.history` is a read-only accessor on
        `Window`, so the assignment silently fails, and the component
        rejects the browser's History object because it is not a function.
        Anyone following the README had an editor with no undo and no
        error. The vendored bundle publishes `cmHistory` and `cmSearch`
        itself.

    D4. `check-closure.mjs` GAINS THE URL-FIRST DIRECTION. It was
        hash-first and SKIPPED any tag whose integrity it did not
        recognise, so mutating a published hash in a README passed the
        gate and only dropped the inspected count by one. A hash in
        documentation was decoration. The new check found two real
        defects at once: two guides handed consumers font-awesome tags
        with a placeholder where the hash belongs.

    D5. THE `unhashable` KEY IS EMPTIED AND ITS COMMENT RECORDS WHY. It
        held codemirror6 on the reasoning that integrity cannot attach to
        an import specifier. True, and the conclusion did not follow. Its
        old note said a consumer could bundle CodeMirror or self-host and
        that "neither is something this repository can do on their
        behalf". Both were.
  consequences: |
    `cdnModuleSpecifiers` 67 to 0. `unpinnedCdnRefs` 77 to 10, a fall of
    67 as a side effect, because the esm.sh URLs floated at major 6 and
    were most of what that count measured. `thirdPartyTagsWithoutSri`
    stays 10, `tagsMissingSri` stays 0.

    `dist/lib/codemirror6-6.43.15.js` is 640 KB. The filename carries
    `@codemirror/view`'s version because fourteen packages ship on their
    own trains, and the manifest row records all fourteen member versions
    so the file is auditable without unpacking it.

    Three new Playwright assertions prove the bundle WORKS rather than
    merely loads: every probed global is present, no code arrives from a
    third-party CDN, and undo restores typed text, which is the
    regression test for D3.

    STILL THIRD-PARTY AT RUN TIME: `guidedtour.html` loads driver.js from
    jsdelivr with a hash, and most demo pages load Google Fonts. Fonts
    are a population no count here covers and are the obvious next
    candidate under the same reasoning.

- id: ADR-212
  title: A no-op implementation tells a duck-typed protocol the opposite of the truth
  date: 2026-10-20
  status: accepted
  context: |
    DEBT-LAY-1 recorded that AnchorLayout, BorderLayout, BoxLayout and
    CardLayout each declare `private contained = false` and a public
    `setContained(value)` that assigns it, and that none of them ever
    reads the field. It was recorded rather than taken because the fix
    needed a protocol question answered first: what should "contained"
    mean for a layout that already fills the element it was given?
  decision: |
    D1. THE ANSWER IS "NOTHING", AND IT IS MEASURED. `contained` means
        fill the parent instead of `document.body`. Toolbar has one
        `document.body.appendChild` and Sidebar has two. The four layouts
        have ZERO between them, so they always fill their parent and the
        flag has nothing to decide.

    D2. THE FIELD AND THE SETTER ARE DELETED, NOT IMPLEMENTED. Every
        caller is duck-typed, in all nine layouts and in
        `DockLayout.mountComponent`. A protocol that asks whether a
        component HAS a capability is answered correctly by a component
        that does not implement it, and answered FALSELY by one that
        implements it as a no-op.

    D3. THE BREAK IS ACCEPTED AND NAMED. `setContained(value)` was in all
        four public API tables as "Set contained mode". No behaviour
        changes, because it set nothing. A direct caller now gets a
        TypeError rather than silence, which is the owner's standing rule
        that a broken thing should break.

    D4. THE ABSENCE IS PINNED AS A CONTRACT, WITH A CONTROL. A test that
        only asserts the four do not implement the method would also pass
        against a codebase where nothing implements the protocol, so a
        second test asserts Toolbar still does.
  consequences: |
    `unusedLocals` 305 to 301, one per layout, independently confirming
    that all four fields were unread.

    Four READMEs lose a row and `COMPONENT_REFERENCE.md` is regenerated.

    Two new tests, mutation-proven: re-adding a no-op setter to CardLayout
    fails the absence assertion.

- id: ADR-213
  title: Six stand-ins verified one by one, and a ceiling so the number cannot grow in silence
  date: 2026-10-20
  status: accepted
  context: |
    DEBT-TEST-1c reported 6 suites that write a global another component
    owns without importing that component, down from 11, and asserted
    that all six remaining were correct. Nothing had checked that claim
    since it was written, and nothing held the number.
  decision: |
    D1. ALL SIX ARE CORRECT, AND EACH WAS CHECKED RATHER THAN TRUSTED.
        `formdialog` DELETES the global to prove a dirty form refuses.
        `ribbonbuilder` stubs, deletes, and asserts undefined.
        `diagramengine` records what the engine handed the renderer.
        The three `spinemap` cases plant factories that throw, to prove
        the error propagates with its cause attached. In every one the
        stub is the SUBJECT of the test.

    D2. THAT IS THE LINE AGAINST THE DEFECT THE CENSUS WAS BUILT FOR.
        The pre-fix GraphToolbar suite asserted on values its own fake
        Toolbar produced, so nine real assertions measured the suite
        rather than the component. Here the assertions are about how the
        component REACTS to an absent, throwing or recording dependency.

    D3. `siblingStandIns` IS A CEILING AT 6, NOT A TARGET OF ZERO.
        Driving it to zero means deleting refusal tests, and the refusal
        tests are what caught FALLBACK-1 through FALLBACK-14. The ceiling
        exists so the population cannot grow unobserved, which is how the
        GraphToolbar defect survived in the first place.

    D4. THE ENTRY IS SETTLED RATHER THAN CLOSED, because 6 is a standing
        decision with a condition: any seventh needs the same one-by-one
        check, asking whether the assertions are about the component or
        about the stub.
  consequences: |
    A new ceiling in `audit-counts.mjs`, mutation-proven: planting one
    sibling stand-in in an unrelated suite takes the count to 7 and trips
    it.

    No test changed and no component changed. The work was verification
    and enforcement.

- id: ADR-214
  title: The exemption list reached zero, and the last three blockers were claims nobody had opened a file to check
  date: 2026-10-20
  status: accepted
  context: |
    DEBT-DUI-4 held three components out of the fleet conformance gate:
    diagramengine, dynamicformswitcher and markdowneditor. ADR-160
    re-measured all sixteen original blockers in October and eleven did
    not survive. ADR-206 then showed that graphminimap's had survived
    that pass only because it read plausibly, and both halves of it were
    false.
  decision: |
    D1. NONE OF THE THREE SURVIVED A RE-READ OF THE CODE. diagramengine's
        blocker required a GraphCanvas handle no option asks for — the
        sentence is graphminimap's verbatim — and waited on a phase that
        completed on 2026-08-03 doing the runtime bundle and
        DynamicCanvas, never the embed registry. The registry is
        orthogonal: it lets a DIAGRAM embed other components, and it is
        reached only from the consumer-called loadEmbedPack.

    D2. A "DESIGN QUESTION" IS NOT A BLOCKER WHEN ONE OPTION IS NOT
        EXPRESSIBLE. dynamicformswitcher's asked whether to declare one
        affords entry per field type or one for the form. affords.shape
        is a DataShape, a closed vocabulary of ten, and "text",
        "password" and "url" are HTML input types that are not in it.
        What the component renders is one variant's worth of named
        values, which is a record.

    D3. ONE MISSING KEYWORD HID A PUBLIC FUNCTION FROM TWO SCANS.
        createMarkdownEditor was on window, in COMPONENT_INDEX.md, and
        called by seven demo pages, but the function was declared
        without `export`. The gate resolves mod[manifest.factory], so it
        saw nothing. "No factory is exported" and "migration adds to the
        public surface" are two claims and the second does not follow.

    D4. THE EXPORT FOUND A DEFECT ON ITS FIRST RUN. With the keyword
        added, factory-census could see the factory and ERR-1 failed:
        createMarkdownEditor logged and returned null on a missing
        container, against a ceiling of zero. Every sibling throws. It
        throws now.

    D5. FALLBACK-15. MarkdownEditor's editing modes substituted a plain
        textarea for the editor when Vditor was absent, styled by the
        component's own SCSS and read back through getValue(). A notice
        DECLARES the failure; a textarea SUBSTITUTES for the component.
        Four sweeps touched this file without seeing it, including
        ADR-201, which made getHTML() throw on exactly the reasoning
        that applies to getValue() three methods above it.

    D6. THE EMPTY EXEMPT SET STAYS IN THE FILE. It is where a new
        exemption would have to be written down, and the comment above
        it is the rule. AGENTS.md held up graphminimap's falsified
        blocker as the model of a good one; the passage now says that a
        testable blocker is still only a claim.
  consequences: |
    The gate reads 101 of 101 in-scope components migrated, 0 exempt, 24
    permanently excluded. Two of the three migrations needed no change to
    the component's source.

    Three manifests, one conformance fixture, one factory made to throw,
    one substitution removed, six refusal tests with two mutations each
    catching two of them.

    The testBlocks floor rises 4999 -> 5005.

- id: ADR-215
  title: The bucket named for a title never read one, and emptying it took two corrections to the rules that replaced it
  date: 2026-10-20
  status: accepted
  context: |
    DEBT-TEST-1b reported 236 test blocks where every assertion passes
    for any value that is not null, split four ways by shapeOf in
    scripts/test-assertions.mjs. The largest actionable bucket,
    namesAChange, held 35 and was described in the tracker as "name
    states a change — contracts to read".
  decision: |
    D1. namesAChange WAS THE FALL-THROUGH AND 21 OF ITS 35 MEMBERS HAD
        TITLES STATING NO CHANGE. shapeOf returned it for every
        .not.toThrow() block that was neither idempotent nor
        dependency-withheld, whatever the title said. The doc comment
        above the code had described the intended rule for two days —
        "the title states an effect the body never looks for" — and the
        code never read a title. A count named for one population while
        measuring another, inside the instrument built to stop that.

    D2. THE CASE PINNING THE BUCKET COULD NOT FAIL. It asserted that
        setFilters_UpdatesFilterState lands in namesAChange, which held
        for any .not.toThrow() body. It now asserts both directions.

    D3. ROBUSTNESS-ONLY IS A SEPARATE QUESTION, NOT A WEAKER VERSION OF
        THE SAME ONE. importInvalidJSON_DoesNotCrash does what it says;
        the open question is whether survival is enough, and each such
        block has one invariant worth a line. That is not the question
        an unchecked effect asks.

    D4. THE PAIRING RULE OVER-CLAIMED TWICE AND BOTH CORRECTIONS ARE
        PINNED. Scoped to the describe alone it claimed
        "resize does not throw", because that block's describe refuses
        a bad CONTAINER — a refusal about createDiagramEngine, not
        about resize. That is ADR-203's per-file mistake one level
        finer, so the callee must match. Then treegrid's
        deeplyNestedNodes_RendersWithoutCrash paired on createTreeGrid
        while accepting and refusing on different dimensions, so a
        survival title now outranks a pairing. The name is the fact and
        the pairing is the hypothesis, which is the rule idempotency
        already followed.

    D5. TWO OF THE 14 WERE NEVER DEFECTS, AND THEY ARE DIFFERENT KINDS
        OF FALSE POSITIVE. wiring's "accepts a binding naming a
        registered transform" is the accept half of an accept/refuse
        pair; the instrument now recognises that on its own merits
        rather than through the withheld-globals proxy that found only
        the six in nofallback suites. dynamiccanvas-anchors carried a
        real query behind a one-line helper the predicate cannot see;
        it was strengthened on its merits instead, by watching
        Element.prototype.querySelector and asserting no call carried
        the hostile fragment.

    D6. richtextinput.focus() IS CORRECT AND JSDOM CANNOT SEE IT.
        Measured: jsdom will not focus a contenteditable div with no
        tabindex, focuses the same div once one is added, and focuses
        an input either way. A real browser focuses a contenteditable
        without one. Adding a tabindex to the COMPONENT to make a test
        observable would be the test driving the product.

    D7. JSON.stringify NOT THROWING IS NOT SERIALISABILITY. It returns
        undefined for a function and silently drops one inside an
        object. All ten conformance samples must now survive
        JSON.parse(JSON.stringify(x)) unchanged.
  consequences: |
    namesAChange 35 -> 0 and robustnessOnly 21 -> 2.
    testsThatCannotFail 236 -> 204. The remaining buckets are 110
    idempotent, 85 existence, 2 robustnessOnly, 6 absentDependency and
    1 positiveControl.

    D8. THE TWO robustnessOnly SURVIVORS ARE A MEASURED JSDOM FLOOR.
        diagramengine's resize and zoomToFit both read
        getBoundingClientRect, which jsdom answers with zeros — a
        probe showed zoom 1 before and after, no viewBox at all, and
        an svg sized in percentages. The zoomToFit claim moved to
        tests/diagramengine.spec.ts, mutation-proven by deleting the
        call.

    D9. THE existence BUCKET IS NOT "near zero yield", AND THE SAME
        DEFECT LIVES THERE. shapeOf splits on the MATCHER first, so
        the title is read only inside the .not.toThrow() family: a
        block named for an effect whose body says
        expect(h).toBeDefined() lands in existence and is never asked
        whether its title is true. A crude predicate flags 47 of 85
        and overcounts; reading the list, about 25 are plainly
        actionable, including datagrid's sort_ByColumn_SortsAscending,
        where nothing checks the order. The entry stays OPEN rather
        than settling, because settling would have rested on a
        prediction the first sample contradicted.

    D10. AN ASSERTION INSIDE A CONDITION IS A THIRD SHAPE, AND NO
        NUMBER IS RECORDED FOR IT. latexeditor's symbolCells_HaveAriaLabel
        reads `if (cells.length > 0) { expect(...) }`. When the
        condition does not hold the block asserts nothing, and
        testsWithoutAssertion reads 0 because it counts `expect(`
        textually. Two confirmed by reading; quantifying it needs an
        instrument, so the entry records the two rather than a guess.

    D11. toolcolorpicker's setValue AFTER destroy RETURNS QUIETLY, AND
        THAT IS A FLEET-WIDE CONVENTION QUESTION rather than one to
        settle inside a test. ADR-200's discriminator argues a named
        request should refuse. The test asserts the behaviour that
        exists — nothing is resurrected — and the question is written
        down.

    Twelve tests rewritten, each mutation-proven against the change it
    now claims. Three new cases pin the pairing rule and one pins the
    title-over-pairing order.

    DEBT-STI-2 was first written up as a decision to hand back and was
    not one. RichTextInput declares `activation?: Record<string,
    unknown>` and forwards it to register() unchecked, and the README
    documents six defaults; both already said the fields were optional
    and only the code that makes it true was missing. The demo proved
    it rather than a hypothetical consumer: demo/full-demo.html
    registered its mention and issue triggers with the field names of
    an older API, and typing "@" in that rich text input has never
    shown a menu. register() now fills the documented defaults and
    REFUSES an unknown key by name, because defaulting around a
    misspelled `minLength` would leave a trigger working and quietly
    not doing what its author asked for.

    The parser-coverage guard caught the new fixtures: a line beginning
    with `test(` inside a template literal reads as a declaration, so
    the fixtures are concatenated instead.
