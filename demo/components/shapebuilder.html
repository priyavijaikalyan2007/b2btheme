<!--
  COMPONENT: DemoPage-ShapeBuilder
  PURPOSE: Standalone demo page for the ShapeBuilder component.
  RELATES: [[ShapeBuilder]], [[DemoShell]]
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShapeBuilder - Enterprise Theme Demo</title>

    <!-- FOUC prevention -->
    <script>
    (function()
    {
        var mode = sessionStorage.getItem("theme-mode") || "auto";
        var dark = mode === "dark" ||
                   (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) { document.documentElement.setAttribute("data-bs-theme", "dark"); }
    })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../dist/css/custom.css">
    <link rel="stylesheet" href="../../dist/icons/bootstrap-icons.css">
    <link rel="stylesheet" href="../../dist/components/themetoggle/themetoggle.css">
    <link rel="stylesheet" href="../../dist/components/diagramengine/diagramengine.css">
    <link rel="stylesheet" href="../shared/demo-shell.css">
</head>
<body class="demo-shell-body">

    <header class="demo-header">
        <h1 class="demo-header-title">
            <a href="../index.html"><i class="bi bi-arrow-left"></i></a>
            ShapeBuilder
        </h1>
        <div class="demo-header-actions">
            <a href="../index.html" class="demo-back-link">
                <i class="bi bi-grid-3x3-gap"></i> All Components
            </a>
            <div id="demo-theme-toggle"></div>
        </div>
    </header>

    <main class="demo-main">

        <div class="demo-section" id="shapebuilder-section">
            <h2>Shape Builder</h2>
            <p class="text-muted mb-3">Same DiagramEngine in shape designer mode. Draw shapes with pen tool, refine with brush, then export as stencil pack definitions.</p>

            <!-- Tool buttons -->
            <div class="mb-2">
                <strong class="me-1" style="font-size: 12px;">Tools:</strong>
                <button class="btn btn-sm btn-primary" id="sb-tool-select" title="Select tool"><i class="bi bi-cursor"></i> Select</button>
                <button class="btn btn-sm btn-outline-secondary" id="sb-tool-pen" title="Pen tool"><i class="bi bi-vector-pen"></i> Pen</button>
                <button class="btn btn-sm btn-outline-secondary" id="sb-tool-brush" title="Brush tool"><i class="bi bi-brush"></i> Brush</button>
                <button class="btn btn-sm btn-outline-secondary" id="sb-tool-draw-rect" title="Draw rectangle"><i class="bi bi-square"></i> Rect</button>
                <button class="btn btn-sm btn-outline-secondary" id="sb-tool-draw-ellipse" title="Draw ellipse"><i class="bi bi-circle"></i> Ellipse</button>
                <span class="ms-2 me-1">|</span>
                <button class="btn btn-sm btn-outline-info" id="sb-zoom-fit" title="Zoom to fit all"><i class="bi bi-arrows-fullscreen"></i> Zoom to Fit</button>
                <button class="btn btn-sm btn-outline-success" id="sb-export-json" title="Download JSON file"><i class="bi bi-filetype-json"></i> Export JSON</button>
            </div>

            <!-- Active tool indicator -->
            <div class="mb-2">
                <small class="text-muted">Active tool: <strong id="sb-active-tool-label">select</strong></small>
            </div>

            <div id="demo-shapebuilder" style="height: 400px; border: 1px solid var(--theme-border-color);"></div>
        </div>

    </main>

    <script src="../../dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../dist/components/themetoggle/themetoggle.js"></script>
    <script src="../shared/demo-shell.js"></script>
    <script src="../../dist/components/diagramengine/diagramengine.js"></script>

    <script>
    (function() {
        "use strict";
        var LOG = "[ShapeBuilder Demo]";

        // ====================================================================
        // Shared utility — file download
        // ====================================================================

        /**
         * Triggers a file download from a Blob.
         *
         * @param {Blob} blob - The data blob.
         * @param {string} filename - Suggested filename.
         */
        function downloadBlob(blob, filename)
        {
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            console.log(LOG, "Downloaded:", filename);
        }

        // ====================================================================
        // Shape Builder Demo
        // ====================================================================
        var SB_LOG = "[ShapeBuilder Demo]";
        var sbContainer = document.getElementById("demo-shapebuilder");

        if (!sbContainer)
        {
            console.warn(SB_LOG, "Container #demo-shapebuilder not found");
            return;
        }

        var builder = createDiagramEngine(sbContainer, {
            grid: { visible: true, size: 10, style: "lines" },
            editable: true,
            resizable: true,
            rotatable: true,
        });

        console.log(SB_LOG, "Engine created with fine grid (10px, lines)");

        // Pre-populate with arrow and chevron shapes for editing
        builder.addObject({
            semantic: { type: "custom-shape", data: { name: "Right Arrow" } },
            presentation: {
                shape: "arrow-right",
                bounds: { x: 80, y: 80, width: 200, height: 90 },
                style: {
                    fill: { type: "solid", color: "rgba(28, 126, 214, 0.15)" },
                    stroke: { color: "#1c7ed6", width: 2 },
                },
                textContent: {
                    runs: [{ text: "Arrow Shape", fontSize: 12 }],
                    overflow: "visible", verticalAlign: "middle",
                    horizontalAlign: "center", padding: 8,
                },
            },
        });

        builder.addObject({
            semantic: { type: "custom-shape", data: { name: "Chevron" } },
            presentation: {
                shape: "chevron",
                bounds: { x: 340, y: 85, width: 180, height: 80 },
                style: {
                    fill: { type: "solid", color: "rgba(82, 183, 136, 0.15)" },
                    stroke: { color: "#52b788", width: 2 },
                },
                textContent: {
                    runs: [{ text: "Chevron Shape", fontSize: 12 }],
                    overflow: "visible", verticalAlign: "middle",
                    horizontalAlign: "center", padding: 8,
                },
            },
        });

        console.log(SB_LOG, "Pre-populated with", builder.getObjects().length, "shapes");

        // ====================================================================
        // Shape Builder — tool button wiring
        // ====================================================================

        var sbToolButtons = [
            { id: "sb-tool-select",       tool: "select",  shape: null },
            { id: "sb-tool-pen",          tool: "pen",     shape: null },
            { id: "sb-tool-brush",        tool: "brush",   shape: null },
            { id: "sb-tool-draw-rect",    tool: "draw",    shape: "rectangle" },
            { id: "sb-tool-draw-ellipse", tool: "draw",    shape: "ellipse" },
        ];

        var sbActiveLabel = document.getElementById("sb-active-tool-label");

        /**
         * Updates the Shape Builder active button highlight.
         *
         * @param {string} activeId - The ID of the active button element.
         * @param {string} toolName - Human-readable tool name for the label.
         */
        function updateSbActiveButton(activeId, toolName)
        {
            for (var i = 0; i < sbToolButtons.length; i++)
            {
                var btn = document.getElementById(sbToolButtons[i].id);

                if (!btn)
                {
                    continue;
                }

                if (sbToolButtons[i].id === activeId)
                {
                    btn.classList.remove("btn-outline-secondary");
                    btn.classList.add("btn-primary");
                }
                else
                {
                    btn.classList.remove("btn-primary");
                    btn.classList.add("btn-outline-secondary");
                }
            }

            if (sbActiveLabel)
            {
                sbActiveLabel.textContent = toolName;
            }

            console.log(SB_LOG, "Tool:", toolName);
        }

        for (var sb = 0; sb < sbToolButtons.length; sb++)
        {
            (function(cfg)
            {
                var btn = document.getElementById(cfg.id);

                if (!btn)
                {
                    return;
                }

                btn.addEventListener("click", function()
                {
                    if (cfg.shape)
                    {
                        builder.setDrawShape(cfg.shape);
                    }

                    builder.setActiveTool(cfg.tool);

                    var label = cfg.shape
                        ? cfg.tool + " (" + cfg.shape + ")"
                        : cfg.tool;

                    updateSbActiveButton(cfg.id, label);
                });
            })(sbToolButtons[sb]);
        }

        // Set initial active state
        updateSbActiveButton("sb-tool-select", "select");

        // Zoom to Fit
        document.getElementById("sb-zoom-fit").addEventListener("click", function()
        {
            builder.zoomToFit();
            console.log(SB_LOG, "Zoomed to fit");
        });

        // Export JSON
        document.getElementById("sb-export-json").addEventListener("click", function()
        {
            try
            {
                var json = builder.exportJSON();
                var blob = new Blob([json], { type: "application/json;charset=utf-8" });
                downloadBlob(blob, "shapebuilder.json");
            }
            catch (err)
            {
                console.error(SB_LOG, "JSON export failed:", err);
            }
        });

        console.log(SB_LOG, "Initialized");
    })();

    </script>
</body>
</html>
